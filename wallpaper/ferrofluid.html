 * The tiers overlap in threshold and in width so that no one of them switching
 * on is a visible step: on a surface whose facing hovers at a boundary, a tier
 * that carried a quarter of the brightness would pop on and off from frame to
 * frame along the whole edge. */
const SHEEN = [
  { min: 0.30, curve: 1.00, band: 15, peak: 0.075 },
  { min: 0.52, curve: 0.55, band: 7.0, peak: 0.11 },
  { min: 0.70, curve: 0.30, band: 3.6, peak: 0.19 },
  { min: 0.84, curve: 0.12, band: 2.0, peak: 0.46 },
  { min: 0.93, curve: 0.06, band: 1.3, peak: 0.72 },
  // The paper is white and the liquid is a mirror, so there is a second, far
  // fainter line low down where it reflects the page back at you.
  { max: -0.74, curve: 0.50, band: 3.0, peak: 0.20 },
];

/* A tier's band is stroked as a stack of narrowing lines rather than one line.
 *
 * A stroke has a hard edge, and a wide one at a flat alpha therefore paints a
 * step: at fifteen pixels across it is a grey ledge running parallel to the
 * whole outline, and the liquid comes out looking like a sticker with a bevel
 * on it. Several narrowing passes at a fraction of the alpha each accumulate
 * into a falloff instead, and no one of their edges is visible. Widths in
 * geometric progression so the steps are evenly spaced in the eye rather than
 * in pixels; anything that would land under a pixel wide is dropped, which is
 * what leaves the tightest tiers as the single hairlines they should be. */
const SHEEN_FALLOFF = [1, 0.62, 0.38, 0.22, 0.11];

for (const tier of SHEEN) {
  const widths = SHEEN_FALLOFF.map((f) => tier.band * f).filter((w) => w >= 0.8);
  // Alpha per pass such that all of them together reach the tier's peak.
  const a = 1 - Math.pow(1 - tier.peak, 1 / widths.length);
  tier.layers = widths.map((w) => [w, a]);
}

/* How much *surface*, in pixels, a normal is measured across.
 *
 * Not the neighbouring vertices, and not a fixed number of them either.
 * Marching-squares vertices land a fraction of a cell apart and each sits on a
 * grid edge, so the direction from one to the next is mostly a record of which
 * edge it happened to be; and counting five along is a different arc length
 * every time, because the spacing between vertices varies with the angle the
 * contour crosses the grid at. Both of those are noise that changes every
 * frame as the contour is re-extracted.
 *
 * There is a second, larger reason, and it is the one that set this number.
 * The metaball field ripples at the drop spacing — measured, the surface of a
 * pool at rest undulates 0.6 px RMS with a 9 px period. Six tenths of a pixel
 * is invisible as a shape. But a 0.6 px ripple over a 9 px period swings the
 * surface *normal* by ±35°, which is not invisible at all: the highlight
 * boiled along the whole edge of a liquid that was barely moving. Averaged
 * over a couple of ripple periods the swing is a few degrees and what is left
 * is the shape's own curvature. */
const NORMAL_LEN = 22;

/** How finely the sheen's brightness is quantised along a run. */
const SHEEN_STEPS = 5;

/* And a little further in again, because the silhouette is not stroked from
 * these points. It is drawn as quadratics through the segment midpoints,
 * which cuts every convex corner by up to half a grid cell — so a highlight
 * laid exactly on the polyline sits outside the shape it is meant to be
 * inside, and the clip takes it. Worse, it does not take all of it: what
 * survives sits on the clip's own antialiased edge at a fraction of its
 * coverage, so the glint that should be white comes out a mid grey and looks
 * like a bevel. This is that half cell. */
const sheenInset = () => num("sheenInset", mcell * 0.55);

let lamBuf = new Float32Array(2048), curBuf = new Float32Array(2048);
let nxBuf = new Float32Array(2048), nyBuf = new Float32Array(2048);
let arcBuf = new Float32Array(2049);

function growLoopBuffers(n) {
  if (n <= lamBuf.length) return;
  lamBuf = new Float32Array(n); curBuf = new Float32Array(n);
  nxBuf = new Float32Array(n); nyBuf = new Float32Array(n);
  arcBuf = new Float32Array(n + 1);
}

/** Outward normal, its agreement with the light, and the curvature, for a
 *  whole loop — everything the sheen needs, measured over a fixed arc length
 *  rather than a fixed number of vertices. */
function loopLighting(loop) {
  const n = loop.length / 2;
  growLoopBuffers(n);

  // Arc length along the loop, so a span can be asked for in pixels.
  arcBuf[0] = 0;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    arcBuf[i + 1] = arcBuf[i] + Math.hypot(loop[j * 2] - loop[i * 2],
                                           loop[j * 2 + 1] - loop[i * 2 + 1]);
  }
  const total = arcBuf[n];
  // A loop shorter than the measuring span is a bead: it has no large-scale
  // shape to find, so the span becomes the whole of it.
  const half = Math.min(NORMAL_LEN, total * 0.45) * 0.5;

  /* Arc length at any index, including the ones off either end: the loop is
   * closed, so walking past the last vertex is walking past the first. */
  const arcAt = (k) => k < 0 ? arcBuf[k + n] - total
                    : k > n ? arcBuf[k - n] + total
                    : arcBuf[k];

  const lx = light.x, ly = light.y;
  // Two pointers, each monotone, so the whole loop costs one pass.
  let lo = -n, hi = 0;
  for (let i = 0; i < n; i++) {
    const s = arcBuf[i];
    while (arcAt(hi) - s < half && hi < i + n) hi++;
    while (s - arcAt(lo) > half) lo++;
    const a = ((lo % n) + n) % n, b = hi % n;
    const tx = loop[b * 2] - loop[a * 2], ty = loop[b * 2 + 1] - loop[a * 2 + 1];
    const m = Math.hypot(tx, ty) || 1;
    // Interior on the left, so the outward normal is to the right of travel.
    const nx = -ty / m, ny = tx / m;
    nxBuf[i] = nx; nyBuf[i] = ny;
    lamBuf[i] = nx * lx + ny * ly;
    /* Curvature, as the shortfall of the chord against the arc it subtends.
     * On a straight run the two are equal and this is zero; the tighter the
     * turn, the more arc there is per unit chord. Normalised so that a
     * half-circle of the measuring span reads as 1. */
    const arc = Math.min(arcAt(hi) - arcAt(lo), half * 4);
    curBuf[i] = arc > 1e-3 ? Math.min(1, Math.max(0, 1 - m / arc) * 3.4) : 0;
  }
  return n;
}

function drawSheen(g, loops) {
  const gloss = Math.min(1.4, CONFIG.gloss);
  const inset = sheenInset();
  g.lineJoin = "round"; g.lineCap = "butt";
  for (const loop of loops) {
    const n = loop.length / 2;
    if (n < 6) continue;
    loopLighting(loop);
    for (let t = 0; t < SHEEN.length; t++) {
      const tier = SHEEN[t], up = tier.max === undefined;
      /* A run is a stretch that is both in this tier and at the same
       * brightness within it — brightness being quantised, because a stroke
       * carries one alpha and the alternative is a separate stroke per
       * vertex. Five steps is fine enough that the seams do not read. */
      let run = 0, from = 0, step = -1;
      for (let i = 0; i <= n; i++) {
        let s = -1;
        if (i < n && (up ? lamBuf[i] > tier.min : lamBuf[i] < tier.max)) {
          const w = tier.curve + (1 - tier.curve) * curBuf[i];
          s = Math.max(0, Math.min(SHEEN_STEPS, Math.round(w * SHEEN_STEPS)));
        }
        if (s === step && s >= 0) { run++; continue; }
        if (run >= 3 && step > 0) {
          const k = (step / SHEEN_STEPS) * gloss;
          for (let L = 0; L < tier.layers.length; L++) {
            const w = tier.layers[L][0];
            /* Set in by half its own width, so the whole of the line lands
             * inside the liquid. Centred on the contour instead, half of
             * every stroke falls outside and is taken by the clip — which
             * does not merely halve it, it leaves the survivor sitting on the
             * clip's own antialiased edge at a fraction of its coverage, and
             * the glint that should be white comes out a mid grey. */
            const in2 = w * 0.5 + inset;
            g.beginPath();
            for (let q = 0; q < run; q++) {
              const p = from + q;
              const x = loop[p * 2] - nxBuf[p] * in2, y = loop[p * 2 + 1] - nyBuf[p] * in2;
              if (q === 0) g.moveTo(x, y); else g.lineTo(x, y);
            }
            g.strokeStyle = `rgba(255,255,255,${(tier.layers[L][1] * k).toFixed(3)})`;
            g.lineWidth = w;
            g.stroke();
          }
        }
        /* The next run starts one point back, so that two runs at different
         * brightnesses meet rather than leaving a butt-capped gap between
         * them. */
        if (s >= 0) { from = run > 0 && i > 0 ? i - 1 : i; run = i - from + 1; step = s; }
        else { run = 0; step = -1; }
      }
    }
  }
}

/** Iron filings on the paper: short strokes lying along H, as long as there
 *  is field to lie along. It is the oldest way of drawing a magnetic field
 *  and it is still the clearest — and it is the only thing on the page that
 *  shows where the magnets are, since a magnet behind the glass is not
 *  visible and its effect on the liquid is often a screen away. */
function drawFilings(g) {
  if (CONFIG.filings <= 0 || !poles.length) return;
  /* Referenced to the strongest pole rather than to an absolute field, so the
   * hatch covers the same *shape* however strong the magnets happen to be at
   * this instant. On an absolute threshold a magnet at full strength puts
   * ticks in every corner of the screen and the wallpaper turns into a
   * diagram; on this one it stays a patch that says where the magnet is.
   *
   * The patch has to be big to be worth having. Drawn tight and dark it is a
   * small asterisk floating in white space, which reads as a smudge on the
   * screen rather than as a field; drawn wide and very faint the arcs have
   * room to curve and it reads as what it is. Faint enough that it is the
   * last thing you notice, which is the right place for it. */
  let ref = 0;
  for (const p of poles) ref = Math.max(ref, Math.abs(p.strength));
  if (ref < 1e-4) return;

  /* How dark, against how strong the magnets actually are.
   *
   * The shape is drawn relative to the strongest pole, above; the *weight* has
   * to be absolute, or it lies. Normalised only against itself, a magnet
   * parked at a fifteenth of its working strength draws exactly the same hatch
   * as one bearing down on the surface, and the page ends up with a fan of
   * field lines across it while the liquid lies flat and does nothing — which
   * is a picture of a magnet that is not there. Weighted, the hatch comes up
   * as a magnet comes down and is gone while it is away, so it says when
   * something is about to happen rather than merely where. */
  const duty = Math.min(1, ref / ambientField());
  const step = Math.max(22, U * 0.07);
  const len = step * 0.38;
  g.strokeStyle = rgba(INK, 1);
  g.lineCap = "round";
  g.lineWidth = 1;
  g.beginPath();
  let drawn = 0;
  for (let y = step * 0.5; y < H; y += step) {
    for (let x = step * 0.5; x < W; x += step) {
      fieldAt(x, y, fld);
      const h = fld.h;
      // A cut-off, not a fade to nothing. Ticks continued out to where the
      // field is negligible cover the whole page in grey hatch and turn the
      // wallpaper into a diagram; ending them leaves a patch of texture that
      // says where the magnets are and nothing else.
      const a = (h / ref - 0.1) / 0.5;
      if (a <= 0) continue;
      const ux = fld.hx / h, uy = fld.hy / h;
      // One stroke pass at one alpha; strength shows as length, and a short
      // dark tick reads as a weak field as readily as a long pale one.
      const l = len * Math.min(1, 0.35 + 0.65 * a);
      g.moveTo(x - ux * l, y - uy * l);
      g.lineTo(x + ux * l, y + uy * l);
      drawn++;
    }
  }
  if (drawn) {
    g.globalAlpha = 0.055 * CONFIG.filings * duty;
    g.stroke();
    g.globalAlpha = 1;
  }
}

/** A ring where a magnet was set down, so a tap is visibly acknowledged even
 *  when the liquid is too far away to answer it. */
function drawTapMarks(g) {
  for (let i = ambientPoles; i < poles.length; i++) {
    const p = poles[i];
    const u = 1 - Math.min(1, p.life / p.born);
    if (u > 0.55) continue;
    const k = u / 0.55;
    g.beginPath();
    g.arc(p.x, p.y, U * (0.028 + 0.15 * k), 0, Math.PI * 2);
    g.strokeStyle = rgba(INK, 0.2 * (1 - k));
    g.lineWidth = 1.4;
    g.stroke();
  }
}

function tracePath(g, pts) {
  g.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
  g.closePath();
}

let loopsCache = [];

function render() {
  updateLight();

  ctx.fillStyle = CONFIG.paper;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (CONFIG.mode === "pouch") {
    // A tile on the paper wants its own edge; full bleed does not.
    const tile = new Path2D();
    tracePath(tile, outline);
    ctx.fillStyle = "#ffffff";
    ctx.fill(tile);
    ctx.clip(tile);
  }

  drawFilings(ctx);

  splat();
  const loops = contours();
  loopsCache = loops;

  if (loops.length) {
    if (CONFIG.shadow > 0) {
      // The shadow, from the coverage image resampled down and back up. The
      // half-cell shifts line the image's pixel centres up with the grid
      // samples they were computed at.
      paintCover();
      blurCtx.clearRect(0, 0, blurCanvas.width, blurCanvas.height);
      blurCtx.imageSmoothingEnabled = true;
      blurCtx.drawImage(coverCanvas, 0, 0, blurCanvas.width, blurCanvas.height);
      const gx = GOX - mcell * 0.5, gy = GOY - mcell * 0.5;
      const gw = GW * mcell, gh = GH * mcell;
      const off = U * 0.02;
      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.globalAlpha = 0.17 * CONFIG.shadow;
      ctx.drawImage(blurCanvas, gx - light.x * off * 1.7, gy - light.y * off * 1.7, gw, gh);
      ctx.globalAlpha = 0.1 * CONFIG.shadow;
      ctx.drawImage(coverCanvas, gx - light.x * off * 0.5, gy - light.y * off * 0.5, gw, gh);
      ctx.restore();
    }

    const path = new Path2D();
    for (const loop of loops) traceLoop(path, loop);

    /* Not flat ink. A body this dark still has a lit side and a dark one,
     * and a couple of levels of grey across the whole shape is the difference
     * between a liquid and a hole cut in the page. */
    const gr = ctx.createLinearGradient(
      CX + light.x * U * 0.6, CY + light.y * U * 0.6,
      CX - light.x * U * 0.6, CY - light.y * U * 0.6);
    gr.addColorStop(0, `rgb(${INK.r + 15},${INK.g + 15},${INK.b + 17})`);
    gr.addColorStop(1, `rgb(${Math.max(0, INK.r - 5)},${Math.max(0, INK.g - 5)},${Math.max(0, INK.b - 5)})`);
    ctx.fillStyle = gr;
    ctx.fill(path, "nonzero");

    if (CONFIG.gloss > 0) {
      ctx.save();
      ctx.clip(path, "nonzero");
      drawSheen(ctx, loops);
      ctx.restore();
    }
  }

  drawTapMarks(ctx);
  ctx.restore();
}

/* -------------------------------------------------------------------- setup */

function resize() {
  const nextW = Math.floor(window.innerWidth);
  const nextH = Math.floor(window.innerHeight);
  /* A WebView can execute the document before its host view is attached. In
   * that state both dimensions are zero, the fill area is zero, the drop
   * spacing is zero, and the first step divides by it. Wait for a surface. */
  if (nextW < 2 || nextH < 2) return false;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = nextW; H = nextH; U = Math.min(W, H);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5; CY = H * 0.5;
  if (CONFIG.mode === "full") {
    RX = W * 0.5; RY = H * 0.5;
    corner = num("corner", U * 0.1);
  } else {
    RX = RY = U * 0.5 * CONFIG.scale;
    corner = num("corner", RX * 0.42);
  }
  buildOutline();
  buildParticles();
  buildField();
  buildPoles();
  return true;
}

/* -------------------------------------------------------------------- loop */

let last = 0, raf = 0;

/** One step of everything, however the clock arrived — the page's own
 *  requestAnimationFrame, or a host calling tick(). */
function advance(now) {
  const dt = Math.min((now - last) / 1000 || 0.016, 0.05);
  last = now;
  const t0 = diagOn ? performance.now() : 0;
  /* Draw only if something moved.
   *
   * The simulation is fixed at 60 Hz and a great many phones now refresh at
   * 90 or 120, so on those every second or third frame arrives with the
   * accumulator short of a step: nothing has changed and the canvas already
   * holds the right picture. Drawing it again is a third of the frame's work
   * spent reproducing the previous frame exactly, which on a wallpaper is
   * battery and nothing else. */
  if (step(dt) > 0) render();
  if (diagOn) diagSample(now, performance.now() - t0);
}

/* Frame timing, reported to the console. Off unless a host turns it on:
 * inside a wallpaper there is no devtools to attach, so the one number that
 * matters — whether this holds a frame rate on real hardware — has to come
 * out through the console and into logcat. */
let diagOn = false, diagFrames = 0, diagJs = 0, diagSince = 0;

function diagSample(now, js) {
  diagFrames++;
  diagJs += js;
  if (now - diagSince < 2000) return;
  console.log("ferrofluid fps=" + (diagFrames * 1000 / (now - diagSince)).toFixed(1) +
              " js=" + (diagJs / diagFrames).toFixed(1) + "ms" +
              " canvas=" + canvas.width + "x" + canvas.height +
              " drops=" + N + " grid=" + GW + "x" + GH +
              " loops=" + loopsCache.length + " poles=" + poles.length);
  diagFrames = 0; diagJs = 0; diagSince = now;
}

function frame(now) {
  raf = requestAnimationFrame(frame);
  advance(now);
}

function start() {
  if (!resize()) { requestAnimationFrame(start); return; }
  seed();
  /* Settle before the first frame is ever seen. A lattice dropped into the
   * cell is not at rest, and without this the wallpaper opens on the liquid
   * twitching itself into shape. */
  for (let i = 0; i < 45; i++) {
    stepPoles(simTime, FIXED_DT);
    stepSim(FIXED_DT);
    simTime += FIXED_DT;
  }
  /* One frame drawn synchronously, before anything is scheduled: the manifest
   * icon is a picture of this canvas, and it is asked for on the line after
   * start() returns. */
  render();
  last = performance.now();
  if (!raf) raf = requestAnimationFrame(frame);
}

window.addEventListener("resize", () => { if (resize()) seed(); });

// A live wallpaper is hidden whenever the launcher is not showing; stopping
// the loop there is the difference between a wallpaper and a battery leak.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); }
});

/* ---------------------------------------------------------- pointer testing
 *
 * On a desktop there are no sensors, and two different things are worth
 * exercising: dragging moves a magnet about, which is the interaction the
 * piece is built on, and holding shift while dragging tilts gravity, which is
 * the one the phone provides for free.
 */
let dragging = false, dragPole = null;

function placePole(x, y, strength, seconds) {
  /* Refuse a pole that is not somewhere.
   *
   * This is a public entry point — a host calls tap() — and a pole at NaN is
   * not a pole that does nothing, it is a pole that makes the field NaN
   * everywhere. Every comparison against it then fails, every magnetic force
   * is skipped, and the wallpaper goes quietly inert for as long as the pole
   * lives, with no error anywhere to say why. */
  if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(strength)) return null;

  /* Deeper than the ambient pair, and stronger to match. The field of a pole
   * falls off as the inverse square of the distance but its strength goes as
   * the square of its standoff, so a broad magnet held further back reaches
   * much further than a sharp one held close, at the cost of doing less where
   * it is. A finger on the glass should be felt across the screen. */
  const p = {
    x, y, z: refU() * 0.26, strength, q: 0,
    peak: strength, life: seconds, born: seconds,
    phase: 0, period: 1, dip: false, ax: 1, ay: 0,
  };
  poles.push(p);
  // Cap the transient poles: a fast tapper should not be able to build up a
  // field the solver has never seen.
  while (poles.length - ambientPoles > 4) poles.splice(ambientPoles, 1);
  return p;
}

canvas.addEventListener("pointerdown", (e) => {
  hint.classList.add("hide");
  if (e.shiftKey) { dragging = "tilt"; return; }
  dragging = "magnet";
  dragPole = placePole(e.clientX, e.clientY, CONFIG.field * 1.6, 1e9);
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  if (dragging === "magnet") {
    if (dragPole) { dragPole.x = e.clientX; dragPole.y = e.clientY; }
    return;
  }
  const nx = (e.clientX - CX) / RX, ny = (e.clientY - CY) / RY;
  const len = Math.hypot(nx, ny) || 1;
  setGravityVector(nx / len, ny / len);
});
const endDrag = () => {
  if (dragging === "magnet" && dragPole) {
    // Let it fade rather than vanish: a magnet lifted off the glass weakens
    // over the moment it takes to lift it.
    dragPole.peak = dragPole.strength;
    dragPole.life = 0.9; dragPole.born = 0.9;
    dragPole = null;
  }
  if (dragging === "tilt") setGravityVector(0, 1);   // settle back to real down
  dragging = false;
};
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

/* ------------------------------------------------------- running on a phone
 *
 * Three things stand between a page in a browser tab and something that
 * behaves like a wallpaper, and none of them are about the drawing.
 */

/* The screen must not dim while you are watching it. A wallpaper never does;
 * a web page will, in about fifteen seconds. The lock is dropped whenever the
 * page is hidden, so it has to be taken again on the way back. */
let wakeLock = null;
async function keepAwake() {
  if (!navigator.wakeLock || document.visibilityState !== "visible") return;
  try { wakeLock = await navigator.wakeLock.request("screen"); }
  catch (e) { /* refused, or unsupported: there is no second way to ask */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});

/* Browser chrome has to go. Fullscreen needs a gesture to grant it, so it is
 * taken on the first touch — and only on a touch, so that dragging a magnet
 * on a desktop does not throw the window into fullscreen on the first click. */
function goImmersive(e) {
  if (e.pointerType && e.pointerType !== "touch") return;
  keepAwake();
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) {
    el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  }
  window.removeEventListener("pointerdown", goImmersive);
}
window.addEventListener("pointerdown", goImmersive);

/** A picture of the cell as it stands, clipped to its own boundary and
 *  returned as a PNG data URL. This is what an icon renderer reads out once
 *  it has driven the simulation to the state it wants. */
function installIcon(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";
  const side = Math.min(canvas.width, canvas.height);
  const sx = (canvas.width - side) / 2, sy = (canvas.height - side) / 2;
  const k = size / side;
  g.beginPath();
  for (let i = 0; i < outline.length; i++) {
    const x = (outline[i].x * DPR - sx) * k, y = (outline[i].y * DPR - sy) * k;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
  g.clip();
  g.drawImage(canvas, sx, sy, side, side, 0, 0, size, size);
  return c.toDataURL("image/png");
}

/* And it should be installable, because "add to home screen" is the closest a
 * web page gets to being a wallpaper. The manifest is built here rather than
 * shipped as a second file so this stays one self-contained page, and the
 * icon is a picture of the running simulation rather than a drawing of it. */
function installManifest() {
  const theme = document.createElement("meta");
  theme.name = "theme-color";
  theme.content = CONFIG.paper;
  document.head.appendChild(theme);

  const manifest = {
    name: "Ferrofluid",
    short_name: "Ferrofluid",
    display: "fullscreen",
    orientation: "portrait",
    background_color: CONFIG.paper,
    theme_color: CONFIG.paper,
    start_url: location.href.split("#")[0],
    icons: [192, 512].map((s) => ({
      src: installIcon(s), sizes: s + "x" + s, type: "image/png", purpose: "any",
    })),
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(
    new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  document.head.appendChild(link);
}

/* ------------------------------------------------- the native host, if any
 *
 * Inside an Android live wallpaper there is no browser to deliver
 * devicemotion: the page is drawn into a wallpaper surface by a service that
 * owns the sensors itself. The service feeds them in through here, in the
 * units and the device frame the web event already uses — raw metres per
 * second squared, +y up the screen — so both paths land on the same code and
 * there is only one motion model to keep honest.
 *
 * This is the same table the liquid shaker exposes. `__shaker` is kept as an
 * alias so that a host built against that page hosts this one unchanged.
 */
let hostOffset = null;

const HOST = {
  /** Accelerometer, straight off android.hardware.Sensor.TYPE_ACCELEROMETER.
   *  `spin` is rotation about the viewing axis in degrees per second, which
   *  is the gyroscope's z component converted from radians. */
  motion(x, y, z, spin) {
    onMotion({
      accelerationIncludingGravity: { x, y, z },
      rotationRate: spin === undefined ? null : { alpha: spin },
    });
  },

  /* Home-screen page swipes. A wallpaper is wider than the screen and slides
   * under the icons; a cell of liquid slid sideways leaves its contents
   * behind for a moment. So the swipe enters as the velocity the liquid does
   * not have yet, and the slosh that follows is the solver doing what it
   * already does rather than an animation laid over the top. */
  offset(t) {
    if (hostOffset === null) { hostOffset = t; return; }
    /* Clamped, because the launcher reports a jump between distant pages as
     * one step and a vessel does not get moved a metre instantaneously. */
    const d = Math.max(-0.3, Math.min(0.3, t - hostOffset));
    hostOffset = t;
    if (!d) return;
    const k = d * W * 2.2;
    for (let i = 0; i < N; i++) vx[i] -= k;
  },

  /* A tap on the glass sets a magnet down under the finger.
   *
   * It is the same kind of pole the ambient pair are — there is no separate
   * "tap effect" anywhere in the file — so what happens next is simply what
   * this liquid does about a strong, close, briefly held magnet, which is to
   * reach for it and stand up in spikes under it. */
  tap(nx, ny) {
    placePole(nx * W, ny * H, CONFIG.field * 1.8, 2.4);
  },

  /** The service stops the loop when the wallpaper is not on screen. */
  pause() { cancelAnimationFrame(raf); raf = 0; },
  resume() { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); },

  /* Hand the clock to the host. Drawn into a wallpaper surface by hand, the
   * page is in a WebView that is not attached to a window, and an unattached
   * WebView has no vsync to hang requestAnimationFrame off — so the loop
   * either throttles hard or never runs. The host that is already waking once
   * per frame to draw can step the simulation itself instead. */
  drive() { cancelAnimationFrame(raf); raf = 0; last = performance.now(); },
  tick() { advance(performance.now()); },

  /** Frame timing to the console, for a host with no other way to see it. */
  diag(on) { diagOn = !!on; diagSince = performance.now(); diagFrames = 0; diagJs = 0; },

  /** A picture of the cell as it stands right now, as a PNG data URL. */
  icon(size) { return installIcon(size); },
};

window.__wallpaper = HOST;
window.__shaker = HOST;

start();
installManifest();
</script>
</body>
</html>
