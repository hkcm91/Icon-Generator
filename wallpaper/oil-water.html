  }
}

function oilPath() {
  const path = new Path2D();
  for (let L = 0; L < loopCount; L++) {
    const s = loopStart[L], e = loopStart[L + 1], m = e - s;
    if (m < 3) continue;
    let px = loopXY[(e - 1) * 2], py = loopXY[(e - 1) * 2 + 1];
    let qx = loopXY[s * 2], qy = loopXY[s * 2 + 1];
    path.moveTo((px + qx) * 0.5, (py + qy) * 0.5);
    for (let n = 0; n < m; n++) {
      const i0 = s + n, i1 = s + (n + 1) % m;
      const ax = loopXY[i0 * 2], ay = loopXY[i0 * 2 + 1];
      const bx = loopXY[i1 * 2], by = loopXY[i1 * 2 + 1];
      path.quadraticCurveTo(ax, ay, (ax + bx) * 0.5, (ay + by) * 0.5);
    }
    path.closePath();
  }
  return path;
}

/* ---------------------------------------------------------------- drawing */

let backLayer = null, glossLayer = null;
let lightAngle = -2.0, bakedAngle = Infinity;

const OIL_LIT = mix(OIL, WHITE, 0.09);
const OIL_DEEP = mix(OIL, DEEP, 0.46);

function paintWater(g) {
  if (CONFIG.glass >= 1) return;
  const a = 1 - CONFIG.glass;
  const L = Math.hypot(W, H) * 0.62;
  const gr = g.createLinearGradient(CX - gDir.x * L, CY - gDir.y * L,
                                    CX + gDir.x * L, CY + gDir.y * L);
  for (let i = 0; i < RAMP.length; i++) {
    gr.addColorStop(RAMP.length === 1 ? 0 : i / (RAMP.length - 1), rgba(RAMP[i], a));
  }
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
}

function paintGloss(g) {
  // One broad highlight lying across the whole cell, swinging with the phone.
  const lx = Math.cos(lightAngle), ly = Math.sin(lightAngle);
  const L = Math.hypot(W, H) * 0.7;
  const gr = g.createLinearGradient(CX - lx * L, CY - ly * L, CX + lx * L, CY + ly * L);
  gr.addColorStop(0, "rgba(255,255,255,0)");
  gr.addColorStop(0.46, "rgba(255,255,255,0)");
  gr.addColorStop(0.70, "rgba(255,255,255,0.075)");
  gr.addColorStop(0.88, "rgba(255,255,255,0)");
  gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
  const vg = g.createRadialGradient(CX, CY, Math.min(W, H) * 0.34,
                                    CX, CY, Math.hypot(W, H) * 0.62);
  vg.addColorStop(0, "rgba(8,16,34,0)");
  vg.addColorStop(1, rgba(DEEP, 0.17));
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);
}

/* Both of those depend on the light and on nothing else, so paying for them
 * once a frame is paying for them sixty times more often than they change. */
function buildLayers() {
  if (!backLayer) backLayer = document.createElement("canvas");
  if (!glossLayer) glossLayer = document.createElement("canvas");
  for (const c of [backLayer, glossLayer]) {
    if (c.width !== canvas.width || c.height !== canvas.height) {
      c.width = canvas.width; c.height = canvas.height;
    }
    const g = c.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, c.width, c.height);
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  paintWater(backLayer.getContext("2d"));
  paintGloss(glossLayer.getContext("2d"));
  bakedAngle = lightAngle;
}

function blit(layer) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(layer, 0, 0);
  ctx.restore();
}

/* Shading a liquid, second attempt.
 *
 * The first version filled the contour with a gradient running down the
 * screen and drew a hairline round it, and it read as cut paper — correctly,
 * because a flat colour field bounded by an outline is what a paper cutout
 * is. The second version piled on inner shadows until it read as mud, which
 * is what happens when six translucent washes are stacked over one another
 * and each is asked to carry a different idea.
 *
 * The mistake behind both was looking for the answer inside the blob. A body
 * of oil seen from directly above genuinely *is* a fairly even colour: the
 * light goes through the same depth almost everywhere, so there is not much
 * for the interior to say. What says "liquid" in a photograph of one is two
 * things, and neither of them is the middle.
 *
 *   - The edge. A hard silhouette, a dark line where the two liquids meet,
 *     and immediately inside it a band where the oil is thin enough to be
 *     nearly clear. That band is the only part of a blob whose brightness is
 *     really a function of its shape.
 *
 *   - The surface moving. A still liquid is a mirror and looks like one; a
 *     moving liquid is a mirror being bent, and the bright and dark bands
 *     sliding over it are the single most recognisable thing about the
 *     material. This page had a whole velocity field and was drawing none of
 *     it — the picture had no idea the liquid was in motion except that the
 *     silhouette changed shape.
 *
 * So: one saturated fill and two edge treatments. The third thing that used
 * to be here -- a lit relief over the whole screen -- is gone; see the note
 * below drawOil for why.
 */
function drawOil(path) {
  const lx = Math.cos(lightAngle), ly = Math.sin(lightAngle);

  // Under it: the oil blocks light, so the water beneath is a little darker
  // downhill of it.
  ctx.save();
  ctx.shadowColor = rgba(DEEP, 0.5);
  ctx.shadowBlur = cell * 2.0 * DPR;
  ctx.shadowOffsetX = gDir.x * cell * 1.0 * DPR;
  ctx.shadowOffsetY = gDir.y * cell * 1.0 * DPR;
  ctx.fillStyle = rgba(DEEP, 0.55);
  ctx.fill(path);
  ctx.restore();

  // One fill, saturated, and left alone. Every wash laid over this was a
  // step toward brown.
  ctx.fillStyle = rgba(OIL, 0.94);
  ctx.fill(path);

  ctx.save();
  ctx.clip(path);
  /* The thin band just inside the rim, where there is not enough oil left to
   * take the light and the water reads through. Cast by filling everything
   * *except* the blob with a shadow and letting the clip keep only what
   * falls inward — which is a distance-from-the-edge ramp for the price of
   * one fill, and the only piece of interior shading that earns its place. */
  const inv = new Path2D();
  inv.rect(-cell * 4, -cell * 4, W + cell * 8, H + cell * 8);
  inv.addPath(path);
  ctx.shadowColor = rgba(mix(OIL, WHITE, 0.5), 0.75);
  ctx.shadowBlur = cell * 1.5 * DPR;
  ctx.fillStyle = "rgba(0,0,0,1)";
  ctx.fill(inv, "evenodd");
  ctx.restore();

  /* The edge, and it has to be bold enough to see.
   *
   * These strokes were all specified as a fraction of a cell, and a cell is
   * about seven CSS pixels — so `cell * 0.055` is four tenths of a pixel.
   * Every highlight on this page was being drawn at sub-pixel width against
   * a saturated background, which is the same as not drawing it. There was
   * no bright mark anywhere in the frame, and a picture of a liquid with no
   * specular in it is a picture of a piece of paper.
   */
  ctx.lineJoin = "round";
  ctx.strokeStyle = rgba(mix(OIL, DEEP, 0.55), 0.6);
  ctx.lineWidth = Math.max(1.4, cell * 0.16);
  ctx.stroke(path);

  // The wet line: the lit side of the meniscus, kept inside the blob by
  // stroking the path shifted and clipping. This is the brightest mark in
  // the frame, and it is meant to be.
  ctx.save();
  ctx.clip(path);
  ctx.translate(-lx * cell * 0.22, -ly * cell * 0.22);
  ctx.strokeStyle = "rgba(255,255,255,0.80)";
  ctx.lineWidth = Math.max(1.6, cell * 0.24);
  ctx.stroke(path);
  ctx.translate(-lx * cell * 0.06, -ly * cell * 0.06);
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = Math.max(0.9, cell * 0.09);
  ctx.stroke(path);
  ctx.restore();
}

/* There is no surface relief on either liquid, and there used to be.
 *
 * The page carried an advected noise field and lit it as a height map, blended
 * over the whole screen: a standing "chop" on the resting liquid plus a
 * picture of the flow once it moved. It was argued for at length, and it was
 * wrong. Still liquid is not textured -- it is a mirror -- and mottling laid
 * over both phases read as sponged plaster on the water and as marbled stone
 * on the oil, which is the opposite of the wet, poured look the whole page is
 * for. It also fought the thing that actually carries the read here, which is
 * the shape of the boundary.
 *
 * Removed outright rather than turned down: the ripple field, its advection,
 * its re-roughening, its share of the boundary conditions, and both passes
 * over the grid it needed every frame.
 */

function render() {
  const ux = -gDir.x, uy = -gDir.y, a = -0.42;
  lightAngle = Math.atan2(ux * Math.sin(a) + uy * Math.cos(a),
                          ux * Math.cos(a) - uy * Math.sin(a));
  let d = lightAngle - bakedAngle;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  if (Math.abs(d) > 0.05) buildLayers();

  ctx.save();
  if (CONFIG.glass > 0 || CONFIG.mode === "pouch") ctx.clearRect(0, 0, W, H);
  if (CONFIG.mode === "pouch") {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, rgba(DEEP, 1));
    bg.addColorStop(1, "rgba(19,19,23,1)");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    squirclePath(ctx, CX, CY, RX, RY, CONFIG.squircleN, 220);
    ctx.clip();
  }
  blit(backLayer);
  contour();
  if (loopCount) drawOil(oilPath());
  blit(glossLayer);
  ctx.restore();
}

/* -------------------------------------------------------------------- loop */

let last = 0, raf = 0;
let diagOn = false, diagFrames = 0, diagJs = 0, diagSince = 0;

function advance(now) {
  const dt = Math.min((now - last) / 1000 || 0.016, 0.05);
  last = now;
  const t0 = diagOn ? performance.now() : 0;
  step(dt);
  render();
  if (diagOn) diagSample(now, performance.now() - t0);
}

function diagSample(now, js) {
  diagFrames++; diagJs += js;
  if (now - diagSince < 2000) return;
  console.log("oilwater fps=" + (diagFrames * 1000 / (now - diagSince)).toFixed(1) +
              " js=" + (diagJs / diagFrames).toFixed(1) + "ms" +
              " grid=" + GW + "x" + GH + " loops=" + loopCount +
              " pts=" + loopLen + " oil=" + oilArea().toFixed(3));
  diagFrames = 0; diagJs = 0; diagSince = now;
}

function frame(now) { raf = requestAnimationFrame(frame); advance(now); }

function start() {
  if (!resize()) { requestAnimationFrame(start); return; }
  render();
  last = performance.now();
  if (!raf) raf = requestAnimationFrame(frame);
}

window.addEventListener("resize", () => { resize(); });
// A live wallpaper is hidden whenever the launcher is not showing, and one
// that keeps solving there is a battery leak rather than a wallpaper.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); }
});

/* ------------------------------------------------------- running on a phone
 * Identical to the other two pages, and for the same reasons. */
let wakeLock = null;
async function keepAwake() {
  if (!navigator.wakeLock || document.visibilityState !== "visible") return;
  try { wakeLock = await navigator.wakeLock.request("screen"); }
  catch (e) { /* refused, or unsupported: there is no second way to ask */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});

function goImmersive(e) {
  if (e.pointerType && e.pointerType !== "touch") return;
  keepAwake();
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) {
    el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  }
  window.removeEventListener("pointerdown", goImmersive);
}
window.addEventListener("pointerdown", goImmersive);

function installIcon(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";
  const side = Math.min(canvas.width, canvas.height);
  const ox = (canvas.width - side) / 2, oy = (canvas.height - side) / 2;
  squirclePath(g, size / 2, size / 2, size / 2, size / 2, CONFIG.squircleN, 220);
  g.clip();
  g.drawImage(canvas, ox, oy, side, side, 0, 0, size, size);
  return c.toDataURL("image/png");
}

function installManifest() {
  const theme = document.createElement("meta");
  theme.name = "theme-color";
  theme.content = CONFIG.ramp[0];
  document.head.appendChild(theme);
  const manifest = {
    name: "Oil and Water", short_name: "Oil",
    display: "fullscreen", orientation: "portrait",
    background_color: CONFIG.ramp[0], theme_color: CONFIG.ramp[0],
    start_url: location.href.split("#")[0],
    icons: [192, 512].map((s) => ({
      src: installIcon(s), sizes: s + "x" + s, type: "image/png", purpose: "any",
    })),
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(
    new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  document.head.appendChild(link);
}

/* ------------------------------------------------ the native host, if any
 *
 * The shaker's object, verbatim in name and shape, so the WallpaperService in
 * ../android can host any of the three pages without knowing which it has.
 */
let hostOffset = null;

window.__shaker = {
  motion(x, y, z, spin) { onMotion({ accelerationIncludingGravity: { x, y, z } }); },

  /* Home-screen page swipes. A wallpaper is wider than the screen and slides
   * under the icons, and sliding a vessel sideways sets the liquid in it
   * moving — so this goes in as a bulk velocity along the swipe, and what
   * follows is the solver doing what it already does. */
  offset(t) {
    if (hostOffset === null) { hostOffset = t; return; }
    const d = Math.max(-0.3, Math.min(0.3, t - hostOffset));
    hostOffset = t;
    if (!d) return;
    const k = d * W * 2.2;
    for (let j = 1; j < GH - 1; j++) {
      for (let i = 1; i < GW - 1; i++) u[j * GW + i] -= k;
    }
  },

  /** A tap on the glass: a shear pulse under the finger. A radial push would
   *  be pure divergence and the projection would delete every bit of it,
   *  which is measured and not assumed — see the shaker.
   *
   *  Wide and strong, and it has to be. The pulse used to be 1.6 contact radii
   *  at 620px/s, and at that scale the viscosity above erases it inside two
   *  frames: measured, a tap moved the oil's perimeter by half a per cent and
   *  it was back to rest a quarter second later. That is the viscosity working
   *  as designed -- small-scale motion is exactly what it exists to kill -- so
   *  the tap has to stop being small-scale. Radius does most of the work:
   *
   *    radius  strength   perimeter, rest -> +0.25s -> +1s -> +3s
   *      1.6      620       374 -> 376 -> 374 -> 374
   *      3.5     1400       374 -> 398 -> 382 -> 374
   *      5.0     2600       374 -> 456 -> 444 -> 382
   *      7.0     2600       374 -> 504 -> 564 -> 494   (never settles)
   *
   *  At five radii the oil visibly bulges and heals over about three seconds,
   *  which is what a finger in a viscous liquid does. */
  tap(nx, ny) {
    const x = nx * W, y = ny * H, R = STIR_R * cell * 5;
    for (let j = 1; j < GH - 1; j++) {
      for (let i = 1; i < GW - 1; i++) {
        const k = j * GW + i;
        const dx = gx(i) + cell * 0.5 - x, dy = gy(j) + cell * 0.5 - y;
        const d = Math.hypot(dx, dy);
        if (d > R) continue;
        const w = 1 - d / R;
        // A curl about the tap, which is what survives the projection.
        u[k] += -dy / (d + 1e-3) * 2600 * w;
        v[k] += dx / (d + 1e-3) * 2600 * w;
      }
    }
  },

  pause() { cancelAnimationFrame(raf); raf = 0; },
  resume() { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); },
  drive() { cancelAnimationFrame(raf); raf = 0; last = performance.now(); },
  tick() { advance(performance.now()); },
  diag(on) { diagOn = !!on; diagSince = performance.now(); diagFrames = 0; diagJs = 0; },
  icon(size) { return installIcon(size); },

  /** Plant a known shape — "square", "cross" or "disc" — in still liquid.
   *
   *  This is a test fixture and it is here on purpose. Interfacial tension
   *  exists to minimise perimeter, so the one-line statement of whether it
   *  works is "does a square become a circle", and there is no way to ask
   *  that of a cell full of whatever the last shake left behind. The sign
   *  error this page shipped with survived three rounds of tuning and two
   *  renderer rewrites precisely because nothing could ask it. */
  plant(kind) {
    for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
      const x = (i - GW / 2) / (GW * 0.5), y = (j - GH / 2) / (GW * 0.5);
      let d;
      if (kind === "drops") {
        // Five discs, radii 0.28 down to 0.06 of the cell width, well apart.
        d = -1;
        for (const [cx2, cy2, r2] of [[-0.45, -0.9, 0.28], [0.45, -0.3, 0.20],
                                      [-0.4, 0.4, 0.14], [0.35, 0.9, 0.10], [0, 1.35, 0.06]]) {
          d = Math.max(d, r2 - Math.hypot(x - cx2, y - cy2));
        }
      }
      else if (kind === "square") d = 0.42 - Math.max(Math.abs(x), Math.abs(y));
      else if (kind === "cross") d = 0.42 - Math.min(Math.max(Math.abs(x), Math.abs(y) - 0.3),
                                                     Math.max(Math.abs(x) - 0.3, Math.abs(y)));
      else d = 0.42 - Math.hypot(x, y);
      phi[j * GW + i] = Math.tanh(d * GW * 0.5 / 1.4);
    }
    u.fill(0); v.fill(0); p.fill(0);
    targetMean = meanPhi();
  },

  /** Shake it without shaking it. */
  shake: emulsify,

  /** What the cell is doing, as numbers. "Has it separated yet" is a
   *  question about a field, and the only way a headless test can ask it. */
  stats() {
    let oil = 0, interface_ = 0, ke = 0, hi = 0, lo = 0;
    for (let j = 1; j < GH - 1; j++) {
      for (let i = 1; i < GW - 1; i++) {
        const k = j * GW + i, f = phi[k];
        if (f > 0) oil++;
        if (f > -0.6 && f < 0.6) interface_++;
        ke += u[k] * u[k] + v[k] * v[k];
        if (f > hi) hi = f;
        if (f < lo) lo = f;
      }
    }
    const cells = (GW - 2) * (GH - 2);
    return {
      grid: GW + "x" + GH, cells,
      oilFraction: oil / cells,
      /* The single number that says whether it is mixed. Interface area is
       * minimal when the two phases are one layer each and maximal when they
       * are a foam of droplets, so it falls monotonically while it settles
       * and is the honest measure of "has it separated". */
      interfaceCells: interface_ / cells,
      blobs: loopCount, drawnArea: drawnArea(),
      /* How much of the oil has no interior. The mean thickness above is an
       * average over whole bodies, so one fat slab hides any number of thin
       * arms hanging off it — and thin arms are the whole complaint. This is
       * local: a cell counts as skin if it is oil but has not reached the
       * well, and a body only a few interface-widths across is skin all the
       * way through. Near zero is thick oil; above about a third is tendrils.
       */
      /* How many separate ridges each oil body's outline has, area-weighted.
       *
       * "Too many ridges and bumps -- it should be a couple per blob" is a
       * statement about the *outline*, and neither thickness nor roundness
       * says it. Roundness scores a smooth ellipse and a smooth peanut
       * differently while scoring a smooth circle and a gently rippled one
       * almost the same, which is backwards for this question.
       *
       * This walks each loop, takes the discrete curvature at every vertex,
       * smooths it enough that a single lattice cell cannot register, and
       * counts its sign changes. Every convex bulge separated by a concave
       * neck is one crossing pair, so the count is twice the number of
       * lobes: a circle or an ellipse gives 0, a peanut 2, a starfish 10.
       */
      lobes: (() => {
        let num2 = 0, den = 0;
        const kap = [];
        for (let L = 0; L < loopCount; L++) {
          const st = loopStart[L], en = loopStart[L + 1], m = en - st;
          if (m < 12) continue;
          kap.length = m;
          let A = 0;
          for (let n = 0; n < m; n++) {
            const a2 = st + (n + m - 1) % m, c = st + n, b2 = st + (n + 1) % m;
            const x0 = loopXY[a2 * 2], y0 = loopXY[a2 * 2 + 1];
            const x1 = loopXY[c * 2], y1 = loopXY[c * 2 + 1];
            const x2 = loopXY[b2 * 2], y2 = loopXY[b2 * 2 + 1];
            A += x1 * y2 - x2 * y1;
            // Twice the signed triangle area over the product of the three
            // side lengths is the Menger curvature, and needs no angles.
            const a = Math.hypot(x1 - x0, y1 - y0);
            const b = Math.hypot(x2 - x1, y2 - y1);
            const c2 = Math.hypot(x2 - x0, y2 - y0);
            const cross = (x1 - x0) * (y2 - y0) - (y1 - y0) * (x2 - x0);
            kap[n] = (a * b * c2) > 1e-9 ? 2 * cross / (a * b * c2) : 0;
          }
          /* Smoothed hard, and that is the whole difficulty of the metric:
           * unsmoothed, the marching-squares vertices alone put a curvature
           * sign change every few points and every body scores in the
           * hundreds regardless of what it looks like. */
          for (let pass = 0; pass < 12; pass++) {
            let prev = kap[m - 1], first = kap[0];
            for (let n = 0; n < m; n++) {
              const next = n === m - 1 ? first : kap[n + 1];
              const cur = kap[n];
              kap[n] = cur * 0.5 + (prev + next) * 0.25;
              prev = cur;
            }
          }
          let scale = 0;
          for (let n = 0; n < m; n++) scale += Math.abs(kap[n]);
          scale /= m;
          // A crossing only counts once the curvature has actually committed
          // to a sign, or noise about zero reads as a ridge.
          const gate = scale * 0.35;
          let sign = 0, crossings = 0;
          for (let n = 0; n < m; n++) {
            const v2 = kap[n];
            if (v2 > gate) { if (sign === -1) crossings++; sign = 1; }
            else if (v2 < -gate) { if (sign === 1) crossings++; sign = -1; }
          }
          A = Math.abs(A) * 0.5;
          if (A <= 0) continue;
          num2 += crossings * A; den += A;
        }
        return den > 0 ? num2 / den : 0;
      })(),
      /* Where the oil is, vertically, as a fraction of the cell: 0 is hard
       * against the top, 1 against the bottom. Measured along the gravity
       * direction rather than the screen, so it means the same thing with the
       * phone turned.
       *
       * This is the number that says whether the page is behaving like oil in
       * water at all. Oil is the lighter phase, so it rises; a cell where the
       * oil's centre of mass does not travel is not oil in water, whatever
       * the shapes in it look like. Nothing measured that until now. */
      /* The Courant number actually used -- cells crossed per trajectory
       * piece by the fastest fluid, so it is what the advection scheme sees
       * -- and the number of pieces it took. `cflRaw` is what it would have
       * been in one straight line, which is the honest measure of how hard
       * the cell is moving. Before the trajectory was split, the two were the
       * same number and it reached 4.6. */
      cfl: lastCfl, substeps: lastSub, cflRaw: lastCfl * lastSub, iters: lastIters,
      /* How incompressible the flow actually is, after the projection has
       * run. This is the residual the pressure solve left behind, as a
       * fraction of a cell crossed per step -- so it is directly comparable
       * with the Courant number above, and zero is what the physics says it
       * must be. Anything appreciable means the fluid is being compressed
       * and expanded, which for a two-phase field means the oil visibly
       * swells and shrinks. */
      divergence: (() => {
        let m = 0;
        for (let j = 1; j < GH - 1; j++)
          for (let i = 1; i < GW - 1; i++) {
            const k = j * GW + i;
            const d = Math.abs(-0.5 * (u[k + 1] - u[k - 1] + v[k + GW] - v[k - GW]));
            if (d > m) m = d;
          }
        return m * FIXED_DT / cell;
      })(),
      centroid: (() => {
        let m = 0, acc = 0;
        for (let j = 1; j < GH - 1; j++)
          for (let i = 1; i < GW - 1; i++) {
            const w = Math.max(0, phi[j * GW + i]);
            if (w <= 0) continue;
            /* Distance along gravity from the centre, then re-centred, so
             * that 0 is the up wall and 1 the down wall whichever way the
             * phone is held. Projecting the raw corner-relative position
             * instead goes negative once gDir points up, which is what the
             * first version of this did. */
            const x = (i - 1) / (GW - 2) - 0.5, y = (j - 1) / (GH - 2) - 0.5;
            acc += w * (0.5 + x * gDir.x + y * gDir.y); m += w;
          }
        return m > 0 ? acc / m : 0;
      })(),
      skinFraction: (() => {
        let oil = 0, skin = 0;
        for (let j = 1; j < GH - 1; j++)
          for (let i = 1; i < GW - 1; i++) {
            const v = phi[j * GW + i];
            if (v <= 0) continue;
            oil++; if (v < 0.8) skin++;
          }
        return oil > 0 ? skin / oil : 0;
      })(),
      /* Mean thickness of the oil bodies, in pixels: 2A/P per body, weighted
       * by area. For a circle that is its radius; for a long ribbon it is
       * half its width. This is the number "it gets too skinny" is about,
       * and there was no way to measure it. */
      thickness: (() => {
        let num2 = 0, den = 0;
        for (let L = 0; L < loopCount; L++) {
          const st = loopStart[L], en = loopStart[L + 1], m = en - st;
          if (m < 5) continue;
          let A = 0, P = 0;
          for (let n = 0; n < m; n++) {
            const i0 = st + n, i1 = st + (n + 1) % m;
            const x0 = loopXY[i0 * 2], y0 = loopXY[i0 * 2 + 1];
            const x1 = loopXY[i1 * 2], y1 = loopXY[i1 * 2 + 1];
            A += x0 * y1 - x1 * y0;
            P += Math.hypot(x1 - x0, y1 - y0);
          }
          A = Math.abs(A) * 0.5;
          if (P <= 0 || A <= 0) continue;
          num2 += (2 * A / P) * A; den += A;
        }
        return den > 0 ? num2 / den : 0;
      })(),
      /* Roundness, as the isoperimetric quotient 4*pi*A / P^2 of the whole
       * oil phase. One for a circle, 0.79 for a square, and tending to zero
       * for anything long and thin or spiky.
       *
       * This is the number that says whether the thing on screen is behaving
       * like a liquid, and it was missing. Interfacial tension exists to
       * minimise perimeter for a given area, so a page that renders a fluid
       * correctly *cannot* sit at a low value for long — every sharp corner
       * is a curvature singularity that the force is supposed to eat. Not
       * measuring it is how the interfacial tension got tuned down to a
       * third of its original strength while chasing fragmentation, without
       * anyone noticing that the oil had stopped being round. */
      /* Roundness: the isoperimetric quotient 4*pi*A/P^2 of each separate
       * body, averaged with area as the weight. One for a circle, 0.79 for
       * a square, tending to zero for anything long, thin or ragged.
       *
       * Per body, and that matters. Computing it over the whole oil phase at
       * once — which is what this did first — divides one total area by one
       * total perimeter squared, and for n identical circles that gives 1/n.
       * Eight perfect droplets scored 0.125 and were indistinguishable from
       * eight ragged ribbons, so the number said "not round" exactly when the
       * simulation started succeeding. Steering by it argued for fewer, larger
       * blobs, which is the opposite of what oil in water should do. */
      roundness: (() => {
        let num = 0, den = 0;
        for (let L = 0; L < loopCount; L++) {
          const st = loopStart[L], en = loopStart[L + 1], m = en - st;
          if (m < 5) continue;
          let A = 0, P = 0;
          for (let n = 0; n < m; n++) {
            const i0 = st + n, i1 = st + (n + 1) % m;
            const x0 = loopXY[i0 * 2], y0 = loopXY[i0 * 2 + 1];
            const x1 = loopXY[i1 * 2], y1 = loopXY[i1 * 2 + 1];
            A += x0 * y1 - x1 * y0;
            P += Math.hypot(x1 - x0, y1 - y0);
          }
          A = Math.abs(A) * 0.5;
          if (P <= 0 || A <= 0) continue;
          const q = Math.min(1, 4 * Math.PI * A / (P * P));
          num += q * A; den += A;
        }
        return den > 0 ? num / den : 0;
      })(),
      /* Total interface length, in grid crossings. The honest measure of
       * "is it still mixed": one crossing per cell the boundary passes
       * through, so it is the perimeter and nothing else. `interfaceCells`
       * counts partly-mixed cells and therefore falls both when droplets
       * merge and when a blurred boundary sharpens up, which are different
       * events and were being read as one. */
      perimeter: loopLen,
      rms: Math.sqrt(ke / cells),
      mean: meanPhi(), targetMean, phiMax: hi, phiMin: lo,
      stir: stirEnergy,
      gravity: { x: gDir.x, y: gDir.y }, light: lightAngle,
    };
  },
};

/** Signed area of the extracted loops, as a fraction of the screen.
 *
 *  This is the renderer checking itself against the solver. The contour is a
 *  separate representation of the same field, so if the case table has a
 *  segment the wrong way round or the winding is inconsistent, this and
 *  `oilFraction` disagree — and a flipped orientation shows up as a negative
 *  number rather than as something subtle you find later on a phone. Holes
 *  subtract, which is the point: a loop inside a loop must cancel or the
 *  nonzero fill would paint it as more oil.
 */
function drawnArea() {
  let a = 0;
  for (let L = 0; L < loopCount; L++) {
    const s = loopStart[L], e = loopStart[L + 1], m = e - s;
    if (m < 3) continue;
    for (let n = 0; n < m; n++) {
      const i0 = s + n, i1 = s + (n + 1) % m;
      a += loopXY[i0 * 2] * loopXY[i1 * 2 + 1] - loopXY[i1 * 2] * loopXY[i0 * 2 + 1];
    }
  }
  return a * 0.5 / (W * H);
}

/** Oil as a fraction of the cell, for the diagnostics line. */
function oilArea() {
  let oil = 0;
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) if (phi[j * GW + i] > 0) oil++;
  }
  return oil / ((GW - 2) * (GH - 2));
}

start();
installManifest();
</script>
</body>
