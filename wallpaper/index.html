<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liquid Shaker</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #f5f6f8; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #tap {
    position: fixed; inset: auto 0 8% 0; text-align: center;
    font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #6b7280; pointer-events: none; transition: opacity .5s;
  }
  #tap.hide { opacity: 0; }
  #enable {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    padding: 14px 22px; border: 0; border-radius: 999px;
    background: #2b8cf0; color: #fff; font: 600 16px system-ui, sans-serif;
    box-shadow: 0 6px 20px rgba(43,140,240,.4); display: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tap">shake me</div>
<button id="enable">Enable motion</button>
<script>
"use strict";

/* Liquid shaker — real-time interactive wallpaper.
 *
 * The Blender pipeline in ../blender bakes the hero loop; this is the layer
 * that actually reacts, because a baked loop plays the same way no matter
 * how hard the phone is shaken.
 *
 * Three coupled pieces:
 *
 *   - a coarse stable-fluids velocity field, which is what carries the
 *     glitter. Driven by the container's own acceleration, because that is
 *     the physical cause of sloshing in a shaken vessel.
 *   - a 1-D height field for the free surface, living in the gravity frame
 *     so arbitrary tilt costs only a change of basis. It is coupled to the
 *     fluid so the waterline inherits the flow's structure.
 *   - particles with Stokes drag, size-dependent response time and terminal
 *     velocity, advected through the flow.
 *
 * All of it runs on a fixed timestep; see FIXED_DT for why that is not
 * optional.
 */

const params = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(params.get(k)); return Number.isFinite(v) ? v : d; };

const CONFIG = {
  // "full" — the screen itself is the shaker, liquid edge to edge, squircle
  // corners landing in the screen corners. This is the wallpaper.
  // "pouch" — a discrete squircle floating on a backdrop, which is the
  // product-shot framing rather than a wallpaper.
  mode: params.get("mode") === "pouch" ? "pouch" : "full",
  squircleN: num("n", 4),          // 2 = circle, 4 = squircle, 8 = near square
  /* A real glitter shaker is filled almost to the top. That used to be
   * unsafe: the waterline ran through the rounded corners and the meniscus,
   * stroked across the full span, was chopped off by the glass. Now that the
   * meniscus is trimmed to its true contact points and split into segments,
   * the surface can sit in the corner arc — or press against the ceiling —
   * and still terminate correctly, so the container can be properly full. */
  fill: num("fill", 0.965),
  stars: num("stars", 620),
  bubbles: num("bubbles", 70),
  scale: num("scale", 0.78),       // pouch mode only: size vs the short edge
  columns: 96,
  /* Blue-dominant. The green-teal is not in this ramp: it comes from the
   * denser second phase settling out, so the colour is a consequence of
   * stratification rather than a painted gradient. */
  ramp: ["#0a5fd4", "#1a86f0", "#2aa8ee", "#3ec4e9"],
};

/* Holographic foil comes in pairs, not flat colours. Each flake shifts from
 * the pale end to the saturated end across its own width, which is what
 * "iridescent" means: the hue you see depends on the angle you catch it at,
 * and a flake is big enough to span a range of angles. */
const FLAKE_COLOURS = [
  ["#fffbdc", "#f6d148"],   // butter yellow
  ["#dcffe8", "#4fdd83"],   // mint
  ["#e6f6ff", "#6dc3fb"],   // ice blue
  ["#ffe9f8", "#f79ed4"],   // candy pink
  ["#f5ffdb", "#aeea58"],   // lime
  ["#fffdea", "#ffe37c"],   // pale gold
  ["#e0fff8", "#5fe3ca"],   // aqua
];

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
const hint = document.getElementById("tap");
const enableBtn = document.getElementById("enable");

let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, RX = 0, RY = 0;   // container centre and half-extents

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.floor(window.innerWidth);
  H = Math.floor(window.innerHeight);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W * 0.5; CY = H * 0.5;
  if (CONFIG.mode === "full") {
    // Fill the screen. The squircle keeps its identity at the corners; the
    // liquid runs to every edge, so the wallpaper *is* the shaker rather
    // than a picture of one.
    RX = W * 0.5; RY = H * 0.5;
    corner = num("corner", Math.min(W, H) * 0.12);
  } else {
    RX = RY = Math.min(W, H) * 0.5 * CONFIG.scale;
  }
  buildOutline();
  buildLayers();
  buildFluid();
}

/* ---------------------------------------------------------------- geometry */

let outline = [];          // container boundary, sampled once per resize
let corner = 0;            // squircle corner radius, full-bleed mode only
const OUTLINE_STEPS = 220;

const sgnPow = (v, p) => Math.sign(v) * Math.pow(Math.abs(v), p);

function buildOutline() {
  outline = [];
  const e = 2 / CONFIG.squircleN;

  if (CONFIG.mode === "pouch") {
    // One superellipse. Only sane when RX ≈ RY.
    for (let i = 0; i < OUTLINE_STEPS; i++) {
      const t = (i / OUTLINE_STEPS) * Math.PI * 2;
      outline.push({
        x: CX + RX * sgnPow(Math.cos(t), e),
        y: CY + RY * sgnPow(Math.sin(t), e),
      });
    }
    return;
  }

  /* Full-bleed: straight edges with squircle corners of a fixed radius.
   *
   * A single superellipse cannot do this. Its exponent works on coordinates
   * normalised by RX and RY, so on a 390×844 screen the "corner" rounding
   * scales with each half-extent and the shape balloons into a lozenge —
   * nothing like a phone's corner. Fixing the radius in pixels and bending
   * only the corners keeps the squircle character where it is actually
   * visible, at any aspect ratio.
   */
  const r = corner;
  const L = CX - RX, R = CX + RX, T = CY - RY, B = CY + RY;
  const seg = 26;

  // Each arc runs a quarter turn; `swap` selects which axis leads, so the
  // four corners chain head-to-tail and the straight edges fall out of the
  // lineTo between them.
  const arc = (cx, cy, sx, sy, swap) => {
    for (let i = 0; i <= seg; i++) {
      const t = (i / seg) * Math.PI / 2;
      const a = Math.pow(Math.cos(t), e);
      const b = Math.pow(Math.sin(t), e);
      outline.push(swap
        ? { x: cx + sx * r * b, y: cy + sy * r * a }
        : { x: cx + sx * r * a, y: cy + sy * r * b });
    }
  };

  arc(R - r, B - r, 1, 1, false);    // bottom-right
  arc(L + r, B - r, -1, 1, true);    // bottom-left
  arc(L + r, T + r, -1, -1, false);  // top-left
  arc(R - r, T + r, 1, -1, true);    // top-right
}

/** Append the outline as a subpath, without resetting what is already there. */
function traceOutline(target) {
  target.moveTo(outline[0].x, outline[0].y);
  for (let i = 1; i < outline.length; i++) target.lineTo(outline[i].x, outline[i].y);
  target.closePath();
}

function tracePath(target) {
  target.beginPath();
  traceOutline(target);
}

/** Push a point back inside the container, reporting whether it moved. */
function clampInside(p, pad) {
  const n = CONFIG.squircleN;

  if (CONFIG.mode === "pouch") {
    const ax = RX - pad, ay = RY - pad;
    const dx = (p.x - CX) / ax, dy = (p.y - CY) / ay;
    const f = Math.pow(Math.abs(dx), n) + Math.pow(Math.abs(dy), n);
    if (f <= 1) return false;
    // Radial pull-back: cheap, and exact enough for confetti at this scale.
    const k = Math.pow(f, -1 / n);
    p.x = CX + dx * ax * k;
    p.y = CY + dy * ay * k;
    return true;
  }

  // Full-bleed: clamp to the inset rectangle, then round off whichever
  // corner the point sits in.
  const L = CX - RX + pad, R = CX + RX - pad;
  const T = CY - RY + pad, B = CY + RY - pad;
  let moved = false;
  if (p.x < L) { p.x = L; moved = true; }
  if (p.x > R) { p.x = R; moved = true; }
  if (p.y < T) { p.y = T; moved = true; }
  if (p.y > B) { p.y = B; moved = true; }

  const r = Math.max(1, corner - pad);
  const cx = p.x < CX ? L + r : R - r;
  const cy = p.y < CY ? T + r : B - r;
  const dx = p.x - cx, dy = p.y - cy;
  // Only the quadrant outside both corner centres is actually curved.
  const outX = p.x < CX ? dx < 0 : dx > 0;
  const outY = p.y < CY ? dy < 0 : dy > 0;
  if (outX && outY) {
    const f = Math.pow(Math.abs(dx / r), n) + Math.pow(Math.abs(dy / r), n);
    if (f > 1) {
      const k = Math.pow(f, -1 / n);
      p.x = cx + dx * k;
      p.y = cy + dy * k;
      moved = true;
    }
  }
  return moved;
}

/* ----------------------------------------------------------------- gravity */

/* Screen-space gravity, y positive downward, in units of g.
 *
 * Deliberately NOT a unit vector. The in-plane component of gravity is what
 * pulls the liquid, and it genuinely shrinks as the phone lies flatter —
 * normalising it away made a 5-degree tilt pull exactly as hard as an
 * 85-degree one, and left the surface with no notion of a gentle lean.
 * `gMag` is that in-plane fraction, 0 flat on a table, 1 held upright.
 */
const grav = { x: 0, y: 1 };        // low-passed, magnitude 0..1
const gDir = { x: 0, y: 1 };        // unit direction, holds last good value
let gMag = 1;

/* Container acceleration in the phone's frame, in units of g.
 *
 * This is the whole shake model. In the non-inertial frame of a shaken
 * container the fluid feels a body force of -a, which is the actual physical
 * cause of sloshing; feeding it to the fluid solver produces coherent bulk
 * flow and wall-driven eddies for free. The previous code added independent
 * random velocity to every particle, which is white noise — it looked like
 * the flakes were vibrating rather than being carried by moving liquid.
 */
const accel = { x: 0, y: 0 };
const gravRaw = { x: 0, y: 1 };   // running low-pass of the raw reading
let swirlInput = 0;               // twist about the viewing axis
let haveAccelGravity = false;

function setGravityVector(x, y) {
  grav.x = x; grav.y = y;
  gMag = Math.min(1, Math.hypot(x, y));
  // Flat on a table there is no meaningful in-plane direction; keep the last
  // good one rather than snapping to sensor noise.
  if (gMag > 0.04) { gDir.x = x / gMag; gDir.y = y / gMag; }
}

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x === null) return;
  hint.classList.add("hide");
  haveAccelGravity = true;

  // Device +Y runs up the screen while canvas +y runs down, hence the sign
  // flip on x only. Units of g.
  const sx = -a.x / 9.81, sy = a.y / 9.81;

  /* Split the reading into gravity and hand motion with a low-pass filter,
   * rather than gating on "is the magnitude near 1g" as before. The slow
   * component is which way is down; the residual is the shake. This is why
   * the shake no longer needs a jerk heuristic — it is a measured quantity. */
  const k = 0.06;
  gravRaw.x += (sx - gravRaw.x) * k;
  gravRaw.y += (sy - gravRaw.y) * k;
  setGravityVector(gravRaw.x, gravRaw.y);

  accel.x = sx - gravRaw.x;
  accel.y = sy - gravRaw.y;

  // A twist about the viewing axis stirs the liquid without translating it.
  if (e.rotationRate) {
    const spin = (e.rotationRate.alpha || 0) / 360;
    swirlInput = Math.max(-3, Math.min(3, spin));
  }
}

function onOrientation(e) {
  // Once the accelerometer is supplying gravity, ignore deviceorientation —
  // the two disagree slightly and letting both write causes a slow wobble.
  if (haveAccelGravity) return;
  if (e.beta === null && e.gamma === null) return;
  hint.classList.add("hide");
  // beta is the front-back tilt, gamma the left-right one; the screen-plane
  // gravity components fall out of the Z-X'-Y'' rotation the spec defines.
  // The cos(beta) term is what makes a flat-lying phone have no in-plane
  // pull no matter what gamma reads, and its magnitude is meaningful, so it
  // is passed through unnormalised.
  const b = (e.beta || 0) * Math.PI / 180;
  const gm = (e.gamma || 0) * Math.PI / 180;
  setGravityVector(-Math.cos(b) * Math.sin(gm), Math.sin(b));
}

function listenMotion() {
  window.addEventListener("deviceorientation", onOrientation, true);
  window.addEventListener("devicemotion", onMotion, true);
}

// iOS 13+ gates the sensors behind a user gesture; Android and WebView
// wallpapers do not, so only surface the button when it is actually needed.
const needsPermission =
  typeof DeviceMotionEvent !== "undefined" &&
  typeof DeviceMotionEvent.requestPermission === "function";

if (needsPermission) {
  enableBtn.style.display = "block";
  enableBtn.addEventListener("click", async () => {
    try {
      await DeviceMotionEvent.requestPermission();
      if (typeof DeviceOrientationEvent?.requestPermission === "function") {
        await DeviceOrientationEvent.requestPermission();
      }
    } catch (_) { /* denied — pointer fallback still works */ }
    enableBtn.style.display = "none";
    listenMotion();
  });
} else {
  listenMotion();
}

/* Pointer fallback so the wallpaper is testable on a desktop: drag tilts it,
 * a quick flick shakes it. */
let dragging = false, lastPointer = null;
canvas.addEventListener("pointerdown", (e) => {
  dragging = true; lastPointer = { x: e.clientX, y: e.clientY };
  hint.classList.add("hide");
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastPointer.x, dy = e.clientY - lastPointer.y;
  lastPointer = { x: e.clientX, y: e.clientY };
  // Drive the same acceleration channel the accelerometer feeds, so the
  // desktop fallback exercises the real physics rather than a side path.
  accel.x = Math.max(-3, Math.min(3, dx * 0.06));
  accel.y = Math.max(-3, Math.min(3, dy * 0.06));
  const nx = (e.clientX - CX) / RX, ny = (e.clientY - CY) / RY;
  const len = Math.hypot(nx, ny) || 1;
  setGravityVector(nx / len, ny / len);
});
const endDrag = () => {
  dragging = false;
  accel.x = 0; accel.y = 0;
  setGravityVector(0, 1);   // settle back to real down
};
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

/* -------------------------------------------------------------------- fluid */

/* A real velocity field, which is the thing the old physics was missing.
 *
 * Before this, the surface sloshed and the glitter did not care: flakes were
 * moved by gravity plus per-frame white noise, so the liquid never actually
 * carried anything. Suspended glitter is interesting precisely because it
 * traces the flow, so the flow has to exist.
 *
 * Stable-fluids on a coarse grid: body force, vorticity confinement,
 * semi-Lagrangian advection, then a Jacobi pressure projection to make it
 * divergence-free. Incompressibility is what turns a shove into a swirl —
 * the fluid cannot pile up against a wall, so it has to roll. At ~1500 cells
 * the whole solve is well under a millisecond.
 */
let GW = 0, GH = 0, cell = 1;
let fu, fv, fu0, fv0, fp, fdiv, fsolid;
// Reaction force the particles exert back on the liquid.
let pfx, pfy;

/* A second, denser miscible phase, carried as a passive scalar on the same
 * grid and advected by the same velocity field.
 *
 * The reference has a teal ribbon curling through the blue, and it is not a
 * painted gradient — it is a second liquid that has not fully mixed. Giving
 * it a density difference is what makes it behave: it sinks, so it
 * stratifies into a green-teal layer low down, and a shake tears that layer
 * into the swirls and fingers the reference shows. The colour gradient
 * stops being a decorative ramp and becomes a consequence of stratification.
 */
let dye, dye0;
let dyeCanvas = null, dyeCtx = null, dyeImage = null;

/* Flake concentration, and the dispersive flux that goes with it.
 *
 * A suspension does not let its particles pile up indefinitely: collisions
 * and the disturbance flows around each flake drive a down-gradient flux
 * from crowded regions to empty ones. Without it the convection cells
 * preferentially concentrate the flakes and they band up against the top
 * and bottom — measured at a 2.2x spread between the fullest and emptiest
 * tenth of the container, which is not what a real shaker looks like.
 */
let conc, concNext;

/** Pure containment test, for marking solid cells. */
function isInside(x, y) {
  const n = CONFIG.squircleN;
  if (CONFIG.mode === "pouch") {
    return Math.pow(Math.abs((x - CX) / RX), n) +
           Math.pow(Math.abs((y - CY) / RY), n) <= 1;
  }
  const L = CX - RX, R = CX + RX, T = CY - RY, B = CY + RY;
  if (x < L || x > R || y < T || y > B) return false;
  const r = Math.max(1, corner);
  const cx = x < CX ? L + r : R - r;
  const cy = y < CY ? T + r : B - r;
  const dx = x - cx, dy = y - cy;
  const outX = x < CX ? dx < 0 : dx > 0;
  const outY = y < CY ? dy < 0 : dy > 0;
  if (outX && outY) {
    return Math.pow(Math.abs(dx / r), n) + Math.pow(Math.abs(dy / r), n) <= 1;
  }
  return true;
}

function buildFluid() {
  cell = Math.max(7, W / 34);
  GW = Math.max(6, Math.round(W / cell));
  GH = Math.max(6, Math.round(H / cell));
  const n = GW * GH;
  fu = new Float32Array(n); fv = new Float32Array(n);
  fu0 = new Float32Array(n); fv0 = new Float32Array(n);
  fp = new Float32Array(n); fdiv = new Float32Array(n);
  pfx = new Float32Array(n); pfy = new Float32Array(n);
  dye = new Float32Array(n); dye0 = new Float32Array(n);
  conc = new Float32Array(n); concNext = new Float32Array(n);
  fsolid = new Uint8Array(n);
  causticCanvas = document.createElement("canvas");
  causticCanvas.width = CAUSTIC_W; causticCanvas.height = CAUSTIC_H;
  causticCtx = causticCanvas.getContext("2d");

  dyeCanvas = document.createElement("canvas");
  dyeCanvas.width = GW; dyeCanvas.height = GH;
  dyeCtx = dyeCanvas.getContext("2d");
  dyeImage = dyeCtx.createImageData(GW, GH);
  for (let j = 0; j < GH; j++) {
    for (let i = 0; i < GW; i++) {
      const inside = isInside((i + 0.5) * cell, (j + 0.5) * cell);
      // The outermost ring is always solid so the projection has a boundary.
      const edge = i === 0 || j === 0 || i === GW - 1 || j === GH - 1;
      fsolid[j * GW + i] = (inside && !edge) ? 0 : 1;
    }
  }
  seedDye();
}

/** Start the dense phase pooled low, with enough irregularity that the
 *  first shake tears it into fingers rather than a flat sheet. */
function seedDye() {
  for (let j = 0; j < GH; j++) {
    for (let i = 0; i < GW; i++) {
      const k = j * GW + i;
      if (fsolid[k]) { dye[k] = 0; continue; }
      const depth = j / (GH - 1);                       // 0 top, 1 bottom
      const wob = 0.18 * Math.sin(i * 0.55) + 0.12 * Math.sin(i * 1.3 + 2);
      dye[k] = Math.max(0, Math.min(1, (depth - 0.42 + wob) * 2.1));
    }
  }
}

function advectDye(dt) {
  dye0.set(dye);
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      if (fsolid[k]) { dye[k] = 0; continue; }
      let x = i - dt * fu[k] / cell;
      let y = j - dt * fv[k] / cell;
      if (x < 0.5) x = 0.5; else if (x > GW - 1.5) x = GW - 1.5;
      if (y < 0.5) y = 0.5; else if (y > GH - 1.5) y = GH - 1.5;
      const i0 = x | 0, j0 = y | 0;
      const s = x - i0, t = y - j0;
      const a = j0 * GW, b = (j0 + 1) * GW;
      dye[k] = (1 - t) * ((1 - s) * dye0[a + i0] + s * dye0[a + i0 + 1]) +
                     t * ((1 - s) * dye0[b + i0] + s * dye0[b + i0 + 1]);
    }
  }
}

function fluidAdvect(dst, src, dt) {
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      if (fsolid[k]) { dst[k] = 0; continue; }
      let x = i - dt * fu0[k] / cell;
      let y = j - dt * fv0[k] / cell;
      if (x < 0.5) x = 0.5; else if (x > GW - 1.5) x = GW - 1.5;
      if (y < 0.5) y = 0.5; else if (y > GH - 1.5) y = GH - 1.5;
      const i0 = x | 0, j0 = y | 0;
      const s = x - i0, t = y - j0;
      const a = j0 * GW, b = (j0 + 1) * GW;
      dst[k] = (1 - t) * ((1 - s) * src[a + i0] + s * src[a + i0 + 1]) +
                     t * ((1 - s) * src[b + i0] + s * src[b + i0 + 1]);
    }
  }
}

/** Vorticity confinement: feeds energy back into eddies that the coarse
 *  grid would otherwise smear away within a second or two. */
function fluidVorticity(dt, eps) {
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      fdiv[k] = fsolid[k] ? 0 :
        (fv[k + 1] - fv[k - 1] - (fu[k + GW] - fu[k - GW])) * 0.5;
    }
  }
  for (let j = 2; j < GH - 2; j++) {
    for (let i = 2; i < GW - 2; i++) {
      const k = j * GW + i;
      if (fsolid[k]) continue;
      const dwx = (Math.abs(fdiv[k + 1]) - Math.abs(fdiv[k - 1])) * 0.5;
      const dwy = (Math.abs(fdiv[k + GW]) - Math.abs(fdiv[k - GW])) * 0.5;
      const len = Math.hypot(dwx, dwy) + 1e-5;
      fu[k] += eps * dt * (dwy / len) * fdiv[k];
      fv[k] -= eps * dt * (dwx / len) * fdiv[k];
    }
  }
}

function fluidProject(iters) {
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      fp[k] = 0;
      fdiv[k] = fsolid[k] ? 0 :
        -0.5 * ((fu[k + 1] - fu[k - 1]) + (fv[k + GW] - fv[k - GW]));
    }
  }
  // Gauss-Seidel in place: converges roughly twice as fast as Jacobi here.
  for (let it = 0; it < iters; it++) {
    for (let j = 1; j < GH - 1; j++) {
      for (let i = 1; i < GW - 1; i++) {
        const k = j * GW + i;
        if (fsolid[k]) continue;
        // Solid neighbours reflect the centre pressure — a free-slip wall.
        const l = fsolid[k - 1] ? fp[k] : fp[k - 1];
        const r = fsolid[k + 1] ? fp[k] : fp[k + 1];
        const u = fsolid[k - GW] ? fp[k] : fp[k - GW];
        const d = fsolid[k + GW] ? fp[k] : fp[k + GW];
        fp[k] = (fdiv[k] + l + r + u + d) * 0.25;
      }
    }
  }
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      if (fsolid[k]) { fu[k] = 0; fv[k] = 0; continue; }
      fu[k] -= 0.5 * ((fsolid[k + 1] ? fp[k] : fp[k + 1]) -
                      (fsolid[k - 1] ? fp[k] : fp[k - 1]));
      fv[k] -= 0.5 * ((fsolid[k + GW] ? fp[k] : fp[k + GW]) -
                      (fsolid[k - GW] ? fp[k] : fp[k - GW]));
    }
  }
}

/* Strip the net force out of a body-force field before it is applied.
 *
 * The liquid is sealed in a container, so the container absorbs whatever net
 * force the contents exert — total momentum stays zero. Skipping that is not
 * a small error: a spatially uniform force is divergence-free, so the
 * pressure projection cannot remove the drift it causes, and it accumulates
 * without bound. Measured upside down, the settling flakes' own reaction
 * had spun up a 28 px/s bulk flow against a 4.8 px/s settling speed — six
 * times stronger than the thing it came from, sweeping every flake to the
 * surface and holding it there indefinitely.
 *
 * Subtracting the mean leaves every local plume and eddy intact. Only the
 * bulk translation, which a sealed vessel cannot have, goes away.
 */
function removeNetForce(ax, ay) {
  let sx = 0, sy = 0, count = 0;
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      if (fsolid[k]) continue;
      sx += ax[k]; sy += ay[k]; count++;
    }
  }
  if (count === 0) return;
  const mx = sx / count, my = sy / count;
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      if (fsolid[k]) continue;
      ax[k] -= mx; ay[k] -= my;
    }
  }
}

/** Mean concentration of the dense phase over the liquid. Buoyancy is a
 *  force relative to the ambient, so it is this that the difference is
 *  taken against — using a fixed 0.5 injects a net force whenever the
 *  mixture is not exactly half and half. */
function meanDye() {
  let s = 0, count = 0;
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      if (fsolid[k]) continue;
      s += dye[k]; count++;
    }
  }
  return count ? s / count : 0.5;
}

function fluidStep(dt) {
  const n = GW * GH;
  removeNetForce(pfx, pfy);
  const dyeMean = meanDye();
  // Body force from the container's acceleration, in the non-inertial frame.
  const fx = -accel.x * FLUID_DRIVE, fy = -accel.y * FLUID_DRIVE;
  const swirl = swirlInput * FLUID_SWIRL;
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      if (fsolid[k]) { pfx[k] = 0; pfy[k] = 0; continue; }
      fu[k] += fx * dt;
      fv[k] += fy * dt;
      // Reaction from the particles, accumulated during the previous step.
      fu[k] += pfx[k] * dt;
      fv[k] += pfy[k] * dt;
      pfx[k] = 0; pfy[k] = 0;

      /* Buoyancy on the dense phase. This is the whole reason the ribbon
       * moves like a liquid: heavier fluid sinks, lighter fluid gets out of
       * its way, and the Rayleigh-Taylor fingers that produces are exactly
       * the curling teal shapes in the reference. */
      const bw = (dye[k] - dyeMean) * DYE_BUOY * gMag * dt;
      fu[k] += gDir.x * bw;
      fv[k] += gDir.y * bw;
      if (swirl) {
        // Rotation about the centre, so a twist stirs rather than shoves.
        fu[k] -= ((j + 0.5) * cell - CY) * swirl * dt;
        fv[k] += ((i + 0.5) * cell - CX) * swirl * dt;
      }
    }
  }
  swirlInput *= Math.exp(-6 * dt);

  fluidVorticity(dt, 9);

  fu0.set(fu); fv0.set(fv);
  fluidAdvect(fu, fu0, dt);
  fluidAdvect(fv, fv0, dt);

  fluidProject(18);

  // The dense phase rides the velocity field it just helped create.
  advectDye(dt);

  // Viscosity. Frame-rate independent: a per-frame multiplier would make the
  // liquid thicker at low frame rates.
  const decay = Math.exp(-FLUID_VISC * dt);
  for (let i = 0; i < n; i++) { fu[i] *= decay; fv[i] *= decay; }

  /* No-slip at the glass. The projection alone gives a free-slip wall, which
   * lets the liquid skate along the container as if it were frictionless.
   * A viscous glitter gel grips the glass, and the resulting boundary layer
   * is what sheds the vortices that make a shake swirl rather than slosh
   * back and forth. */
  const wall = Math.exp(-FLUID_WALL_DRAG * dt);
  for (let j = 1; j < GH - 1; j++) {
    for (let i = 1; i < GW - 1; i++) {
      const k = j * GW + i;
      if (fsolid[k]) continue;
      if (fsolid[k - 1] || fsolid[k + 1] || fsolid[k - GW] || fsolid[k + GW]) {
        fu[k] *= wall; fv[k] *= wall;
      }
    }
  }
}

const FLUID_DRIVE = 2600;   // px/s^2 per g of container acceleration
const FLUID_SWIRL = 1.6;    // rad/s^2 per unit of twist
const FLUID_VISC = 0.62;    // 1/s
const FLUID_WALL_DRAG = 3.2; // 1/s, applied only in cells touching glass
const COUPLE = 0.055;       // particle reaction strength fed back to the fluid
const DYE_BUOY = 130;       // px/s^2 between the two phases at full contrast
const DISPERSE = 1100;       // px/s of down-gradient drift per unit relative gradient
const WAKE = 150;           // px/s^2 of wake attraction between near bubbles

/* Two-way coupling: a particle dragged by the liquid drags back.
 *
 * One-way advection is the usual shortcut and it misses the most
 * characteristic thing a glitter shaker does — settling flakes pull liquid
 * down with them, the displaced liquid has to rise somewhere, and the
 * suspension organises itself into slow convection plumes. Newton's third
 * law is what produces that; without it a settle is just parallel falling.
 */
function scatterForce(x, y, fx, fy) {
  let gx = x / cell - 0.5, gy = y / cell - 0.5;
  if (gx < 0) gx = 0; else if (gx > GW - 1.001) gx = GW - 1.001;
  if (gy < 0) gy = 0; else if (gy > GH - 1.001) gy = GH - 1.001;
  const i0 = gx | 0, j0 = gy | 0;
  const s = gx - i0, t = gy - j0;
  const a = j0 * GW + i0, b = (j0 + 1) * GW + i0;
  const w0 = (1 - s) * (1 - t), w1 = s * (1 - t);
  const w2 = (1 - s) * t, w3 = s * t;
  pfx[a] += fx * w0; pfx[a + 1] += fx * w1;
  pfx[b] += fx * w2; pfx[b + 1] += fx * w3;
  pfy[a] += fy * w0; pfy[a + 1] += fy * w1;
  pfy[b] += fy * w2; pfy[b + 1] += fy * w3;
}

/** Bilinear deposit of one flake into the concentration accumulator. */
function depositConc(x, y, w) {
  let gx = x / cell - 0.5, gy = y / cell - 0.5;
  if (gx < 0) gx = 0; else if (gx > GW - 1.001) gx = GW - 1.001;
  if (gy < 0) gy = 0; else if (gy > GH - 1.001) gy = GH - 1.001;
  const i0 = gx | 0, j0 = gy | 0;
  const s = gx - i0, t = gy - j0;
  const a = j0 * GW + i0, b = (j0 + 1) * GW + i0;
  concNext[a] += w * (1 - s) * (1 - t); concNext[a + 1] += w * s * (1 - t);
  concNext[b] += w * (1 - s) * t;       concNext[b + 1] += w * s * t;
}

/** Down-gradient dispersive drift at a point, from the previous step's
 *  concentration field. Normalised by local concentration so it is a
 *  diffusive flux rather than a force that grows without bound. */
const disperse = { x: 0, y: 0 };
function sampleDisperse(x, y, out) {
  let gx = x / cell, gy = y / cell;
  const i = Math.max(1, Math.min(GW - 2, gx | 0));
  const j = Math.max(1, Math.min(GH - 2, gy | 0));
  const k = j * GW + i;
  const c = conc[k] + 0.9;
  out.x = -(conc[k + 1] - conc[k - 1]) * 0.5 / c;
  out.y = -(conc[k + GW] - conc[k - GW]) * 0.5 / c;
}

/* Local vorticity, for particles that have to be turned by the flow.
 *
 * A small particle suspended in a fluid rotates at half the local
 * vorticity — that is the rigid-body part of the velocity gradient, and it
 * is why glitter tumbles hard in a shaken shaker and drifts almost still in
 * a settled one. Giving each flake a fixed spin rate instead meant they
 * turned at the same rate whatever the liquid was doing.
 */
function sampleCurl(x, y) {
  const i = Math.max(1, Math.min(GW - 2, (x / cell) | 0));
  const j = Math.max(1, Math.min(GH - 2, (y / cell) | 0));
  const k = j * GW + i;
  if (fsolid[k]) return 0;
  return ((fv[k + 1] - fv[k - 1]) - (fu[k + GW] - fu[k - GW])) * 0.5 / cell;
}

const flow = { x: 0, y: 0 };
function sampleFlow(x, y, out) {
  let gx = x / cell - 0.5, gy = y / cell - 0.5;
  if (gx < 0) gx = 0; else if (gx > GW - 1.001) gx = GW - 1.001;
  if (gy < 0) gy = 0; else if (gy > GH - 1.001) gy = GH - 1.001;
  const i0 = gx | 0, j0 = gy | 0;
  const s = gx - i0, t = gy - j0;
  const a = j0 * GW + i0, b = (j0 + 1) * GW + i0;
  out.x = (1 - t) * ((1 - s) * fu[a] + s * fu[a + 1]) +
                t * ((1 - s) * fu[b] + s * fu[b + 1]);
  out.y = (1 - t) * ((1 - s) * fv[a] + s * fv[a + 1]) +
                t * ((1 - s) * fv[b] + s * fv[b + 1]);
}

/* ------------------------------------------------------------- height field */

// h[i] is surface displacement along -gravity; wv[i] its velocity, px and px/s.
const N = CONFIG.columns;
const h = new Float32Array(N);
const wv = new Float32Array(N);
const surfDrive = new Float32Array(N);   // flow velocity normal to the surface
let level = 0;              // signed distance of the surface from centre
let targetArea = 0;

function stepWaves(dt) {
  /* Wave speed scales with the in-plane gravity: a phone held upright has a
   * snappy surface, one lying flat has a sluggish one. The restoring force
   * is what gravity actually provides, so tying them is not decoration.
   *
   * Explicit integration needs the CFL condition respected, so substep
   * rather than letting a low frame rate blow the surface up. The old code
   * scaled by dt in one place and not the other, which made the wave speed
   * itself depend on frame rate.
   */
  const cross = 0.5 / Math.max(0.12, gMag);      // seconds to cross the span
  const c = N / cross;                            // cells per second
  /* Capillary stiffness. Real waves are gravity-capillary: omega^2 = gk +
   * (sigma/rho)k^3, so short wavelengths are stiffened by surface tension
   * rather than following the same law as long ones. The k^3 term is a
   * fourth difference, and it doubles as the thing that keeps grid-scale
   * noise from surviving in the waterline. */
  const sigma = c * c * 0.035;
  // The fourth-difference term has a much tighter CFL limit than the second.
  const sub = Math.min(12, Math.max(1,
    Math.ceil(Math.max(c * dt / 0.4, Math.sqrt(sigma * 16) * dt / 0.5))));
  const sdt = dt / sub;
  const damp = Math.exp(-0.9 * sdt);
  const c2 = c * c;
  /* Asymmetric bounds, because the container is not symmetric about the
   * surface. Upward the crest may reach the ceiling and press against it —
   * in a nearly full vessel that is exactly what happens, and the air pocket
   * simply migrates elsewhere; the render trims the surface to the glass, so
   * the waterline correctly breaks where liquid meets the top wall. Downward
   * there is the whole body of liquid to draw from. */
  const ceiling = Math.max(4, upExtent - level) + upExtent * 0.05;
  const trough = upExtent * 0.34;

  // Sloshing: acceleration along the surface tilts it, exactly as an
  // effective gravity would. This replaces the random splashes, which
  // injected noise unrelated to how the phone actually moved.
  const aTan = (accel.x * tan.x + accel.y * tan.y) * 900;

  /* Kinematic free-surface coupling: the surface rides whatever the fluid
   * underneath is doing.
   *
   * Without this the tilt term above is the *only* forcing, and it is
   * perfectly linear in i — so the surface can only ever be a straight line,
   * however hard the phone is shaken. Measured: a 2.3g shake moved the crest
   * to 21% of its cap and rendered as a clean diagonal. Sampling the solver
   * at each column is what puts real structure into the waterline, because
   * the eddies and wall effects are already in the flow field.
   */
  for (let i = 0; i < N; i++) {
    const s = -span + 2 * span * (i / (N - 1));
    const lift = level + h[i];
    sampleFlow(CX + tan.x * s + up.x * lift,
               CY + tan.y * s + up.y * lift, flow);
    surfDrive[i] = flow.x * up.x + flow.y * up.y;
  }

  for (let s = 0; s < sub; s++) {
    for (let i = 0; i < N; i++) {
      const l = h[i > 0 ? i - 1 : 0];
      const r = h[i < N - 1 ? i + 1 : N - 1];
      const l2 = h[i > 1 ? i - 2 : 0];
      const r2 = h[i < N - 2 ? i + 2 : N - 1];
      wv[i] += (l + r - 2 * h[i]) * c2 * sdt;                       // gravity
      wv[i] -= (l2 - 4 * l + 6 * h[i] - 4 * r + r2) * sigma * sdt;  // capillary
      wv[i] -= aTan * (i / (N - 1) - 0.5) * 2 * sdt;
      wv[i] += (surfDrive[i] - wv[i]) * 6 * sdt;
      wv[i] *= damp;
    }
    for (let i = 0; i < N; i++) {
      h[i] += wv[i] * sdt;
      if (h[i] > ceiling) { h[i] = ceiling; wv[i] *= 0.4; }
      else if (h[i] < -trough) { h[i] = -trough; wv[i] *= 0.4; }
    }
  }

  /* Keep the height field zero-mean, moving any bulk offset into `level`.
   *
   * The two together describe the surface, so the split between them is
   * free — and left free it drifts. Rolling the phone through 180 degrees
   * sent `level` from 513 to -22 while the wave field grew to compensate:
   * the total was right the whole way (volume stayed conserved to 0.1%) but
   * the decomposition was meaningless, and since the crest bound is derived
   * from `level`, a sinking `level` licensed an ever larger wave. Defining
   * `level` as the mean and `h` as the deviation from it removes the
   * freedom that was drifting.
   */
  let mean = 0;
  for (let i = 0; i < N; i++) mean += h[i];
  mean /= N;
  if (mean !== 0) {
    level += mean;
    for (let i = 0; i < N; i++) h[i] -= mean;
  }
}

/* --------------------------------------------------------------- particles */

const stars = [], bubbles = [];
let bubbleUnit = 1, maxBubble = 1;

/* Sizes. The shaker is seeded with a spread including the large trapped-air
 * bubbles it starts with, but a *new* bubble nucleates small and grows only
 * by merging — which is the loop that keeps the population in balance.
 *
 * Both halves of that matter. Respawning small with a fast rise drained the
 * shaker: large bubbles surfaced and came back as fizz, leaving a median
 * radius of 3px. Respawning large ran it away the other direction, since
 * coalescence only ever grows a bubble and nothing removed the big ones
 * fast enough — median 21px and 194 interpenetrating pairs. Small births
 * plus a rise slow enough for them to survive and merge is the balance.
 */
function bubbleSeedRadius() {
  const bt = Math.random();
  return (bt < 0.72 ? 3 + bt * 7 : 12 + (bt - 0.72) * 110) * bubbleUnit;
}

function bubbleBirthRadius() {
  return (3 + Math.random() * 5) * bubbleUnit;
}

/** Buoyancy against drag: both rise speed and response time follow from the
 *  radius, so a bubble's whole behaviour is set by its size alone. */
function setBubbleSize(b, r) {
  b.r = r;
  const u = r / bubbleUnit;
  /* Added mass. A bubble's own gas weighs almost nothing, so its entire
   * inertia is the liquid it has to shove aside to move — half the
   * displaced mass for a sphere. That is why a bubble answers a shove
   * sluggishly rather than snapping to the flow like its density suggests. */
  b.tau = 0.05 + u * u * 0.0034;
  /* Rise speed goes as r-squared only while Stokes drag holds. Past that a
   * real bubble departs from it badly and plateaus — deformation and the
   * surfactant skin cost it the rest. Leaving the square law uncapped made
   * a large bubble rise at 526 px/s and cross the whole screen in 1.6
   * seconds, which is why no big bubble ever survived long enough to be
   * seen: the population kept collapsing back to fizz. */
  b.rise = Math.min(5 + u * u * 0.55, 34) * bubbleUnit;
  b.mass = u * u * 0.55;
  b.wobble = (5 + (u % 7)) * bubbleUnit;
}

/** Drop a bubble back into the body of the liquid, well below the surface. */
function respawnBubble(b) {
  b.vx = 0; b.vy = 0; b.squash = 0;
  for (let tries = 0; tries < 6; tries++) {
    b.x = CX + (Math.random() * 2 - 1) * RX * 0.92;
    b.y = CY + (Math.random() * 2 - 1) * RY * 0.92;
    if (depthOf(b.x, b.y) < -b.r * 4) break;
  }
  clampInside(b, Math.min(RX, RY) * 0.03);
}

function seed() {
  stars.length = 0; bubbles.length = 0;
  const unit = Math.min(W, H) / 720;
  for (let i = 0; i < CONFIG.stars; i++) {
    // Skewed size distribution: mostly fine glitter with a scatter of big
    // hero flakes. A uniform range gave an even speckle that read as noise
    // rather than as confetti suspended at different depths.
    const t = Math.random();
    const r = (t < 0.72 ? 1.9 + t * 2.8 : 5.2 + (t - 0.72) * 30) * unit;
    stars.push({
      x: CX + (Math.random() * 2 - 1) * RX * 0.9,
      y: CY + (Math.random() * 2 - 1) * RY * 0.9,
      vx: 0, vy: 0,
      r,
      spin: Math.random() * Math.PI * 2,
      spinRate: (Math.random() - 0.5) * 0.06,
      hueIdx: (Math.random() * FLAKE_COLOURS.length) | 0,
      shape: Math.random() > 0.42 ? 0 : 1 + ((Math.random() * 3) | 0),
      hue: FLAKE_COLOURS[(Math.random() * FLAKE_COLOURS.length) | 0][1],
      // Holographic flakes catch the light intermittently as they turn.
      flashPhase: Math.random() * Math.PI * 2,
      flashRate: 0.6 + Math.random() * 1.8,
      /* Stokes drag. Response time and terminal velocity both scale with
       * radius squared, so fine glitter traces the flow almost exactly while
       * big flakes lag, overshoot on a turn and sink noticeably faster. That
       * spread is what makes the settle look like a real suspension instead
       * of every flake moving as one sheet. */
      tau: 0.02 + (r / unit) * (r / unit) * 0.0016,
      /* Settling speed. Turning a real glitter shaker over empties it in
       * tens of seconds, not minutes: at the old rate the median flake
       * needed four minutes to cross the container, so inverting the phone
       * produced almost no visible fall. But the first correction
       * overshot: at 80 seconds of stillness the body had drained and all
       * the glitter sat in the bottom third, which is not what anyone
       * wants to look at. Halved again — big flakes still fall visibly
       * within a flip, the fine glitter stays up for minutes. */
      terminal: (4 + (r / unit) * (r / unit) * 0.5) * unit,
      // Flakes rock from side to side as they sink rather than dropping
      // straight — the characteristic glitter flutter.
      flutterRate: 1.4 + Math.random() * 2.6,
      flutterPhase: Math.random() * Math.PI * 2,
      flutterAmp: (6 + Math.random() * 14) * unit,
      // Mass proxy for the reaction it exerts back on the liquid.
      mass: (r / unit) * (r / unit),
      /* Position through the thickness of the pouch, -1 at the back wall
       * and +1 against the front glass. The simulation is 2-D, but the
       * pouch is not, and this is what buys back the depth: flakes behind
       * the liquid are drawn under the tint and read as immersed, flakes in
       * front are drawn over it and read as pressed against the glass. */
      z: Math.random() * 2 - 1,
      zDrift: (Math.random() - 0.5) * 0.09,
    });
  }
  bubbleUnit = unit;
  maxBubble = Math.min(RX, RY) * 0.13;
  for (let i = 0; i < CONFIG.bubbles; i++) {
    /* Skewed: mostly fine fizz, plus the large trapped-air bubbles a sealed
     * shaker genuinely starts with. Leaving coalescence as their only source
     * was a mistake — it made every bubble tiny and they all but vanished,
     * because merging only just keeps pace with popping. Coalescence now
     * adds to this population rather than being the whole of it. */
    const r = bubbleSeedRadius();
    const b = {
      x: CX + (Math.random() * 2 - 1) * RX * 0.9,
      y: CY + (Math.random() * 2 - 1) * RY * 0.9,
      vx: 0, vy: 0,
      phase: Math.random() * Math.PI * 2,
      // Bubbles used to teleport from the surface back to the bottom in one
      // frame, which was plainly visible. They now fade out and back in.
      alpha: Math.random(),
      fading: false,
      rest: 0,           // seconds spent sitting under the surface
      squash: 0,         // deformation, driven by how fast it is climbing
      z: Math.random() * 2 - 1,
      zDrift: (Math.random() - 0.5) * 0.07,
    };
    setBubbleSize(b, r);
    bubbles.push(b);
  }
  /* Draw order is depth order, and depth is now a real coordinate rather
   * than size standing in for it. */
  stars.sort((a, b) => a.z - b.z);
  bubbles.sort((a, b) => a.z - b.z);
  starSplit = depthSplit(stars);
  bubbleSplit = depthSplit(bubbles);
  buildSprites();
}

/* Offscreen sprites for the soft glows.
 *
 * A per-particle radial gradient is the obvious way to do this and it tanks
 * the frame rate at 600 flakes — the gradient has to be rebuilt every frame
 * because it is positioned in user space. Bake each once and blit it scaled
 * instead. */
let glowSprite = null, bubbleSprite = null, bubbleSmall = null;
let shaftSprite = null;
let causticCanvas = null, causticCtx = null;
const CAUSTIC_W = 96, CAUSTIC_H = 220;
let flareSprite = null;

/* Full-screen layers that depend only on the container, not on gravity:
 * the glass shell and the depth vignette. Rebuilding their gradients every
 * frame cost five full-screen fills and dropped the wallpaper to 18fps.
 * Baked once per resize, they are one blit each. */
let glassLayer = null, depthLayer = null;

function sprite(size, paint) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  paint(c.getContext("2d"), size);
  return c;
}

function spriteWH(w, h, paint) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  paint(c.getContext("2d"), w, h);
  return c;
}

function layer(paint) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.floor(W * DPR));
  c.height = Math.max(1, Math.floor(H * DPR));
  const g = c.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  paint(g);
  return c;
}

/* Soft band hugging the inside of the container edge.
 *
 * The obvious implementation is a radial gradient in normalised container
 * space, and it is wrong: normalising by RX and RY turns the falloff into a
 * huge oval on a portrait screen instead of something that follows the
 * rounded rectangle. Stroking the outline itself and blurring it tracks the
 * real silhouette at any aspect. Blur is only paid at resize, never in the
 * render loop; where ctx.filter is missing, stacked strokes approximate it.
 */
function softEdge(g, colour, width, blur, alpha) {
  const supportsFilter = typeof g.filter === "string";
  g.save();
  g.globalAlpha = alpha;
  g.strokeStyle = colour;
  g.lineJoin = "round";
  if (supportsFilter) {
    g.filter = `blur(${Math.max(1, blur)}px)`;
    // Double width: half the stroke lands outside the shape and is trimmed
    // by the corner knockout, leaving a band on the inside.
    g.lineWidth = width * 2;
    tracePath(g);
    g.stroke();
    g.filter = "none";
  } else {
    const steps = 14;
    g.globalAlpha = alpha / steps * 1.9;
    for (let i = 0; i < steps; i++) {
      g.lineWidth = width * 2 * (1 - i / steps);
      tracePath(g);
      g.stroke();
    }
  }
  g.restore();
}

function buildLayers() {
  const short = Math.min(RX, RY);

  depthLayer = layer((g) => {
    /* Where the liquid thins out against the wall.
     *
     * This had it backwards, and expensively: a 58px dark band blurred over
     * 43px, hugging the rim. A pouch is a pillow — the liquid is deepest
     * through the middle and tapers to nothing where the walls close, so
     * absorption is strongest in the centre and the rim is the *clearest*
     * part, not the darkest. And blurring it over a quarter of the short
     * side turned the whole border into a haze the liquid faded away into
     * rather than filling up to.
     *
     * Narrow, bright, and barely blurred: liquid that thins and a glass
     * wall that refracts, meeting the edge crisply.
     */
    softEdge(g, "#dcf2ff", short * 0.030, short * 0.006, 0.42);
  });

  glassLayer = layer((g) => {
    g.save();
    tracePath(g);
    g.clip();
    // (clip here is free — this layer is built once, not per frame)

    // Broad sweep from the top-left.
    const spec = g.createLinearGradient(
      CX - RX, CY - RY, CX + RX * 0.5, CY + RY * 0.35);
    spec.addColorStop(0, "rgba(255,255,255,.42)");
    spec.addColorStop(0.22, "rgba(255,255,255,.10)");
    spec.addColorStop(0.5, "rgba(255,255,255,0)");
    g.fillStyle = spec;
    g.fillRect(CX - RX, CY - RY, RX * 2, RY * 2);

    // Tighter secondary catch bottom-right.
    const spec2 = g.createLinearGradient(
      CX + RX, CY + RY, CX + RX * 0.1, CY + RY * 0.45);
    spec2.addColorStop(0, "rgba(255,255,255,.26)");
    spec2.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = spec2;
    g.fillRect(CX - RX, CY - RY, RX * 2, RY * 2);

    g.restore();

    // Specular line along the glass itself. Thin and near-sharp: a wide
    // blurred rim reads as fog around the edge, not as a wall.
    softEdge(g, "#ffffff", short * 0.016, short * 0.004, 0.7);

    /* Knock out everything beyond the squircle with the page background.
     * This is what lets the render loop drop its per-frame clip(): the
     * liquid can be drawn as a plain full-screen fill and this layer trims
     * the corners on the way past. */
    g.fillStyle = "#eef1f4";
    g.beginPath();
    g.rect(0, 0, W, H);
    traceOutline(g);
    g.fill("evenodd");

    tracePath(g);
    g.lineWidth = Math.max(2, RX * 0.02);
    g.strokeStyle = "rgba(255,255,255,.95)";
    g.stroke();
    g.lineWidth = Math.max(1, RX * 0.005);
    g.strokeStyle = "rgba(150,200,225,.5)";
    g.stroke();
  });
}

/* One baked sprite per hue and shape, plus white copies for the specular
 * flash. Tessellating a ten-point star path 620 times a frame — twice, with
 * the flash — is what held this at 32fps; blitting a sprite does not touch
 * the path rasteriser at all. */
const flakeSprites = [];
const flakeSmall = [];
const flashSprites = [];
const specSprites = [];
// Angular resolution of the specular atlas, and where the light sits.
const SPEC_K = 16;
const LIGHT_ANGLE = -Math.PI * 0.72;
const FLAKE_PX = 64;
const SHAPES = 4;   // 0 = star, 1..3 = crushed-foil shards
const SMALL_PX = 12;

function flakePath(g, cx, cy, R, shape) {
  g.beginPath();
  if (shape === 0) {
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? R : R * 0.44;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
  } else {
    /* Crushed foil, not a pebble. The old shard was a six-sided blob with
     * gentle radius variation and read as a rounded lozenge; real glitter
     * shards are angular offcuts with sharp corners and long facets. */
    const sides = 5 + (shape % 3);
    const seed = shape * 7.13;
    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * Math.PI * 2 + Math.sin(seed + i) * 0.35;
      const t = Math.sin(seed * 2.1 + i * 2.7);
      const r = R * (0.42 + 0.58 * (t * 0.5 + 0.5));
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
  }
  g.closePath();
}

/* Paint one flake as a piece of foil rather than a silhouette.
 *
 * A flat fill was what made these read as sticker cutouts: a single pastel
 * colour edge to edge, no material, no light. A glitter flake is a tiny
 * mirror — an iridescent shift from the pale end of its hue to the
 * saturated end, and a bright edge where the cut catches light.
 *
 * The specular is deliberately NOT painted here. It belongs to the light,
 * not to the flake, so it cannot be baked into something that rotates.
 */
function paintFlake(g, size, shape, light, deep) {
  const c = size / 2, R = size / 2 - Math.max(1, size * 0.04);
  flakePath(g, c, c, R, shape);
  const grad = g.createLinearGradient(c - R, c - R, c + R, c + R);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(0.28, light);
  grad.addColorStop(0.72, deep);
  grad.addColorStop(1, light);
  g.fillStyle = grad;
  g.fill();

  if (size < 16) return;   // below this none of the rest survives the scale

  flakePath(g, c, c, R, shape);
  g.lineWidth = Math.max(1, size * 0.035);
  g.lineJoin = "round";
  g.strokeStyle = "rgba(255,255,255,.7)";
  g.stroke();
}

/* The specular, as an atlas over the angle between the flake and the light.
 *
 * Baking the streak into the flake meant it turned with the flake, so every
 * highlight orbited its own particle — light apparently attached to the
 * object rather than arriving from somewhere. A highlight is a property of
 * the light source and stays put while the thing under it rotates.
 *
 * The flake still has to be drawn in its own rotated frame, so the streak is
 * baked at each of SPEC_K angles *within* that frame, and the draw picks the
 * entry that cancels the flake's current rotation. The result is a highlight
 * fixed in world space that sweeps across the facet as it turns, which is
 * what a mirror does.
 */
function paintFlakeSpec(g, size, shape, angle) {
  const c = size / 2, R = size / 2 - Math.max(1, size * 0.04);
  g.save();
  flakePath(g, c, c, R, shape);
  g.clip();
  g.translate(c, c);
  g.rotate(angle);
  const spec = g.createLinearGradient(0, -R, 0, R);
  spec.addColorStop(0, "rgba(255,255,255,0)");
  spec.addColorStop(0.32, "rgba(255,255,255,.72)");
  spec.addColorStop(0.46, "rgba(255,255,255,.10)");
  spec.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = spec;
  g.fillRect(-R * 1.6, -R * 1.6, R * 3.2, R * 3.2);
  g.restore();
}

function buildFlakeSprites() {
  flakeSprites.length = 0; flashSprites.length = 0; flakeSmall.length = 0;
  specSprites.length = 0;
  for (let hi = 0; hi < FLAKE_COLOURS.length; hi++) {
    const [light, deep] = FLAKE_COLOURS[hi];
    for (let shape = 0; shape < SHAPES; shape++) {
      flakeSprites.push(sprite(FLAKE_PX, (g) =>
        paintFlake(g, FLAKE_PX, shape, light, deep)));
      /* A second, small copy of every flake.
       *
       * Canvas has no mipmaps, so drawing the 64px sprite down to the three
       * or four pixels most of the glitter occupies makes the rasteriser
       * filter the whole thing every single time — measured at 23fps of the
       * frame budget for 620 flakes. Blitting a sprite that is already
       * roughly the right size costs a fraction of that. */
      flakeSmall.push(sprite(SMALL_PX, (g) =>
        paintFlake(g, SMALL_PX, shape, light, deep)));
    }
  }
  // Specular is colourless, so the atlas is over shape and angle only.
  for (let shape = 0; shape < SHAPES; shape++) {
    for (let k = 0; k < SPEC_K; k++) {
      specSprites.push(sprite(FLAKE_PX, (g) =>
        paintFlakeSpec(g, FLAKE_PX, shape, k / SPEC_K * Math.PI * 2)));
    }
  }
  for (let shape = 0; shape < SHAPES; shape++) {
    flashSprites.push(sprite(FLAKE_PX, (g) => {
      const c = FLAKE_PX / 2, R = FLAKE_PX / 2 - 2;
      g.fillStyle = "#ffffff";
      flakePath(g, c, c, R, shape);
      g.fill();
    }));
  }
}

function buildSprites() {
  buildFlakeSprites();
  glowSprite = sprite(64, (g, s) => {
    const r = s / 2;
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, "rgba(255,255,255,.85)");
    grad.addColorStop(0.35, "rgba(255,255,255,.22)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
  });

  /* An air bubble is thinnest through the middle, so you look straight
   * through it and see the liquid behind barely changed. Everything that
   * makes it visible happens at the rim, where the film turns edge-on: the
   * ray path lengthens, it refracts a dark band, and past the critical
   * angle it total-internal-reflects a hard bright ring.
   *
   * The previous attempt filled the interior with a lit-sphere gradient and
   * produced a milky marble — opaque where a bubble is clearest, and washed
   * out against the liquid because the fill was lighter than its
   * surroundings everywhere. Almost all of the contrast belongs in the
   * outer fifth of the radius.
   */
  const paintBubble = (g, s) => {
    const r = s / 2;
    const disc = () => { g.beginPath(); g.arc(r, r, r, 0, Math.PI * 2); };

    disc(); g.save(); g.clip();

    // 1. The film itself. Nearly nothing until close to the edge.
    const film = g.createRadialGradient(r, r, 0, r, r, r);
    film.addColorStop(0.00, "rgba(255,255,255,.015)");
    film.addColorStop(0.62, "rgba(226,246,255,.04)");
    film.addColorStop(0.85, "rgba(214,242,255,.11)");
    film.addColorStop(0.96, "rgba(232,249,255,.26)");
    film.addColorStop(1, "rgba(255,255,255,.34)");
    g.fillStyle = film;
    g.fillRect(0, 0, s, s);

    // 2. Refracted dark band inside the rim. This is what gives the
    //    silhouette its definition — without it the bubble has no edge
    //    against liquid of a similar brightness.
    const dark = g.createRadialGradient(r, r, r * 0.74, r, r, r);
    dark.addColorStop(0, "rgba(9,52,112,0)");
    dark.addColorStop(0.5, "rgba(9,52,112,.17)");
    dark.addColorStop(0.85, "rgba(7,44,102,.30)");
    dark.addColorStop(1, "rgba(7,44,102,.05)");
    g.fillStyle = dark;
    g.fillRect(0, 0, s, s);

    // 3. Caustic: the sphere focuses light into a crescent on the side away
    //    from the source, riding just inside the rim.
    g.lineCap = "round";
    //    The specular puts the light up-left, so the focus lands down-right;
    //    sweeping it across the bottom put the crescent on the wrong side.
    for (const [w, a, from, to] of [
      [0.13, 0.24, -0.22, 0.56], [0.075, 0.44, -0.14, 0.46],
      [0.035, 0.72, -0.04, 0.36],
    ]) {
      g.lineWidth = r * w;
      g.strokeStyle = `rgba(238,254,255,${a})`;
      g.beginPath();
      g.arc(r, r, r * 0.90, Math.PI * from, Math.PI * to);
      g.stroke();
    }
    g.restore();

    // 4. Total-internal-reflection rim: hard, bright, and thin.
    const rim = g.createRadialGradient(r, r, r * 0.90, r, r, r);
    rim.addColorStop(0, "rgba(255,255,255,0)");
    rim.addColorStop(0.55, "rgba(226,247,255,.45)");
    rim.addColorStop(0.84, "rgba(255,255,255,.98)");
    rim.addColorStop(0.96, "rgba(255,255,255,1)");
    rim.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rim;
    disc(); g.fill();

    // 5. The light source itself, small and hard.
    disc(); g.save(); g.clip();
    const spec = g.createRadialGradient(
      r * 0.60, r * 0.50, 0, r * 0.60, r * 0.50, r * 0.26);
    spec.addColorStop(0, "rgba(255,255,255,1)");
    spec.addColorStop(0.30, "rgba(255,255,255,.92)");
    spec.addColorStop(0.7, "rgba(255,255,255,.22)");
    spec.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = spec;
    g.fillRect(0, 0, s, s);
    g.restore();
  };

  bubbleSprite = sprite(192, paintBubble);
  // Small copy for the fine fizz, for the same mipmap reason as the flakes.
  bubbleSmall = sprite(28, paintBubble);

  /* One soft light shaft, blitted per caustic.
   *
   * Filling rects instead gave every shaft two hard vertical edges at a
   * fixed pitch, and the result read as corduroy rather than light. A baked
   * streak is soft on all four sides and costs one blit. */
  shaftSprite = spriteWH(64, 256, (g, w, h) => {
    const v = g.createLinearGradient(0, 0, 0, h);
    v.addColorStop(0, "rgba(216,246,255,1)");
    v.addColorStop(0.16, "rgba(200,240,255,.6)");
    v.addColorStop(0.45, "rgba(186,234,255,.22)");
    v.addColorStop(1, "rgba(178,230,255,0)");
    g.fillStyle = v;
    g.fillRect(0, 0, w, h);
    // Feather the sides so the shaft has no vertical edge at all.
    const side = g.createLinearGradient(0, 0, w, 0);
    side.addColorStop(0, "rgba(0,0,0,0)");
    side.addColorStop(0.5, "rgba(0,0,0,1)");
    side.addColorStop(1, "rgba(0,0,0,0)");
    g.globalCompositeOperation = "destination-in";
    g.fillStyle = side;
    g.fillRect(0, 0, w, h);
  });

  /* Four-ray glint for the flakes that catch the light. The reference is
   * full of these star flares, and they are a different thing from the
   * confetti — a specular event, not an object. */
  flareSprite = sprite(128, (g, s) => {
    const r = s / 2;
    g.translate(r, r);
    const ray = (len, wide, alpha) => {
      const grad = g.createLinearGradient(0, 0, len, 0);
      grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(0, -wide); g.lineTo(len, 0); g.lineTo(0, wide);
      g.closePath(); g.fill();
    };
    for (let i = 0; i < 4; i++) {
      g.save(); g.rotate(i * Math.PI / 2);
      ray(r * 0.96, r * 0.055, 0.95);
      g.restore();
    }
    for (let i = 0; i < 4; i++) {
      g.save(); g.rotate(Math.PI / 4 + i * Math.PI / 2);
      ray(r * 0.4, r * 0.03, 0.5);
      g.restore();
    }
    const core = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.2);
    core.addColorStop(0, "rgba(255,255,255,1)");
    core.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = core;
    g.fillRect(-r, -r, s, s);
  });
}

/* ------------------------------------------------------------------ render */

/* Basis: `up` opposes gravity, `tan` runs along the surface. Everything to do
 * with the liquid is computed in this frame, then drawn in screen space. */
let up = { x: 0, y: -1 }, tan = { x: 1, y: 0 };

/* Half-extents of the container along the two basis directions. These are
 * support-function values, not max(RX, RY): on a full-screen portrait
 * container the tangent extent is the *width*, and sizing the height field
 * to the height instead would leave most of its columns off-screen — the
 * wave would run at a fraction of its intended resolution. */
let span = 1;        // along `tan`
let upExtent = 1;    // along `up`

function updateBasis() {
  up = { x: -gDir.x, y: -gDir.y };
  tan = { x: -up.y, y: up.x };
  span = Math.abs(tan.x) * RX + Math.abs(tan.y) * RY;
  upExtent = Math.abs(up.x) * RX + Math.abs(up.y) * RY;
}

function surfaceAt(s) {
  // s is the coordinate along `tan`, in pixels from the container centre.
  const f = (s + span) / (2 * span) * (N - 1);
  const i = Math.max(0, Math.min(N - 2, Math.floor(f)));
  const frac = f - i;
  return h[i] * (1 - frac) + h[i + 1] * frac;
}

/** Perpendicular distance above the wavy surface; negative = submerged. */
function depthOf(x, y) {
  const dx = x - CX, dy = y - CY;
  const along = dx * tan.x + dy * tan.y;
  const height = dx * up.x + dy * up.y;
  return height - (level + surfaceAt(along));
}

function liquidPolygon() {
  // Walk the surface line across the container, then close the polygon along
  // the squircle boundary on the downhill side.
  const pts = [];
  const steps = 64;
  for (let i = 0; i <= steps; i++) {
    const s = -span + (2 * span) * (i / steps);
    const lift = level + surfaceAt(s);
    pts.push({
      x: CX + tan.x * s + up.x * lift,
      y: CY + tan.y * s + up.y * lift,
    });
  }
  // Close well outside the container; the squircle clip trims it back.
  const far = (span + upExtent) * 2;
  pts.push({ x: CX + tan.x * span - up.x * far, y: CY + tan.y * span - up.y * far });
  pts.push({ x: CX - tan.x * span - up.x * far, y: CY - tan.y * span - up.y * far });
  return pts;
}

/* The stretch of surface that genuinely touches air, ending exactly where
 * the liquid meets the glass, with a capillary climb at each contact.
 *
 * A free surface is bounded by its vessel: where the container has curved
 * away, there is no air-liquid interface to draw. Bisecting to the wall
 * gives the true contact point, and real liquid wets the glass and climbs
 * it, so the ends curl up instead of stopping dead.
 */
function meniscus(poly, steps) {
  const wall = (from, to) => {
    // `from` is inside, `to` is out; bisect for the contact point.
    let lo = from, hi = to;
    for (let i = 0; i < 12; i++) {
      const m = { x: (lo.x + hi.x) / 2, y: (lo.y + hi.y) / 2 };
      if (isInside(m.x, m.y)) lo = m; else hi = m;
    }
    return lo;
  };

  const climb = Math.min(RX, RY) * 0.03;
  const reach = Math.min(RX, RY) * 0.13;
  const segs = [];
  let i = 0;

  /* Every contiguous run of surface that is actually inside the vessel is a
   * separate stretch of air-liquid interface. In a nearly full container the
   * crest presses against the ceiling and the waterline genuinely breaks
   * into pieces around the trapped air; taking only the first run would drop
   * the rest of it. */
  while (i <= steps) {
    while (i <= steps && !isInside(poly[i].x, poly[i].y)) i++;
    if (i > steps) break;
    const a = i;
    while (i <= steps && isInside(poly[i].x, poly[i].y)) i++;
    const b = i - 1;

    const pts = [];
    if (a > 0) pts.push(wall(poly[a], poly[a - 1]));
    for (let k = a; k <= b; k++) pts.push({ x: poly[k].x, y: poly[k].y });
    if (b < steps) pts.push(wall(poly[b], poly[b + 1]));
    if (pts.length < 2) continue;

    // Capillary climb: the liquid wets the glass, so each end curls upward
    // over a short stretch of wall rather than meeting it flat.
    const first = pts[0], last = pts[pts.length - 1];
    for (const p of pts) {
      const d = Math.min(Math.hypot(p.x - first.x, p.y - first.y),
                         Math.hypot(p.x - last.x, p.y - last.y));
      if (d >= reach) continue;
      const t = 1 - d / reach;
      const lift = climb * t * t;
      p.x += up.x * lift; p.y += up.y * lift;
    }
    segs.push(pts);
  }
  return segs;
}

function polygonArea(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    a += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
  }
  return Math.abs(a) * 0.5;
}

/* A bubble is a deformable object, not a stamp.
 *
 * A gas bubble rising through liquid is flattened perpendicular to its
 * motion — pressure is highest on the face meeting the fluid — and the
 * faster it climbs the more oblate it gets. Drawing every bubble as the same
 * rigid circle was the single thing that made them read as decals. It is
 * also drawn at its depth, so bubbles at the back sit under the liquid tint
 * and only the ones near the glass keep a hard bright rim.
 */
function drawBubble(b) {
  const sc = 1 + b.z * 0.3;
  const r = b.r * sc;
  const x = b.x + parallaxX(b.z), y = b.y + parallaxY(b.z);
  const speed = Math.hypot(b.vx, b.vy);
  const ang = speed > 1 ? Math.atan2(b.vy, b.vx) : 0;

  ctx.save();
  ctx.globalAlpha = b.alpha * (0.74 + 0.26 * (b.z + 1) * 0.5);
  ctx.translate(x, y);
  if (b.squash > 0.01) {
    // Flatten along the direction of travel.
    ctx.rotate(ang);
    ctx.scale(1 / (1 + b.squash), 1 + b.squash * 0.72);
  }
  ctx.drawImage(r < 9 ? bubbleSmall : bubbleSprite, -r, -r, r * 2, r * 2);
  ctx.restore();
}

function drawStar(p, time) {
  // Fine glitter: at two or three pixels the rotation is invisible, so skip
  // the transform — but still blit the sprite. Substituting a fillRect here
  // is faster again and looks it: hard little squares read as cheap dither,
  // where the downscaled sprite reads as soft glitter.
  const sc = 1 + p.z * 0.3;
  const rr = p.r * sc;
  const px = p.x + parallaxX(p.z), py = p.y + parallaxY(p.z);

  /* Threshold raised from 2.2px: enlarging the flakes to match the
   * reference pushed most of the population off this fast path and onto the
   * save/rotate/restore one, costing 23fps. At three pixels across the
   * rotation is not visible anyway. */
  if (rr < 3.0) {
    ctx.drawImage(flakeSmall[p.hueIdx * SHAPES + p.shape],
                  px - rr, py - rr, rr * 2, rr * 2);
    return;
  }

  // Big flakes carry a glow; the fine glitter does not, which keeps the
  // blit count down and reads as depth of field.
  if (rr > 6) {
    const g = rr * 4.2;
    ctx.globalAlpha = 0.30;
    ctx.drawImage(glowSprite, px - g, py - g, g * 2, g * 2);
    ctx.globalAlpha = 1;
  }

  const s = rr * 2;
  ctx.save();
  // Flakes at the back are seen through the full thickness of the liquid.
  ctx.globalAlpha = 0.68 + 0.32 * (p.z + 1) * 0.5;
  ctx.translate(px, py);
  ctx.rotate(p.spin);
  ctx.drawImage(flakeSprites[p.hueIdx * SHAPES + p.shape], -rr, -rr, s, s);

  /* Highlight, placed so it stays with the light while the flake turns
   * under it. The sprite is drawn in the flake's rotated frame, so the
   * atlas entry is chosen to cancel that rotation out. */
  let rel = (LIGHT_ANGLE - p.spin) % (Math.PI * 2);
  if (rel < 0) rel += Math.PI * 2;
  const k = Math.round(rel / (Math.PI * 2) * SPEC_K) % SPEC_K;
  /* Brightness follows how squarely the facet faces the light: a mirror
   * returns the source only near the reflection angle, and away from it
   * returns almost nothing. `flashPhase` gives each flake its own tilt out
   * of the plane, which is the part a 2-D spin cannot represent. */
  const face = Math.cos(p.spin * 2 - LIGHT_ANGLE * 2 + p.flashPhase);
  const glint = Math.pow(Math.max(0, face), 3);
  if (glint > 0.02) {
    ctx.globalAlpha = 0.12 + 0.88 * glint;
    ctx.drawImage(specSprites[p.shape * SPEC_K + k], -rr, -rr, s, s);
  }

  // Full-face flash when it turns square to the source.
  const flash = Math.sin(time * p.flashRate + p.flashPhase);
  if (flash > 0.86) {
    ctx.globalAlpha = (flash - 0.86) / 0.14;
    ctx.drawImage(flashSprites[p.shape], -rr, -rr, s, s);
  }
  ctx.restore();

  /* At the peak of the flash the flake throws a glint. The reference is full
   * of these; they are a different thing from the confetti — a specular
   * event, not an object — so they are added rather than blended. Light
   * arrives on top of what is already there; it does not cover it. */
  if (flash > 0.975 && rr > 5.5) {
    const k = (flash - 0.975) / 0.025;
    const f = rr * (1.8 + k * 2.2);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = k * 0.6;
    ctx.drawImage(flareSprite, px - f, py - f, f * 2, f * 2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
}

/* Parallax offset for a particle at depth z.
 *
 * Tilting the phone changes the angle you view the pouch from, and the back
 * wall shifts against the front by an amount proportional to the thickness
 * between them. Using the gravity direction as the proxy for that angle
 * costs nothing and is right to first order: upright it is zero, and the
 * further the phone leans the more the layers separate. */
function parallaxX(z) { return z * PARALLAX * gDir.x; }
function parallaxY(z) { return z * PARALLAX * (gDir.y - 1); }
const PARALLAX = 9;

let starSplit = 0, bubbleSplit = 0;

/** Index of the first particle at or in front of the mid-plane. */
function depthSplit(list) {
  let i = 0;
  while (i < list.length && list[i].z < 0) i++;
  return i;
}

function drawParticles(s0, s1, b0, b1, time) {
  for (let i = b0; i < b1; i++) {
    const b = bubbles[i];
    if (b.alpha <= 0 || depthOf(b.x, b.y) > 0) continue;
    drawBubble(b);
  }
  ctx.globalAlpha = 1;
  for (let i = s0; i < s1; i++) {
    const p = stars[i];
    if (depthOf(p.x, p.y) > 0) continue;
    drawStar(p, time);
  }
}

/* The render loop deliberately uses no clip() at all.
 *
 * Canvas rasterises a clip against a 100-plus-point path on every use, and
 * the three per-frame clips here (container, liquid body, meniscus glow)
 * cost more than everything else combined — the scene ran at 47fps with
 * zero particles on screen. The container clip is baked into glassLayer's
 * corner knockout, the liquid clip is replaced by culling particles above
 * the waterline, and the meniscus glow simply bleeds a little into the air,
 * which is what a real meniscus does anyway. */
function render(time) {
  const poly = liquidPolygon();

  /* Liquid body, graded along the gravity axis so the deep blue always sits
   * at the top of the pour no matter how the phone is held. Filled across
   * the whole screen rather than into the liquid polygon: the shaker is
   * ~95% full, so painting the small headspace afterwards is far less
   * overdraw than covering the screen twice. */
  const grad = ctx.createLinearGradient(
    CX + up.x * level, CY + up.y * level,
    CX - up.x * upExtent, CY - up.y * upExtent);
  const ramp = CONFIG.ramp;
  for (let i = 0; i < ramp.length; i++) {
    grad.addColorStop(i / (ramp.length - 1), ramp[i]);
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  /* Headspace. Painted as pale tinted air rather than left as page
   * background: white reads as a hole in the wallpaper, which is exactly
   * what made the liquid look like it had drained away.
   *
   * Graded across the air itself, from the inside of the top wall down to
   * the waterline. Spanning the whole container instead left the thin band
   * sampling one end of the ramp, so it rendered as a flat grey slab that
   * read like a UI bar sitting on top of the wallpaper. */
  const air = ctx.createLinearGradient(
    CX + up.x * upExtent, CY + up.y * upExtent,
    CX + up.x * level, CY + up.y * level);
  air.addColorStop(0, "#c9dfec");    // inner top wall, slightly shadowed
  air.addColorStop(0.45, "#eaf5fb");
  air.addColorStop(1, "#a9d4e6");    // liquid showing through the meniscus
  ctx.fillStyle = air;
  ctx.beginPath();
  const far = (span + upExtent) * 2;
  ctx.moveTo(poly[0].x + up.x * far, poly[0].y + up.y * far);
  for (let i = 0; i <= 64; i++) ctx.lineTo(poly[i].x, poly[i].y);
  ctx.lineTo(poly[64].x + up.x * far, poly[64].y + up.y * far);
  ctx.closePath();
  ctx.fill();

  const menisc = meniscus(poly, 64);   // array of interface segments

  /* Depth pass one: everything behind the mid-plane of the pouch, drawn
   * before the liquid tint so the tint falls over it. Light from a flake at
   * the back wall crosses the full thickness of liquid before it reaches
   * the eye, and gets absorbed and colour-shifted on the way; putting those
   * flakes under the tint layer is that absorption, for free. */
  drawParticles(0, starSplit, 0, bubbleSplit, time);

  /* The dense phase, blitted from the grid and left to the browser's
   * bilinear upscale to smooth. At this grid size that reads as soft
   * marbling — which is what an unmixed second liquid looks like. */
  const dd = dyeImage.data;
  for (let i = 0, n = GW * GH; i < n; i++) {
    let v = dye[i];
    if (v < 0) v = 0; else if (v > 1) v = 1;
    dd[i * 4] = 74; dd[i * 4 + 1] = 236; dd[i * 4 + 2] = 198;
    dd[i * 4 + 3] = (v * 172) | 0;
  }
  dyeCtx.putImageData(dyeImage, 0, 0);
  ctx.drawImage(dyeCanvas, 0, 0, W, H);

  ctx.drawImage(depthLayer, 0, 0, W, H);

  /* Caustics. The free surface is a lens: where it curves concave it
   * converges the light passing through into a bright shaft in the body
   * below, and where convex it spreads it thin. It is the strongest depth
   * cue a real liquid container has — light arriving through the top and
   * structuring the volume underneath — and without it the body is evenly
   * lit everywhere, which is what made it read flat.
   *
   * Drawn in the gravity frame, so the shafts hang straight down however
   * the phone is held, and added rather than blended because this is light
   * arriving, not a surface. Curvature is taken over a wide stencil: a lens
   * is metres of surface, not one sample.
   */
  /* Drawn small and blitted once.
   *
   * Nineteen full-height additive blits straight onto the canvas cost 8ms a
   * frame in paint — about a whole extra full-screen pass — for shafts that
   * are soft-edged and carry no fine detail. At a fraction of the
   * resolution the upscale supplies the softness for free.
   */
  const cg = causticCtx;
  cg.clearRect(0, 0, CAUSTIC_W, CAUSTIC_H);
  /* The band the shafts actually occupy: from a little above the crest down
   * to where the light has faded out. Blitting the full container instead
   * meant a whole-screen additive composite every frame, and in software
   * rasterisation that alone is most of the frame budget. */
  const bandTop = -(level + upExtent * 0.18);
  const bandH = upExtent * 1.33;
  const reach = upExtent * 1.15;
  const pitch = 2 * span / (N - 1);
  const toX = (v) => (v + span) / (2 * span) * CAUSTIC_W;
  const toY = (v) => (v - bandTop) / bandH * CAUSTIC_H;
  for (let i = 2; i < N - 2; i += 5) {
    const curv = h[i - 2] + h[i + 2] - 2 * h[i];
    /* Irregular by construction. Evenly spaced shafts of equal width read
     * as a machined pattern; two incommensurate frequencies plus a
     * per-shaft width give the uneven spacing real caustics have. */
    const seed = Math.sin(i * 12.9898) * 43758.5453;
    const jitter = seed - Math.floor(seed);
    const amb = 0.05 + 0.032 * Math.sin(time * 0.41 + i * 0.29)
                     + 0.022 * Math.sin(time * 0.23 - i * 0.73);
    const a = Math.max(0, Math.min(0.24, amb + curv * 0.010));
    if (a < 0.012) continue;
    const w = pitch * (5 + jitter * 7);
    const sx = -span + 2 * span * (i / (N - 1)) + (jitter - 0.5) * pitch * 4;
    const sy = -(level + h[i]);
    cg.globalAlpha = a;
    cg.drawImage(shaftSprite, toX(sx - w / 2), toY(sy),
                 w / (2 * span) * CAUSTIC_W, reach / bandH * CAUSTIC_H);
  }
  cg.globalAlpha = 1;

  ctx.save();
  ctx.transform(tan.x, tan.y, -up.x, -up.y, CX, CY);
  ctx.globalCompositeOperation = "lighter";
  ctx.drawImage(causticCanvas, -span, bandTop, 2 * span, bandH);
  ctx.restore();

  // Light pooling just under the surface, the way it does in a real pouch.
  const under = ctx.createLinearGradient(
    CX + up.x * level, CY + up.y * level,
    CX + up.x * (level - upExtent * 0.55),
    CY + up.y * (level - upExtent * 0.55));
  under.addColorStop(0, "rgba(255,255,255,.30)");
  under.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = under;
  ctx.fillRect(0, 0, W, H);

  // Depth pass two: everything in front of the mid-plane, over the tint.
  drawParticles(starSplit, stars.length, bubbleSplit, bubbles.length, time);

  /* Meniscus. Three passes: a soft glow bleeding down into the liquid, the
   * bright surface line itself, and a thin darker line above it. One flat
   * stroke reads as a drawn border; this reads as a liquid surface.
   *
   * It is stroked over `menisc`, not the raw surface, because the raw
   * surface runs the full tangent span whether or not the vessel is that
   * wide there. Near the top the container has already curved inward, so
   * the line carried on past the glass and was chopped off by the corner
   * knockout — reading as a hard clip straight across the top of the frame.
   */
  /* The interface is a band, not a line.
   *
   * The pouch has depth, so the air-liquid surface is a real surface seen
   * almost edge-on: it presents a band whose height is roughly the pouch's
   * thickness foreshortened, brightened along its lower edge by light
   * piping through the wedge of liquid under the meniscus. Drawn as a
   * hairline it read as a stroke somebody had drawn on top of the picture.
   */
  const band = Math.max(5, Math.min(RX, RY) * 0.030);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for (const seg of menisc) {
    const path = (off) => {
      ctx.beginPath();
      ctx.moveTo(seg[0].x + up.x * off, seg[0].y + up.y * off);
      for (let i = 1; i < seg.length; i++) {
        ctx.lineTo(seg[i].x + up.x * off, seg[i].y + up.y * off);
      }
    };

    // Body of the band: the lit wedge of liquid held under the surface.
    ctx.beginPath();
    ctx.moveTo(seg[0].x, seg[0].y);
    for (let i = 1; i < seg.length; i++) ctx.lineTo(seg[i].x, seg[i].y);
    for (let i = seg.length - 1; i >= 0; i--) {
      ctx.lineTo(seg[i].x - up.x * band, seg[i].y - up.y * band);
    }
    ctx.closePath();
    const mid = seg[(seg.length / 2) | 0];
    const g = ctx.createLinearGradient(
      mid.x, mid.y, mid.x - up.x * band, mid.y - up.y * band);
    g.addColorStop(0, "rgba(255,255,255,.72)");
    g.addColorStop(0.45, "rgba(214,244,255,.34)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fill();

    // Soft bloom above, into the air.
    ctx.strokeStyle = "rgba(255,255,255,.30)";
    ctx.lineWidth = band * 0.9;
    path(band * 0.45); ctx.stroke();

    // The bright rim itself, and a thin shaded edge just above it.
    ctx.strokeStyle = "rgba(255,255,255,.95)";
    ctx.lineWidth = Math.max(1.4, RX * 0.006);
    path(0); ctx.stroke();

    ctx.strokeStyle = "rgba(126,180,208,.5)";
    ctx.lineWidth = Math.max(1, RX * 0.0035);
    path(band * 0.42); ctx.stroke();
  }
  ctx.lineCap = "butt";
  ctx.lineJoin = "miter";

  // Glass shell, casing edge and corner knockout, all baked at resize.
  ctx.drawImage(glassLayer, 0, 0, W, H);
}

/* -------------------------------------------------------------------- step */

/* Fixed timestep.
 *
 * Scaling every force by dt is not enough to make this frame-rate
 * independent, and measurement said so: driving the same 2s of shaking at
 * 30fps and at 60fps left the flow energy 21.6% apart. Semi-Lagrangian
 * advection smears a fixed amount per *step*, and the pressure solve does a
 * fixed number of iterations per *step*, so both get twice the treatment at
 * twice the frame rate no matter how carefully dt is applied.
 *
 * Running the simulation on a fixed tick and accumulating real elapsed time
 * is the only thing that actually fixes it. The cap keeps a stalled tab from
 * trying to catch up across a huge gap.
 */
const FIXED_DT = 1 / 60;
let accumulator = 0;
let simTime = 0;

function step(dt) {
  accumulator += dt;
  let ticks = 0;
  while (accumulator >= FIXED_DT && ticks < 4) {
    simTime += FIXED_DT;
    fixedStep(FIXED_DT, simTime);
    accumulator -= FIXED_DT;
    ticks++;
  }
  if (ticks === 4) accumulator = 0;   // fell too far behind; drop the debt
  return simTime;
}

function fixedStep(dt, time) {
  updateBasis();
  fluidStep(dt);
  stepWaves(dt);

  // Volume conservation: nudge the level until the drawn liquid area matches
  // the target. A feedback loop is far cheaper than solving the tilted
