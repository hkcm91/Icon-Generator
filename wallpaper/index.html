  maxBubble = Math.min(RX, RY) * 0.065;
  let seededLargeBubbles = 0;
  for (let i = 0; i < CONFIG.bubbles; i++) {
    /* Skewed: mostly fine fizz, plus the large trapped-air bubbles a sealed
     * shaker genuinely starts with. Leaving coalescence as their only source
     * was a mistake — it made every bubble tiny and they all but vanished,
     * because merging only just keeps pace with popping. Coalescence now
     * adds to this population rather than being the whole of it. */
    const r = bubbleSeedRadius(seededLargeBubbles < 5);
    if (r >= 10 * unit) seededLargeBubbles++;
    const z = Math.random() * 2 - 1;
    const b = {
      x: 0, y: 0,
      vx: 0, vy: 0,
      phase: Math.random() * Math.PI * 2,
      // Bubbles used to teleport from the surface back to the bottom in one
      // frame, which was plainly visible. They now fade out and back in.
      alpha: Math.random(),
      fading: false,
      rest: 0,           // seconds spent sitting under the surface
      drain: 0.78 + Math.random() * 0.44,
      pop: 1,            // burst expansion, 1 until the film lets go
      pfx: 0, pfy: 0,    // last smoothed flow, for fluid acceleration
      sfx: 0, sfy: 0,    // low-passed local flow, suppresses pixel jitter
      leadAx: 0, leadAy: 0,
      // Film thickness varies bubble to bubble, and with it how much of the
      // refracted band interferes away. Three sprites is enough to stop a
      // field of them reading as one stamp repeated.
      variant: (Math.random() * BUB_VARIANTS) | 0,
      squash: 0,         // deformation, driven by how fast it is climbing
      z, zHome: z, zv: 0,
    };
    setBubbleSize(b, r);
    // Bubbles climb faster than the glitter and so sit closer to the line,
    // but they are also being made all through the body, hence the tail.
    floatSpawn(b, r, 2.8);
    sampleFlow(b.x, b.y, flow);
    b.sfx = b.pfx = flow.x; b.sfy = b.pfy = flow.y;
    bubbles.push(b);
  }
  /* Draw order is depth order, and depth is now a real coordinate rather
   * than size standing in for it. */
  stars.sort((a, b) => a.z - b.z);
  bubbles.sort((a, b) => a.z - b.z);
  starSplit = depthSplit(stars);
  bubbleSplit = depthSplit(bubbles);
  buildSprites();
}

/* Offscreen sprites for the soft glows.
 *
 * A per-particle radial gradient is the obvious way to do this and it tanks
 * the frame rate at 600 flakes — the gradient has to be rebuilt every frame
 * because it is positioned in user space. Bake each once and blit it scaled
 * instead. */
let glowSprite = null, bubbleSmall = null, shadeSprite = null;
/* Two layers per bubble, because two different things set their orientation.
 * What the bubble refracts is fixed to gravity — the liquid it is looking
 * through is graded along that axis. What it reflects is fixed to the light,
 * which does not move when the phone turns. Baking both into one sprite is
 * what made every bubble a stamp. */
const bubbleBody = [];       // BUB_VARIANTS of them, rotated to gravity
let bubbleGlint = null;      // world-fixed, never rotated
const BUB_VARIANTS = 3;
let shaftSprite = null;
let causticCanvas = null, causticCtx = null;
const CAUSTIC_W = 96, CAUSTIC_H = 220;
let flareSprite = null;

/* Full-screen layers that depend only on the container, not on gravity:
 * the glass shell and the depth vignette. Rebuilding their gradients every
 * frame cost five full-screen fills and dropped the wallpaper to 18fps.
 * Baked once per resize, they are one blit each. */
let glassLayer = null, depthLayer = null;

/* Depth of field.
 *
 * A camera focused on the front glass cannot also hold the back wall sharp
 * through this much liquid, and until now every flake and bubble was
 * rendered at identical sharpness whatever depth it sat at — which is most
 * of why the scene read as a picture of a shaker rather than a volume with
 * things suspended at different distances in it. The near ones are still
 * crisp; the far ones are not.
 *
 * Baked rather than filtered per frame: a blur filter over the whole back
 * pass is one of the most expensive things canvas can be asked to do, and
 * costs nothing at build time. Drawn inset so the blur has somewhere to
 * bleed, because defocus spreads a highlight outward rather than growing
 * the object.
 */
function defocus(src, blurPx) {
  const s = src.width;
  const c = document.createElement("canvas");
  c.width = c.height = s;
  const g = c.getContext("2d");
  g.filter = `blur(${blurPx}px)`;
  const inset = blurPx * 1.5;
  g.drawImage(src, inset, inset, s - inset * 2, s - inset * 2);
  return c;
}

function sprite(size, paint) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  paint(c.getContext("2d"), size);
  return c;
}

function spriteWH(w, h, paint) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  paint(c.getContext("2d"), w, h);
  return c;
}

function layer(paint) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.floor(W * DPR));
  c.height = Math.max(1, Math.floor(H * DPR));
  const g = c.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  paint(g);
  return c;
}

/* Soft band hugging the inside of the container edge.
 *
 * The obvious implementation is a radial gradient in normalised container
 * space, and it is wrong: normalising by RX and RY turns the falloff into a
 * huge oval on a portrait screen instead of something that follows the
 * rounded rectangle. Stroking the outline itself and blurring it tracks the
 * real silhouette at any aspect. Blur is only paid at resize, never in the
 * render loop; where ctx.filter is missing, stacked strokes approximate it.
 */
function softEdge(g, colour, width, blur, alpha) {
  const supportsFilter = typeof g.filter === "string";
  g.save();
  g.globalAlpha = alpha;
  g.strokeStyle = colour;
  g.lineJoin = "round";
  if (supportsFilter) {
    g.filter = `blur(${Math.max(1, blur)}px)`;
    // Double width: half the stroke lands outside the shape and is trimmed
    // by the corner knockout, leaving a band on the inside.
    g.lineWidth = width * 2;
    tracePath(g);
    g.stroke();
    g.filter = "none";
  } else {
    const steps = 14;
    g.globalAlpha = alpha / steps * 1.9;
    for (let i = 0; i < steps; i++) {
      g.lineWidth = width * 2 * (1 - i / steps);
      tracePath(g);
      g.stroke();
    }
  }
  g.restore();
}

function buildLayers() {
  const short = Math.min(RX, RY);

  depthLayer = layer((g) => {
    /* Where the liquid thins out against the wall.
     *
     * This had it backwards, and expensively: a 58px dark band blurred over
     * 43px, hugging the rim. A pouch is a pillow — the liquid is deepest
     * through the middle and tapers to nothing where the walls close, so
     * absorption is strongest in the centre and the rim is the *clearest*
     * part, not the darkest. And blurring it over a quarter of the short
     * side turned the whole border into a haze the liquid faded away into
     * rather than filling up to.
     *
     * Narrow, bright, and barely blurred: liquid that thins and a glass
     * wall that refracts, meeting the edge crisply.
     */
    softEdge(g, "#dcf2ff", short * 0.030, short * 0.006, 0.42);
  });

  glassLayer = layer((g) => {
    g.save();
    tracePath(g);
    g.clip();
    // (clip here is free — this layer is built once, not per frame)

    // Broad sweep from the top-left.
    const spec = g.createLinearGradient(
      CX - RX, CY - RY, CX + RX * 0.5, CY + RY * 0.35);
    spec.addColorStop(0, "rgba(255,255,255,.42)");
    spec.addColorStop(0.22, "rgba(255,255,255,.10)");
    spec.addColorStop(0.5, "rgba(255,255,255,0)");
    g.fillStyle = spec;
    g.fillRect(CX - RX, CY - RY, RX * 2, RY * 2);

    // Tighter secondary catch bottom-right.
    const spec2 = g.createLinearGradient(
      CX + RX, CY + RY, CX + RX * 0.1, CY + RY * 0.45);
    spec2.addColorStop(0, "rgba(255,255,255,.26)");
    spec2.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = spec2;
    g.fillRect(CX - RX, CY - RY, RX * 2, RY * 2);

    g.restore();

    /* Dispersion. Glass bends the short wavelengths harder than the long
     * ones, so at the steep angles the wall presents near its silhouette the
     * colours separate — the pair of faint warm and cool hairlines you get
     * along the edge of anything thick and transparent. Approximated as two
     * offset strokes rather than by splitting channels, which canvas has no
     * cheap way to do; and baked into this layer rather than drawn per frame,
     * because it belongs to the glass and the glass does not move. */
    softEdge(g, "#ffd9a8", short * 0.030, short * 0.008, 0.20);
    softEdge(g, "#a8c4ff", short * 0.019, short * 0.006, 0.22);

    // Specular line along the glass itself. Thin and near-sharp: a wide
    // blurred rim reads as fog around the edge, not as a wall.
    softEdge(g, "#ffffff", short * 0.016, short * 0.004, 0.7);

    /* Knock out everything beyond the squircle with the page background.
     * This is what lets the render loop drop its per-frame clip(): the
     * liquid can be drawn as a plain full-screen fill and this layer trims
     * the corners on the way past. */
    g.fillStyle = "#eef1f4";
    g.beginPath();
    g.rect(0, 0, W, H);
    traceOutline(g);
    g.fill("evenodd");

    tracePath(g);
    g.lineWidth = Math.max(2, RX * 0.02);
    g.strokeStyle = "rgba(255,255,255,.95)";
    g.stroke();
    g.lineWidth = Math.max(1, RX * 0.005);
    g.strokeStyle = "rgba(150,200,225,.5)";
    g.stroke();
  });
}

/* One baked sprite per hue and shape, plus white copies for the specular
 * flash. Tessellating a ten-point star path 620 times a frame — twice, with
 * the flash — is what held this at 32fps; blitting a sprite does not touch
 * the path rasteriser at all. */
const flakeSprites = [];
const flakeSmall = [];
// The same sets again, defocused, for everything behind the mid-plane.
const flakeFar = [];
const flakeSmallFar = [];
let bubbleBodyFar = [], bubbleGlintFar = null, bubbleSmallFar = null;
// Set for the duration of the back pass, so the draw picks the far sprites.
let farField = false;
const flashSprites = [];
const specSprites = [];
// Angular resolution of the specular atlas, and where the light sits.
const SPEC_K = 16;
const LIGHT_ANGLE = -Math.PI * 0.72;
const FLAKE_PX = 64;
const SHAPES = 4;   // 0 = star, 1..3 = crushed-foil shards
const SMALL_PX = 12;
/* The bubble glint sprite is baked with the source at the top of it, so this
 * is the turn that puts it where the light actually is. Constant, because
 * the light does not move when the phone does. */
const BUBBLE_LIGHT_ROT = LIGHT_ANGLE + Math.PI / 2;
// Which way a shadow falls: directly away from the source.
const SHADOW_X = Math.cos(LIGHT_ANGLE), SHADOW_Y = Math.sin(LIGHT_ANGLE);
/* ...and this is the turn that points a bubble's refracted interior along
 * whichever way is currently up. Recomputed once per step, not per bubble. */
let riseAngle = 0;

function flakePath(g, cx, cy, R, shape) {
  g.beginPath();
  if (shape === 0) {
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? R : R * 0.44;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
  } else {
    /* Authored convex foil cuts. The old pseudo-random radius formula could
     * put adjacent corners at radically different depths; enlarged hero
     * flakes then looked folded, pinched or nearly self-intersecting. These
     * silhouettes stay irregular and angular without broken geometry. */
    const cuts = [
      null,
      [[-0.72,-0.58],[0.28,-0.82],[0.82,-0.28],[0.70,0.52],[-0.18,0.86],[-0.84,0.20]],
      [[-0.34,-0.88],[0.54,-0.70],[0.86,0.02],[0.38,0.84],[-0.56,0.68],[-0.82,-0.16]],
      [[-0.70,-0.46],[-0.08,-0.88],[0.66,-0.62],[0.86,0.18],[0.34,0.86],[-0.46,0.72],[-0.88,0.04]],
    ][shape];
    for (let i = 0; i < cuts.length; i++) {
      const x = cx + cuts[i][0] * R, y = cy + cuts[i][1] * R;
      i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
  }
  g.closePath();
}

/* Paint one flake as a piece of foil rather than a silhouette.
 *
 * A flat fill was what made these read as sticker cutouts: a single pastel
 * colour edge to edge, no material, no light. A glitter flake is a tiny
 * mirror — an iridescent shift from the pale end of its hue to the
 * saturated end, and a bright edge where the cut catches light.
 *
 * The specular is deliberately NOT painted here. It belongs to the light,
 * not to the flake, so it cannot be baked into something that rotates.
 */
function paintFlake(g, size, shape, light, deep) {
  const c = size / 2, R = size / 2 - Math.max(1, size * 0.04);
  flakePath(g, c, c, R, shape);
  const grad = g.createLinearGradient(c - R, c - R, c + R, c + R);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(0.28, light);
  grad.addColorStop(0.72, deep);
  grad.addColorStop(1, light);
  g.fillStyle = grad;
  g.fill();

  if (size < 16) return;   // below this none of the rest survives the scale

  flakePath(g, c, c, R, shape);
  g.lineWidth = Math.max(1, size * 0.035);
  g.lineJoin = "round";
  g.strokeStyle = "rgba(255,255,255,.7)";
  g.stroke();
}

/* The specular, as an atlas over the angle between the flake and the light.
 *
 * Baking the streak into the flake meant it turned with the flake, so every
 * highlight orbited its own particle — light apparently attached to the
 * object rather than arriving from somewhere. A highlight is a property of
 * the light source and stays put while the thing under it rotates.
 *
 * The flake still has to be drawn in its own rotated frame, so the streak is
 * baked at each of SPEC_K angles *within* that frame, and the draw picks the
 * entry that cancels the flake's current rotation. The result is a highlight
 * fixed in world space that sweeps across the facet as it turns, which is
 * what a mirror does.
 */
function paintFlakeSpec(g, size, shape, angle) {
  const c = size / 2, R = size / 2 - Math.max(1, size * 0.04);
  g.save();
  flakePath(g, c, c, R, shape);
  g.clip();
  g.translate(c, c);
  g.rotate(angle);
  const spec = g.createLinearGradient(0, -R, 0, R);
  spec.addColorStop(0, "rgba(255,255,255,0)");
  spec.addColorStop(0.32, "rgba(255,255,255,.72)");
  spec.addColorStop(0.46, "rgba(255,255,255,.10)");
  spec.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = spec;
  g.fillRect(-R * 1.6, -R * 1.6, R * 3.2, R * 3.2);
  g.restore();
}

function buildFlakeSprites() {
  flakeSprites.length = 0; flashSprites.length = 0; flakeSmall.length = 0;
  specSprites.length = 0; flakeFar.length = 0; flakeSmallFar.length = 0;
  for (let hi = 0; hi < FLAKE_COLOURS.length; hi++) {
    const [light, deep] = FLAKE_COLOURS[hi];
    for (let shape = 0; shape < SHAPES; shape++) {
      flakeSprites.push(sprite(FLAKE_PX, (g) =>
        paintFlake(g, FLAKE_PX, shape, light, deep)));
      /* A second, small copy of every flake.
       *
       * Canvas has no mipmaps, so drawing the 64px sprite down to the three
       * or four pixels most of the glitter occupies makes the rasteriser
       * filter the whole thing every single time — measured at 23fps of the
       * frame budget for 620 flakes. Blitting a sprite that is already
       * roughly the right size costs a fraction of that. */
      flakeSmall.push(sprite(SMALL_PX, (g) =>
        paintFlake(g, SMALL_PX, shape, light, deep)));
    }
  }
  // Specular is colourless, so the atlas is over shape and angle only.
  for (let shape = 0; shape < SHAPES; shape++) {
    for (let k = 0; k < SPEC_K; k++) {
      specSprites.push(sprite(FLAKE_PX, (g) =>
        paintFlakeSpec(g, FLAKE_PX, shape, k / SPEC_K * Math.PI * 2)));
    }
  }
  for (const c of flakeSprites) flakeFar.push(defocus(c, 5.0));
  for (const c of flakeSmall) flakeSmallFar.push(defocus(c, 1.6));
  for (let shape = 0; shape < SHAPES; shape++) {
    flashSprites.push(sprite(FLAKE_PX, (g) => {
      const c = FLAKE_PX / 2, R = FLAKE_PX / 2 - 2;
      g.fillStyle = "#ffffff";
      flakePath(g, c, c, R, shape);
      g.fill();
    }));
  }
}

function buildSprites() {
  buildFlakeSprites();
  /* A bubble's shadow. It is a diverging lens, so it spreads the light
   * passing through it and the liquid directly behind it receives less —
   * which is the one thing in the scene that makes anything look like it is
   * *in* the medium rather than painted on top of it. Nothing occluded
   * anything before. */
  shadeSprite = sprite(64, (g, s) => {
    const r = s / 2;
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, "rgba(6,42,96,.50)");
    grad.addColorStop(0.45, "rgba(6,42,96,.22)");
    grad.addColorStop(1, "rgba(6,42,96,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
  });

  glowSprite = sprite(64, (g, s) => {
    const r = s / 2;
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, "rgba(255,255,255,.85)");
    grad.addColorStop(0.35, "rgba(255,255,255,.22)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
  });

  /* A bubble in water is a *diverging* lens, and that one fact sets its
   * whole appearance.
   *
   * Light crossing from water into air bends away from the normal, so past
   * an incidence of about 49 degrees none of it gets through at all — it is
   * totally internally reflected. On a sphere that angle falls at an impact
   * parameter of n_air/n_water = 0.75 of the radius, which splits the disc
   * into two quite different objects:
   *
   *   inside 0.75R   you see the liquid behind, minified and turned upside
   *                  down by the lens. The bubble therefore shows the far
   *                  reaches of the pour, not its own surroundings, and its
   *                  interior gradient runs *opposite* to the liquid around
   *                  it. That inversion is the single strongest cue that
   *                  there is a hole in the water rather than a decal on it.
   *   outside 0.75R  nothing is transmitted; the annulus is a mirror,
   *                  showing whatever is on the viewer's side. Bright where
   *                  it faces the light, dark where it faces the depths.
   *
   * How much ink each part gets is set by reflectance, and reflectance on a
   * sphere only climbs steeply in the last few percent of the radius. Over
   * most of the annulus a bubble is reflecting liquid, back at liquid of
   * nearly the same brightness, so it is barely visible there. Painting that
   * whole quarter-radius band as opaque pale ring turned every bubble into a
   * rubber grommet — a fat raised collar around a flat dark disc. Almost all
   * of the contrast belongs in two thin rings and a hard specular; the rest
   * of a bubble is a hole you can see through.
   *
   * Before that the sprite had a uniform white ring all the way around,
   * which is a soap bubble floating in air, and a milky interior, which is
   * opaque exactly where a bubble is clearest.
   */
  const NREL = 0.752;        // n_air / n_water, so also the critical radius

  /* Baked with "up" against gravity, because that is what the interior
   * inversion is fixed to. Three variants: film thickness varies bubble to
   * bubble and so does how much of the band it interferes away. */
  const paintBubbleBody = (v) => (g, s) => {
    const R = s / 2, c = s / 2;
    const disc = (k) => { g.beginPath(); g.arc(c, c, R * (k || 1), 0, Math.PI * 2); };
    const band = 0.13 + v * 0.035;     // how dark the refracted band goes
    const warm = [236, 246, 240][v];   // faint film colour, per variant

    disc(); g.save(); g.clip();

    /* 1. The inverted image. What sits below the bubble appears at the top
     *    of it and what sits above appears at the bottom, so against a pour
     *    that is deep blue at the top and pale teal at the bottom this runs
     *    pale-over-dark — the reverse of its surroundings. Faint: it is a
     *    displacement of the background, not a coat of paint over it. */
    const inv = g.createLinearGradient(0, c - R * NREL, 0, c + R * NREL);
    inv.addColorStop(0, `rgba(216,${warm + 8},255,.13)`);
    inv.addColorStop(0.5, "rgba(255,255,255,.015)");
    inv.addColorStop(1, "rgba(14,60,124,.12)");
    g.fillStyle = inv;
    g.fillRect(0, 0, s, s);

    /* 2. The refracted band. Rays arriving near the critical angle are bent
     *    hardest, so they reach the eye from far off-axis — from the deep
     *    liquid and the dark of the container edge rather than from behind
     *    the bubble. That is why an air bubble in water carries a dark ring
     *    and a droplet of water in air does not. Thin, and sitting just
     *    inside the critical radius. */
    const dark = g.createRadialGradient(c, c, 0, c, c, R);
    dark.addColorStop(0.00, "rgba(4,34,86,0)");
    dark.addColorStop(0.40, "rgba(4,34,86,.015)");
    dark.addColorStop(0.60, `rgba(4,34,86,${band * 0.42})`);
    dark.addColorStop(0.735, `rgba(3,26,70,${band})`);
    dark.addColorStop(0.82, `rgba(3,26,70,${band * 0.5})`);
    dark.addColorStop(0.93, "rgba(3,26,70,0)");
    g.fillStyle = dark;
    g.fillRect(0, 0, s, s);

    /* 3. The critical-angle caustic. The last rays that make it through all
     *    emerge at the same grazing angle, so they pile up in a thin bright
     *    ring right at the boundary between the two regimes. A line, not a
     *    fade — and thin enough to read as light rather than as a bezel. */
    const crit = g.createRadialGradient(c, c, 0, c, c, R);
    crit.addColorStop(0.775, "rgba(232,251,255,0)");
    crit.addColorStop(0.818, `rgba(246,254,255,${0.15 + v * 0.045})`);
    crit.addColorStop(0.862, "rgba(232,251,255,0)");
    g.fillStyle = crit;
    g.fillRect(0, 0, s, s);

    /* 4. The mirror annulus, its ambient half — nearly nothing, because it
     *    is reflecting the same liquid it sits in. Only right at the edge,
     *    where reflectance runs to one, does it brighten at all. The bright
     *    part of the reflection belongs to the light and is baked separately
     *    so that it can stay put while the bubble turns. */
    const mir = g.createRadialGradient(c, c, 0, c, c, R);
    mir.addColorStop(0.86, "rgba(206,238,252,0)");
    mir.addColorStop(0.955, "rgba(224,246,255,.10)");
    mir.addColorStop(0.99, "rgba(238,252,255,.24)");
    mir.addColorStop(1, "rgba(238,252,255,0)");
    g.fillStyle = mir;
    g.fillRect(0, 0, s, s);
    g.restore();

    /* 5. The silhouette. A hairline where the film turns exactly edge-on:
     *    without it a bubble has no outline at all against pale liquid. */
    g.lineWidth = Math.max(1, R * 0.016);
    g.strokeStyle = "rgba(12,52,110,.22)";
    disc(0.985); g.stroke();
  };

  /* Baked with the light at the top of the sprite, and never rotated with
   * the bubble — a reflection stays with its source. */
  const paintBubbleGlint = (g, s) => {
    const R = s / 2, c = s / 2;

    /* The lit part of the mirror. Confined to the outer tenth, where the
     * reflectance actually runs to one, and filled with a gradient running
     * away from the source so the arc is brilliant facing the light and
     * fades to nothing on the far side. A ring that is uniformly bright all
     * the way round is a drawn circle; this falloff is what makes it a
     * reflection. */
    g.save();
    g.beginPath();
    g.arc(c, c, R, 0, Math.PI * 2);
    g.arc(c, c, R * 0.90, 0, Math.PI * 2, true);
    g.clip("evenodd");
    const lit = g.createLinearGradient(0, c - R, 0, c + R * 0.5);
    lit.addColorStop(0, "rgba(255,255,255,.62)");
    lit.addColorStop(0.28, "rgba(243,253,255,.34)");
    lit.addColorStop(0.62, "rgba(226,246,255,.10)");
    lit.addColorStop(1, "rgba(226,246,255,0)");
    g.fillStyle = lit;
    g.fillRect(0, 0, s, s);
    g.restore();

    g.save();
    g.beginPath(); g.arc(c, c, R, 0, Math.PI * 2); g.clip();

    // The image of the source itself: small, hard, and smeared along the
    // rim because the annulus is curving away underneath it.
    g.save();
    g.translate(c, c - R * 0.87);
    g.scale(2.2, 1);
    const spec = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.105);
    spec.addColorStop(0, "rgba(255,255,255,1)");
    spec.addColorStop(0.5, "rgba(255,255,255,.95)");
    spec.addColorStop(0.78, "rgba(255,255,255,.34)");
    spec.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = spec;
    g.fillRect(-R, -R, R * 2, R * 2);
    g.restore();

    /* The second image, from the far wall of the bubble. Every curved
     * transparent surface gives two, and drawing only the near one is why
     * the old bubble looked lit from one side like a solid ball. */
    g.save();
    g.translate(c, c + R * 0.86);
    g.scale(1.5, 1);
    const back = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.13);
    back.addColorStop(0, "rgba(255,255,255,.44)");
    back.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = back;
    g.fillRect(-R, -R, R * 2, R * 2);
    g.restore();

    // Light that came through the lens, landing on the side away from the
    // source and spread wide because the lens diverges it.
    const thru = g.createRadialGradient(
      c, c + R * 0.30, 0, c, c + R * 0.30, R * 0.46);
    thru.addColorStop(0, "rgba(230,251,255,.20)");
    thru.addColorStop(1, "rgba(230,251,255,0)");
    g.fillStyle = thru;
    g.fillRect(0, 0, s, s);
    g.restore();
  };

  for (let v = 0; v < BUB_VARIANTS; v++) {
    bubbleBody[v] = sprite(192, paintBubbleBody(v));
  }
  bubbleGlint = sprite(192, paintBubbleGlint);
  bubbleBodyFar = bubbleBody.map((c) => defocus(c, 12));
  bubbleGlintFar = defocus(bubbleGlint, 12);
  /* Fine bubbles: at four or five pixels across none of the structure survives,
   * so bake one flattened copy at the size it is actually drawn. The reason
   * is the same as for the flakes — canvas does not mipmap, and downscaling
   * a 192px sprite to five costs far more than the sprite is worth. */
  bubbleSmall = sprite(28, (g, s) => {
    paintBubbleBody(1)(g, s);
    paintBubbleGlint(g, s);
  });
  bubbleSmallFar = defocus(bubbleSmall, 1.8);

  /* One soft light shaft, blitted per caustic.
   *
   * Filling rects instead gave every shaft two hard vertical edges at a
   * fixed pitch, and the result read as corduroy rather than light. A baked
   * streak is soft on all four sides and costs one blit. */
  shaftSprite = spriteWH(64, 256, (g, w, h) => {
    const v = g.createLinearGradient(0, 0, 0, h);
    v.addColorStop(0, "rgba(216,246,255,1)");
    v.addColorStop(0.16, "rgba(200,240,255,.6)");
    v.addColorStop(0.45, "rgba(186,234,255,.22)");
    v.addColorStop(1, "rgba(178,230,255,0)");
    g.fillStyle = v;
    g.fillRect(0, 0, w, h);
    // Feather the sides so the shaft has no vertical edge at all.
    const side = g.createLinearGradient(0, 0, w, 0);
    side.addColorStop(0, "rgba(0,0,0,0)");
    side.addColorStop(0.5, "rgba(0,0,0,1)");
    side.addColorStop(1, "rgba(0,0,0,0)");
    g.globalCompositeOperation = "destination-in";
    g.fillStyle = side;
    g.fillRect(0, 0, w, h);
  });

  /* Four-ray glint for the flakes that catch the light. The reference is
   * full of these star flares, and they are a different thing from the
   * confetti — a specular event, not an object. */
  flareSprite = sprite(128, (g, s) => {
    const r = s / 2;
    g.translate(r, r);
    const ray = (len, wide, alpha) => {
      const grad = g.createLinearGradient(0, 0, len, 0);
      grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(0, -wide); g.lineTo(len, 0); g.lineTo(0, wide);
      g.closePath(); g.fill();
    };
    for (let i = 0; i < 4; i++) {
      g.save(); g.rotate(i * Math.PI / 2);
      ray(r * 0.96, r * 0.055, 0.95);
      g.restore();
    }
    for (let i = 0; i < 4; i++) {
      g.save(); g.rotate(Math.PI / 4 + i * Math.PI / 2);
      ray(r * 0.4, r * 0.03, 0.5);
      g.restore();
    }
    const core = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.2);
    core.addColorStop(0, "rgba(255,255,255,1)");
    core.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = core;
    g.fillRect(-r, -r, s, s);
  });
}

/* ------------------------------------------------------------------ render */

/* Basis: `up` opposes gravity, `tan` runs along the surface. Everything to do
 * with the liquid is computed in this frame, then drawn in screen space. */
let up = { x: 0, y: -1 }, tan = { x: 1, y: 0 };

/* Half-extents of the container along the two basis directions. These are
 * support-function values, not max(RX, RY): on a full-screen portrait
 * container the tangent extent is the *width*, and sizing the height field
 * to the height instead would leave most of its columns off-screen — the
 * wave would run at a fraction of its intended resolution. */
let span = 1;        // along `tan`
let upExtent = 1;    // along `up`

let basisAngle = 0, basisReady = false;
let inversionGuard = 0;   // suppress stale cross-flow after a face-over-face flip
let cascadeSpreadHold = 0; // keeps a released resting bed broad across the glass
let cascadeLanePolarity = 1; // tangent reverses sign on each face-over-face flip
let flipArmed = false, flipStartX = 0, flipStartY = 1;

/* The air pocket is the largest single mass cue in the scene. Its silhouette
 * should not rotate in lock-step with the sensor while the heavier liquid and
 * glitter are still catching up. This second basis follows the real gravity
 * frame with a short viscous lag and is used only by the visible free surface;
 * the fluid solver and particle gravity stay on the physical basis above. */
let displayUp = { x: 0, y: -1 }, displayTan = { x: 1, y: 0 };
let displaySpan = 1, displayUpExtent = 1;
let displayAngle = 0, displayBasisReady = false;
let displayAngleVelocity = 0, displayBasisTime = 0, displayFrameDt = 1 / 60;
let displayCompression = 0, displayCompressionVelocity = 0;
let displayBubbleOffset = 0, displayBubbleVelocity = 0;

function updateDisplayBasis() {
  const now = performance.now();
  displayFrameDt = displayBasisTime
    ? Math.max(1 / 240, Math.min(0.04, (now - displayBasisTime) / 1000))
    : 1 / 60;
  displayBasisTime = now;
  if (!displayBasisReady) {
    displayAngle = basisAngle;
    displayAngleVelocity = 0;
    displayBasisReady = true;
  } else {
    let d = basisAngle - displayAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    /* A second-order response gives the liquid mass rather than mere delay:
     * it accelerates into a turn, trails the glass, overshoots slightly, then
     * settles without copying tiny sensor twitches into the waterline. */
    displayAngleVelocity += (d * 28 - displayAngleVelocity * 9.5) * displayFrameDt;
    displayAngleVelocity = Math.max(-4.2, Math.min(4.2, displayAngleVelocity));
    displayAngle += displayAngleVelocity * displayFrameDt;
  }
  /* Motion toward and away from the glass compresses the visible air lens
   * before it rebounds. This is a separate, damped depth mode: mapping Z
   * acceleration onto X or Y would only make another sideways slosh. */
  displayCompressionVelocity += (-accel.z * 4.0 - displayCompression * 14 -
    displayCompressionVelocity * 6.5) * displayFrameDt;
  displayCompression += displayCompressionVelocity * displayFrameDt;
  displayCompression = Math.max(-0.20, Math.min(0.20, displayCompression));
  displayUp.x = Math.cos(displayAngle);
  displayUp.y = Math.sin(displayAngle);
  displayTan.x = -displayUp.y;
  displayTan.y = displayUp.x;
  displaySpan = Math.abs(displayTan.x) * RX + Math.abs(displayTan.y) * RY;
  displayUpExtent = Math.abs(displayUp.x) * RX + Math.abs(displayUp.y) * RY;

  /* The headspace is one trapped bubble, not a waterline glued to the centre.
   * Tangential acceleration and the turning surface displace its bulge along
   * the interface; a lightly underdamped spring gives it lag, overshoot and a
   * soft return. The wetting ends stay fixed at the glass. */
  const alongAccel = accel.x * displayTan.x + accel.y * displayTan.y;
  displayBubbleVelocity += (-alongAccel * 3.8 - displayAngleVelocity * 0.32 -
    displayBubbleOffset * 7.5 - displayBubbleVelocity * 3.8) * displayFrameDt;
  displayBubbleVelocity = Math.max(-0.72, Math.min(0.72, displayBubbleVelocity));
  displayBubbleOffset += displayBubbleVelocity * displayFrameDt;
  if (Math.abs(displayBubbleOffset) > 0.20) {
    displayBubbleOffset = Math.sign(displayBubbleOffset) * 0.20;
    displayBubbleVelocity *= -0.22;
  }
}

/* Turning the container tilts the water in it.
 *
 * The height field is a graph over `tan`, and `tan` is derived from gravity —
 * so when the phone turns, the axes the surface is measured against turn with
 * it. Left alone, that means the surface arrives already perpendicular to the
 * new gravity: rotate the phone through 180 degrees and the water swaps ends
 * without ever sloshing, because the only forcing in the wave field is
 * `accel`, and a pure rotation has no translational acceleration at all.
 *
 * The surface does not turn with the container. Expressed in the new basis it
 * is tilted by exactly the angle the basis moved, which is what this puts
 * back — and the wave dynamics then do what they already do, running that
 * tilt back and forth across the vessel until it damps out. All of the
 * sloshing on a tilt or a flip comes from these two lines.
 */
let boundsAngle = Infinity;

/* Intersect tangent-space columns with the sampled container wall. The
 * resulting upper and lower lifts are the real local limits for both the
 * free surface and settled particles, including the rounded phone corners. */
function updateSurfaceBounds(force = false) {
  if (!force && Math.abs(basisAngle - boundsAngle) < 0.0025) return;
  boundsAngle = basisAngle;
  for (let i = 0; i < N; i++) {
    const s = -span + 2 * span * (i / (N - 1));
    let lo = Infinity, hi = -Infinity;
    for (let j = 0; j < outline.length; j++) {
      const a = outline[j], b = outline[(j + 1) % outline.length];
      const adx = a.x - CX, ady = a.y - CY;
      const bdx = b.x - CX, bdy = b.y - CY;
      const sa = adx * tan.x + ady * tan.y;
      const sb = bdx * tan.x + bdy * tan.y;
      if ((s < sa && s < sb) || (s > sa && s > sb) || Math.abs(sb - sa) < 1e-7) continue;
      const q = (s - sa) / (sb - sa);
      if (q < 0 || q > 1) continue;
      const la = adx * up.x + ady * up.y;
      const lb = bdx * up.x + bdy * up.y;
      const lift = la + (lb - la) * q;
      if (lift < lo) lo = lift;
      if (lift > hi) hi = lift;
    }
    surfaceFloor[i] = Number.isFinite(lo) ? lo : -upExtent;
    surfaceRoof[i] = Number.isFinite(hi) ? hi : upExtent;
  }
}

function updateBasis() {
  const prev = basisAngle;
  up = { x: -gDir.x, y: -gDir.y };
  tan = { x: -up.y, y: up.x };
  span = Math.abs(tan.x) * RX + Math.abs(tan.y) * RY;
  upExtent = Math.abs(up.x) * RX + Math.abs(up.y) * RY;
  basisAngle = Math.atan2(up.y, up.x);

  let d = basisAngle - prev;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  if (basisReady && d !== 0) {
    basisKick = Math.max(basisKick, Math.min(1, Math.abs(d) * 18));
    if (Math.abs(d) > Math.PI * 0.72) {
      inversionGuard = 1;
      pileFill *= 0.08;
    }
    /* The old `d * s` term is only the small-angle approximation to a
     * rotated plane. It becomes catastrophically wrong at an inversion:
     * d=pi injected the largest possible diagonal ramp even though the
     * sideways projection of a 180-degree flip is sin(pi)=0. That artificial
     * ramp drove the fluid—and all the glitter—to both side walls. */
    const projectedTilt = Math.sin(d);
    for (let i = 0; i < N; i++) {
      h[i] -= projectedTilt * (-span + 2 * span * (i / (N - 1)));
    }
  }
  basisReady = true;
  updateSurfaceBounds(!Number.isFinite(boundsAngle));
}

function surfaceAt(s) {
  // s is the coordinate along `tan`, in pixels from the container centre.
  const f = (s + span) / (2 * span) * (N - 1);
  const i = Math.max(0, Math.min(N - 2, Math.floor(f)));
  const frac = f - i;
  return h[i] * (1 - frac) + h[i + 1] * frac;
}

/* Rendering the solver's samples directly makes the waterline advertise its
 * grid whenever it tilts. This five-tap kernel removes cell-scale kinks but
 * preserves the broad crest and trough that carry the actual slosh. Physics
 * continues to use the unsmoothed height and slope. */
function surfaceVisualAt(s) {
  const f = (s + span) / (2 * span) * (N - 1);
  const sample = (j) => h[Math.max(0, Math.min(N - 1, j))];
  const smooth = (j) =>
    (sample(j - 2) + sample(j - 1) * 2 + sample(j) * 3 +
     sample(j + 1) * 2 + sample(j + 2)) / 9;
  const i = Math.max(0, Math.min(N - 2, Math.floor(f)));
  const frac = f - i;
  return smooth(i) * (1 - frac) + smooth(i + 1) * frac;
}

/** How steeply the surface leans, in rise per unit run along `tan`. */
function surfaceSlope(s) {
  const f = (s + span) / (2 * span) * (N - 1);
  const i = Math.max(1, Math.min(N - 2, Math.round(f)));
  return (h[i + 1] - h[i - 1]) / (2 * (2 * span / (N - 1)));
}

/** Perpendicular distance above the wavy surface; negative = submerged. */
function depthOf(x, y) {
  const dx = x - CX, dy = y - CY;
  const along = dx * tan.x + dy * tan.y;
  const height = dx * up.x + dy * up.y;
  return height - (level + surfaceVisualAt(along));
}

/* A solid flake cannot remain on the air side of the physical free surface.
 * Cancelling only its outward velocity left already-escaped particles parked
 * above the liquid until a later wave made them pop back into view. Project
 * the position below the interface as well, preserving tangential motion. */
function clampUnderSurface(p, clearance) {
  const d = depthOf(p.x, p.y);
  if (d <= -clearance) return false;
  const correction = d + clearance;
  p.x -= up.x * correction;
  p.y -= up.y * correction;
  const vn = p.vx * up.x + p.vy * up.y;
  if (vn > 0) {
    p.vx -= up.x * vn;
    p.vy -= up.y * vn;
  }
  return true;
}

/* Height of the loose glitter bed at a tangent position. A broad parabolic
 * dome approximates a shallow angle-of-repose mound without imposing a rigid
 * central column: flakes still land across nearly the whole floor, then the
 * contacted grains avalanche gently inward as the bed deepens. */
function pileLiftAt(along, clearance, layer) {
  const f = Math.max(0, Math.min(N - 1,
    Math.round((along + span) / (2 * span) * (N - 1))));
  const halfWidth = Math.max(1, span * 0.76);
  const q = Math.min(1, Math.abs(along) / halfWidth);
  const dome = Math.pow(Math.max(0, 1 - q * q), 1.22);
  const height = Math.min(RX, RY) * 0.23 * pileFill * dome * layer;
  return surfaceFloor[f] + clearance + height;
}

function clampAbovePile(p, clearance, dt) {
  if (p.density <= 0) return false;
  /* A mound has volume. Supporting every grain on the same outer envelope
   * made a bright arch with a blue, bubble-like void underneath. Give each
   * grain a stable packing layer so the entire volume from the glass to the
   * angle-of-repose surface is occupied. A slight base bias mimics compaction
   * while still leaving plenty of flakes defining the crown. */
  if (!Number.isFinite(p.pileLayer)) {
    p.pileLayer = Math.pow(Math.random(), 1.12);
  }
  const dx = p.x - CX, dy = p.y - CY;
  const along = dx * tan.x + dy * tan.y;
  const lift = dx * up.x + dy * up.y;
  const bed = pileLiftAt(along, clearance, p.pileLayer);
  // Include a small capture band so a grain already supported by the bed is
  // counted as settled even between low-rate microglitter updates.
  if (lift > bed + Math.max(1.2, p.r * 0.35)) return false;
  if (lift < bed) {
    const correction = bed - lift;
    p.x += up.x * correction;
    p.y += up.y * correction;
  }
  const vn = p.vx * up.x + p.vy * up.y;
  if (vn < 0) {
    p.vx -= up.x * vn;
    p.vy -= up.y * vn;
  }
  // Dry-looking avalanching over the viscous carrier: extremely gentle at
  // rest, stronger only while a grain is arriving, and always toward the
  // crown. This builds a mound without making the whole pile visibly crawl.
  const quiet = Math.max(0, 1 - motionActivity * 1.8);
  const avalanche = along * (0.18 + 0.32 * pileFill) * quiet * dt;
  p.vx -= tan.x * avalanche;
  p.vy -= tan.y * avalanche;
  // Rounded glass makes its lowest visible corners attractive numerical
  // resting points. Grains in that last shoulder have no stable support in a
  // real loose bed; let them creep off the curved wall into the broad pile.
  const shoulder = Math.max(0, Math.abs(along) - span * 0.68);
  if (shoulder > 0) {
    const slide = Math.sign(along) * shoulder * (0.28 + pileFill * 0.24) * quiet * dt;
    p.x -= tan.x * slide;
    p.y -= tan.y * slide;
  }
  return true;
}

function liquidPolygon() {
  // Walk the surface line across the container, then close the polygon along
  // the squircle boundary on the downhill side.
  const pts = [];
  const steps = 64;
  for (let i = 0; i <= steps; i++) {
    const s = -span + (2 * span) * (i / steps);
    const lift = level + surfaceVisualAt(s);
    pts.push({
      x: CX + tan.x * s + up.x * lift,
      y: CY + tan.y * s + up.y * lift,
    });
  }
  // Close well outside the container; the squircle clip trims it back.
  const far = (span + upExtent) * 2;
  pts.push({ x: CX + tan.x * span - up.x * far, y: CY + tan.y * span - up.y * far });
  pts.push({ x: CX - tan.x * span - up.x * far, y: CY - tan.y * span - up.y * far });
  return pts;
}

function flatLiquidPolygon(lift) {
  const pts = [];
  const steps = 64;
  for (let i = 0; i <= steps; i++) {
    const s = -displaySpan + 2 * displaySpan * (i / steps);
    pts.push({
      x: CX + displayTan.x * s + displayUp.x * lift,
      y: CY + displayTan.y * s + displayUp.y * lift,
    });
  }
  const far = (displaySpan + displayUpExtent) * 2;
  pts.push({ x: CX + displayTan.x * displaySpan - displayUp.x * far,
             y: CY + displayTan.y * displaySpan - displayUp.y * far });
  pts.push({ x: CX - displayTan.x * displaySpan - displayUp.x * far,
             y: CY - displayTan.y * displaySpan - displayUp.y * far });
  return pts;
}

function lensLiquidPolygon(lift) {
  const pts = flatLiquidPolygon(lift);
  const steps = 64;
  let a = -1, b = -1;
  for (let i = 0; i <= steps; i++) {
    if (!isInside(pts[i].x, pts[i].y)) continue;
    if (a < 0) a = i;
    b = i;
  }
  if (a < 0 || b - a < 3) return pts;
  const run = (b - a) * (2 * displaySpan / steps);
  const turn = Math.min(1, Math.abs(displayAngleVelocity) / 2.8);
  const breathing = 1 + displayCompression * 1.20;
  const bow = Math.min(Math.min(RX, RY) * (0.090 + turn * 0.010), run * 0.145) *
    breathing;
  const skew = Math.max(-0.24, Math.min(0.24, displayAngleVelocity * 0.085));
  const centre = 0.5 + displayBubbleOffset;
  for (let i = a; i <= b; i++) {
    const t = (i - a) / (b - a);
    /* The rear half of a moving surface remains fuller for a moment while the
     * leading contact line climbs the glass. This tiny skew is the visible
     * consequence of inertia; it vanishes completely once the turn settles. */
    /* Concentrate the fixed air volume into a deeper, readable centre while
     * keeping narrow wetting shoulders at both contact lines. A broad, deep
     * lens cannot fit at 98% fill and silently makes the toy look underfilled. */
    const q = t <= centre ? t / centre : (1 - t) / (1 - centre);
    const d = bow * Math.pow(Math.sin(Math.PI * 0.5 * q), 4.2) *
      (1 + skew * (t * 2 - 1));
    pts[i].x -= displayUp.x * d;
    pts[i].y -= displayUp.y * d;
  }
  return pts;
}

let displayLevel = 0, displayLevelReady = false, displayLevelVelocity = 0;
let displaySolved = 0, displaySolveAngle = Infinity, displaySolveTick = 0;
let displaySolveCompression = Infinity, displaySolveBubbleOffset = Infinity;

/* The visible air pocket is one coherent free surface. Selecting the largest
 * trough from the physics field made the pocket jump whenever two troughs
 * traded size by a pixel. Solve a single gravity-level plane for the sealed
 * volume instead: it stays connected, follows tilt continuously, and cannot
 * sprout needle-shaped holes during a shake. The physical wave field still
 * drives the fluid and particles; it simply no longer dictates a glitchy
 * silhouette. */
function displayLiquidPolygon() {
  updateDisplayBasis();
  displaySolveTick++;
  let d = Number.isFinite(displaySolveAngle) ? displayAngle - displaySolveAngle : Infinity;
  if (Number.isFinite(d)) {
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
  }
  const compressionDelta = Math.abs(displayCompression - displaySolveCompression);
  const bubbleDelta = Math.abs(displayBubbleOffset - displaySolveBubbleOffset);
  if (!displayLevelReady || ((displaySolveTick & 1) === 0 &&
      (Math.abs(d) > 0.0025 || compressionDelta > 0.002 || bubbleDelta > 0.002))) {
    let lo = -displayUpExtent * 1.05, hi = displayUpExtent * 1.05;
    for (let solve = 0; solve < 9; solve++) {
      const mid = (lo + hi) * 0.5;
      const area = polygonArea(clipToContainer(lensLiquidPolygon(mid)));
      if (area < targetArea) lo = mid; else hi = mid;
    }
    displaySolved = (lo + hi) * 0.5;
    displaySolveAngle = displayAngle;
    displaySolveCompression = displayCompression;
    displaySolveBubbleOffset = displayBubbleOffset;
  }
  if (!displayLevelReady) {
    displayLevel = displaySolved;
    displayLevelVelocity = 0;
    displayLevelReady = true;
  } else {
    // The pocket's translation carries mass too; critically damp its volume
    // correction so a turn never becomes a quantised, trembling waterline.
    displayLevelVelocity += ((displaySolved - displayLevel) * 40 -
      displayLevelVelocity * 12.5) * displayFrameDt;
    const levelSpeed = displayUpExtent * 1.4;
    displayLevelVelocity = Math.max(-levelSpeed,
      Math.min(levelSpeed, displayLevelVelocity));
    displayLevel += displayLevelVelocity * displayFrameDt;
  }
  return lensLiquidPolygon(displayLevel);
}

/* The visible surface is deliberately allowed to lag the physical solver,
 * but render culling must use the surface that was actually drawn. Cache its
 * 65 sampled lifts once per frame so particles and the air pocket cannot
 * disagree about which side of the interface a pixel belongs on. */
const DISPLAY_SURFACE_STEPS = 64;
const displaySurfaceLifts = new Float32Array(DISPLAY_SURFACE_STEPS + 1);

function cacheDisplaySurface(poly) {
  for (let i = 0; i <= DISPLAY_SURFACE_STEPS; i++) {
    displaySurfaceLifts[i] = (poly[i].x - CX) * displayUp.x +
      (poly[i].y - CY) * displayUp.y;
  }
}

function displayDepthOf(x, y) {
  const dx = x - CX, dy = y - CY;
  const along = dx * displayTan.x + dy * displayTan.y;
  const f = Math.max(0, Math.min(DISPLAY_SURFACE_STEPS,
    (along + displaySpan) / (2 * displaySpan) * DISPLAY_SURFACE_STEPS));
  const i = Math.min(DISPLAY_SURFACE_STEPS - 1, Math.floor(f));
  const frac = f - i;
  const surface = displaySurfaceLifts[i] * (1 - frac) +
    displaySurfaceLifts[i + 1] * frac;
  return dx * displayUp.x + dy * displayUp.y - surface;
}

/* The stretch of surface that genuinely touches air, ending exactly where
 * the liquid meets the glass, with a capillary climb at each contact.
 *
 * A free surface is bounded by its vessel: where the container has curved
 * away, there is no air-liquid interface to draw. Bisecting to the wall
 * gives the true contact point, and real liquid wets the glass and climbs
 * it, so the ends curl up instead of stopping dead.
 */
function meniscus(poly, steps) {
  const wall = (from, to) => {
    // `from` is inside, `to` is out; bisect for the contact point.
    let lo = from, hi = to;
    for (let i = 0; i < 12; i++) {
      const m = { x: (lo.x + hi.x) / 2, y: (lo.y + hi.y) / 2 };
      if (isInside(m.x, m.y)) lo = m; else hi = m;
    }
    return lo;
  };

  const climb = Math.min(RX, RY) * 0.03;
  const reach = Math.min(RX, RY) * 0.13;
  const segs = [];
  let i = 0;

  /* Every contiguous run of surface that is actually inside the vessel is a
   * separate stretch of air-liquid interface. In a nearly full container the
   * crest presses against the ceiling and the waterline genuinely breaks
   * into pieces around the trapped air; taking only the first run would drop
   * the rest of it. */
  while (i <= steps) {
    while (i <= steps && !isInside(poly[i].x, poly[i].y)) i++;
    if (i > steps) break;
    const a = i;
    while (i <= steps && isInside(poly[i].x, poly[i].y)) i++;
    const b = i - 1;

    const pts = [];
    if (a > 0) pts.push(wall(poly[a], poly[a - 1]));
    for (let k = a; k <= b; k++) pts.push({ x: poly[k].x, y: poly[k].y });
    if (b < steps) pts.push(wall(poly[b], poly[b + 1]));
    if (pts.length < 2) continue;

    // Capillary climb: the liquid wets the glass, so each end curls upward
    // over a short stretch of wall rather than meeting it flat.
    const first = pts[0], last = pts[pts.length - 1];
    for (const p of pts) {
      const d = Math.min(Math.hypot(p.x - first.x, p.y - first.y),
                         Math.hypot(p.x - last.x, p.y - last.y));
      if (d >= reach) continue;
      const t = 1 - d / reach;
      const lift = climb * t * t;
      p.x += displayUp.x * lift; p.y += displayUp.y * lift;
    }
    segs.push(pts);
  }
  return segs;
}

function polygonArea(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    a += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
  }
  return Math.abs(a) * 0.5;
}

/* Append a quadratic-smoothed polyline. Midpoint curves keep the meniscus
 * fluid at steep tilts without overshooting its wall contact points. */
function appendSmooth(points, off, reverse, move, dx = 0, dy = 0) {
  const n = points.length;
  const at = (i) => points[reverse ? n - 1 - i : i];
  const first = at(0);
  const fx = first.x + displayUp.x * off + dx, fy = first.y + displayUp.y * off + dy;
  if (move) ctx.moveTo(fx, fy); else ctx.lineTo(fx, fy);
  for (let i = 1; i < n - 1; i++) {
    const p = at(i), q = at(i + 1);
    const px = p.x + displayUp.x * off + dx, py = p.y + displayUp.y * off + dy;
    const qx = q.x + displayUp.x * off + dx, qy = q.y + displayUp.y * off + dy;
    ctx.quadraticCurveTo(px, py, (px + qx) * 0.5, (py + qy) * 0.5);
  }
  const last = at(n - 1);
  ctx.lineTo(last.x + displayUp.x * off + dx, last.y + displayUp.y * off + dy);
}

/* A bubble is a deformable object, not a stamp.
 *
 * A gas bubble rising through liquid is flattened perpendicular to its
 * motion — pressure is highest on the face meeting the fluid — and the
 * faster it climbs the more oblate it gets. Drawing every bubble as the same
 * rigid circle was the single thing that made them read as decals. It is
 * also drawn at its depth, so bubbles at the back sit under the liquid tint
 * and only the ones near the glass keep a hard bright rim.
 */
function drawBubble(b) {
  const sc = 1 + b.z * 0.42;
  const r = b.r * b.pop * sc;
  const x = projectedX(b.x, b.z), y = projectedY(b.y, b.z);
  // Same aerial perspective as the flakes: a bubble at the back wall is seen
  // through the whole thickness of the liquid and loses most of its contrast.
  const alpha = b.alpha * (0.24 + 0.76 * (b.z + 1) * 0.5);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);

  if (r < 9) {
    // Fine bubbles. Nothing directional survives at this size, so one flat
    // blit — no transforms, and it is most of the population.
    ctx.drawImage(farField ? bubbleSmallFar : bubbleSmall, -r, -r, r * 2, r * 2);
    ctx.restore();
    return;
  }

  /* Cast first, so the bubble sits on top of its own shadow. Offset away
   * from the source and softened with size, the way a shadow thrown through
   * a thick medium spreads with the distance it travels. */
  ctx.globalAlpha = alpha * 0.18;
  const sd = r * 1.05;
  ctx.drawImage(shadeSprite, -SHADOW_X * sd - r, -SHADOW_Y * sd - r, r * 2, r * 2);
  ctx.globalAlpha = alpha;

  const speed = Math.hypot(b.vx, b.vy);
  const vang = speed > 1 ? Math.atan2(b.vy, b.vx) : 0;
  if (b.squash > 0.01) {
    // Flatten along the direction of travel, and leave the frame squashed
    // so the reflection deforms with the surface carrying it.
    ctx.rotate(vang);
    ctx.scale(1 / (1 + b.squash), 1 + b.squash * 0.72);
    ctx.rotate(-vang);
  }

  // What it refracts is fixed to gravity; what it reflects is fixed to the
  // light. Two blits, two frames.
  ctx.rotate(riseAngle);
  ctx.drawImage((farField ? bubbleBodyFar : bubbleBody)[b.variant], -r, -r, r * 2, r * 2);
  ctx.rotate(BUBBLE_LIGHT_ROT - riseAngle);
  ctx.drawImage(farField ? bubbleGlintFar : bubbleGlint, -r, -r, r * 2, r * 2);
  ctx.restore();
}

function drawStar(p, time) {
  // Fine glitter: at two or three pixels the rotation is invisible, so skip
  // the transform — but still blit the sprite. Substituting a fillRect here
  // is faster again and looks it: hard little squares read as cheap dither,
  // where the downscaled sprite reads as soft glitter.
  const sc = 1 + p.z * 0.42;
  const rr = p.r * sc;
  const px = projectedX(p.x, p.z), py = projectedY(p.y, p.z);

  /* Threshold raised from 2.2px: enlarging the flakes to match the
   * reference pushed most of the population off this fast path and onto the
   * save/rotate/restore one, costing 23fps. At three pixels across the
   * rotation is not visible anyway. */
  /* Aerial perspective. Against a coloured background, dropping a particle's
   * alpha *is* the loss of contrast with distance — what shows through is
   * the liquid, which is exactly what absorption and scattering along a
   * longer path leave you with. The ramp used to run 0.68 to 1.0, which is
   * barely a fifth of the range, and the fine glitter did not get it at all:
   * every small flake was drawn at full strength however deep it sat. */
  const depthFade = 0.20 + 0.80 * (p.z + 1) * 0.5;

  if (rr < 3.0) {
    ctx.globalAlpha = depthFade;
    ctx.drawImage((farField ? flakeSmallFar : flakeSmall)[p.hueIdx * SHAPES + p.shape],
                  px - rr, py - rr, rr * 2, rr * 2);
    ctx.globalAlpha = 1;
    return;
  }

  // Big flakes carry a glow; the fine glitter does not, which keeps the
  // blit count down and reads as depth of field.
  if (rr > 6) {
    const g = rr * 4.2;
    ctx.globalAlpha = 0.30 * depthFade;
    ctx.drawImage(glowSprite, px - g, py - g, g * 2, g * 2);
    ctx.globalAlpha = 1;
  }

  const s = rr * 2;
  ctx.save();
  ctx.globalAlpha = depthFade;
  ctx.translate(px, py);
  ctx.rotate(p.spin);
  ctx.drawImage((farField ? flakeFar : flakeSprites)[p.hueIdx * SHAPES + p.shape],
                -rr, -rr, s, s);

  /* Highlight, placed so it stays with the light while the flake turns
   * under it. The sprite is drawn in the flake's rotated frame, so the
   * atlas entry is chosen to cancel that rotation out. */
  let rel = (LIGHT_ANGLE - p.spin) % (Math.PI * 2);
  if (rel < 0) rel += Math.PI * 2;
  const k = Math.round(rel / (Math.PI * 2) * SPEC_K) % SPEC_K;
  /* Brightness follows how squarely the facet faces the light: a mirror
   * returns the source only near the reflection angle, and away from it
   * returns almost nothing. `flashPhase` gives each flake its own tilt out
   * of the plane, which is the part a 2-D spin cannot represent. */
  const face = Math.cos(p.spin * 2 - LIGHT_ANGLE * 2 + p.flashPhase);
  const glint = Math.pow(Math.max(0, face), 3);
  if (glint > 0.02) {
    ctx.globalAlpha = (0.12 + 0.88 * glint) * depthFade;
    ctx.drawImage(specSprites[p.shape * SPEC_K + k], -rr, -rr, s, s);
  }

  // Full-face flash when it turns square to the source.
  // A still flake holds one highlight. Tying this to simulation time made the
  // whole wallpaper sparkle and dim even while the phone sat untouched.
  const flash = Math.sin(p.spin * 2.3 + p.flashPhase);
  if (flash > 0.86) {
    ctx.globalAlpha = (flash - 0.86) / 0.14;
    ctx.drawImage(flashSprites[p.shape], -rr, -rr, s, s);
  }
  ctx.restore();

  /* At the peak of the flash the flake throws a glint. The reference is full
   * of these; they are a different thing from the confetti — a specular
   * event, not an object — so they are added rather than blended. Light
   * arrives on top of what is already there; it does not cover it. */
  if (flash > 0.975 && rr > 5.5) {
    const k = (flash - 0.975) / 0.025;
    const f = rr * (1.8 + k * 2.2);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = k * 0.6;
    ctx.drawImage(flareSprite, px - f, py - f, f * 2, f * 2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
}

/* Parallax offset for a particle at depth z.
 *
 * Tilting the phone changes the angle you view the pouch from, and the back
 * wall shifts against the front by an amount proportional to the thickness
 * between them. Using the gravity direction as the proxy for that angle
 * costs nothing and is right to first order: upright it is zero, and the
 * further the phone leans the more the layers separate. */
function parallaxX(z) {
  return z * PARALLAX * (grav.x + accel.x * 0.10);
}
function parallaxY(z) {
  return z * PARALLAX * ((grav.y - 1) - gravZ * 0.32 + accel.y * 0.10);
}
const PARALLAX = 18;
const DEPTH_PERSPECTIVE = 0.040;
const DEPTH_PULSE_PERSPECTIVE = 0.22;

/* Perspective was the missing half of Z motion. A particle moving toward the
 * front glass now travels radially outward and grows; one moving away travels
 * inward and shrinks. The existing parallax still supplies the directional
 * shear from a tilted viewing angle. */
function projectedX(x, z) {
  return CX + (x - CX) * (1 + z * DEPTH_PERSPECTIVE +
    displayCompression * DEPTH_PULSE_PERSPECTIVE) + parallaxX(z);
}
function projectedY(y, z) {
  return CY + (y - CY) * (1 + z * DEPTH_PERSPECTIVE +
    displayCompression * DEPTH_PULSE_PERSPECTIVE) + parallaxY(z);
}

/* Motion through the pouch thickness. `zHome` keeps a particle within the
 * layer it was born into; gravity through the screen and a normal shake move
 * it around that layer with spring-and-dashpot dynamics, so depth has mass
 * rather than being an animated offset. */
function stepDepth(p, dt, response) {
  const target = Math.max(-0.86, Math.min(0.86,
    p.zHome + gravZ * 0.22 * response));
  /* Slightly under-damped so a fore-aft shake produces a visible return
   * stroke instead of one muted displacement. The dead-zoned accelerometer
   * still brings this completely to rest when the phone is still. */
  p.zv += ((target - p.z) * 1.10 - p.zv * 1.65 -
    accel.z * response * 2.80) * dt;
  p.z += p.zv * dt;
  if (p.z < -1) { p.z = -1; p.zv = Math.abs(p.zv) * 0.28; }
  else if (p.z > 1) { p.z = 1; p.zv = -Math.abs(p.zv) * 0.28; }
}

let starSplit = 0, bubbleSplit = 0;
let depthSortTime = 0;

/** Index of the first particle at or in front of the mid-plane. */
function depthSplit(list) {
  let i = 0;
  while (i < list.length && list[i].z < 0) i++;
  return i;
}

function drawParticles(s0, s1, b0, b1, time) {
  for (let i = b0; i < b1; i++) {
    const b = bubbles[i];
    if (b.alpha <= 0 || displayDepthOf(projectedX(b.x, b.z),
        projectedY(b.y, b.z)) > 0) continue;
    drawBubble(b);
  }
  ctx.globalAlpha = 1;
  for (let i = s0; i < s1; i++) {
    const p = stars[i];
    if (displayDepthOf(projectedX(p.x, p.z), projectedY(p.y, p.z)) > 0) continue;
    drawStar(p, time);
  }
  ctx.globalAlpha = 1;
}

/* Thousands of tiny flecks become seven colour paths and seven fills. The
 * batched squares are small enough to read as foil flashes, while the hero
 * layer above supplies the recognisable stars, diamonds and hex cuts. */
let microPathsBack = [], microPathsFront = [], microPathsDirty = true;
const microBackCanvas = document.createElement("canvas");
const microFrontCanvas = document.createElement("canvas");
const microBackCtx = microBackCanvas.getContext("2d");
const microFrontCtx = microFrontCanvas.getContext("2d");

/* Build both depth passes in one walk. With 17,850 flecks, traversing the
 * entire population once for the rear and again for the front cost more than
 * the actual seven batched fills. The split still renders on opposite sides
 * of the liquid tint; only the bookkeeping is shared. */
function buildMicroPaths() {
  microPathsBack = FLAKE_COLOURS.map(() => new Path2D());
  microPathsFront = FLAKE_COLOURS.map(() => new Path2D());
  for (const p of microGlitter) {
    const x = projectedX(p.x, p.z), y = projectedY(p.y, p.z);
    if (displayDepthOf(x, y) > 0) continue;
    const zScale = 0.72 + (p.z + 1) * 0.22;
    // Position supplies a deterministic foil angle: it changes as the fleck
    // moves through the liquid and becomes perfectly still when the fleck is.
    const flash = 0.76 + 0.24 * Math.sin(p.phase + p.x * 0.015 + p.y * 0.011);
    const r = Math.max(0.42, p.r * zScale * flash);
    (p.z >= 0 ? microPathsFront : microPathsBack)[p.hueIdx]
      .rect(x - r, y - r, r * 2, r * 2);
  }

  /* Rasterise each depth pass only when its 20 Hz physics advances. Replaying
   * fourteen thousand retained rectangles through the main compositor every
   * display frame was still almost as costly as rebuilding them; these two
   * transparent layers turn that work into two ordinary image blits. */
  const raster = (g, paths, front) => {
    g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = "screen";
    g.globalAlpha = 1;
    for (let i = 0; i < paths.length; i++) {
      /* Both passes use the saturated shade. The front pass used the pastel,
       * and a near-white screened over the blue at 82% is simply white: the
       * colour each fleck carries was being thrown away at the last step, and
       * twenty thousand of them read as static. */
      g.fillStyle = FLAKE_COLOURS[i][1];
      g.fill(paths[i]);
    }
    g.globalCompositeOperation = "source-over";
  };
  raster(microBackCtx, microPathsBack, false);
  raster(microFrontCtx, microPathsFront, true);
  microPathsDirty = false;
}

function drawMicro(front) {
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = front ? 0.82 : 0.38;
  ctx.drawImage(front ? microFrontCanvas : microBackCanvas, 0, 0, W, H);
  ctx.restore();
}

/* The wall has thickness, and near the silhouette you are looking through a
 * lot of it at a glancing angle.
 *
 * A ray reaching the eye from the edge of the container has been bent inward
 * on its way out, so what you see there is not the liquid immediately behind
 * the glass — it is liquid from further in, brought out to the rim. A wide
 * radial swath of the interior gets squeezed into a narrow band, and the
 * squeeze grows toward the edge because the angle does. That compression is
 * what makes a thick glass object read as an object rather than as a picture
 * with a border drawn on it, and the shaker had only a hairline where the
 * wall should be.
 *
 * Done by drawing the frame back onto itself, magnified about the centre —
 * which is exactly a sample taken from further in — in a handful of bands
 * with the magnification rising outward. Rectangular strips rather than a
 * clipped annulus, because a per-frame clip against this outline is the most
 * expensive thing in the renderer; the corners spill past the squircle and
 * the glass layer's knockout trims them a moment later. Outermost band
 * first, so no band ever samples a region another band has already rewritten.
 */
const BEZEL_BANDS = 4;
const BEZEL_T = 0.075;     // wall thickness, as a fraction of the short half-axis
const BEZEL_REACH = 1.8;   // restrained refraction: no repeated white edge streaks

/* Destination offset from the silhouette -> the offset it samples from.
 *
 * Continuous with the interior at the inner face, so the bezel joins the
 * scene without a seam, and reaching `BEZEL_REACH` thicknesses deep at the
 * silhouette itself. Two things follow from that and both are the point: the
 * band pulls in far more depth than it occupies, so what it shows is
 * compressed by that ratio; and the order reverses, the outermost sliver
 * showing the deepest liquid, which is the inversion you see in the rim of
 * any thick glass.
 */
function bezelDepth(d, T) { return T + (T - d) * BEZEL_REACH; }

/* Read from a copy, not from the canvas being drawn to.
 *
 * Two dozen drawImage calls that take the destination canvas as their own
 * source cost 20ms a frame: each one makes the browser snapshot the whole
 * backing store, because it cannot know the regions do not overlap. Copying
 * what the bezel needs into a scratch canvas first turns those into ordinary
 * blits. Only the border is copied — every sample the rim takes lies within
 * four wall-thicknesses of an edge — so it is a quarter of the screen once,
 * rather than the whole of it two dozen times.
 */
let bezelSrc = null, bezelSrcCtx = null;

function bezelCapture(T) {
  const d = Math.ceil(T * (BEZEL_REACH + 1.6) * DPR);
  const w = canvas.width, h = canvas.height;
  bezelSrcCtx.drawImage(canvas, 0, 0, w, d, 0, 0, w, d);
  bezelSrcCtx.drawImage(canvas, 0, h - d, w, d, 0, h - d, w, d);
  const my = d, mh = h - d * 2;
  if (mh > 0) {
    bezelSrcCtx.drawImage(canvas, 0, my, d, mh, 0, my, d, mh);
    bezelSrcCtx.drawImage(canvas, w - d, my, d, mh, w - d, my, d, mh);
  }
}

function bezelBlit(dx, dy, dw, dh, sx, sy, sw, sh) {
  if (dw <= 0.5 || dh <= 0.5 || sw <= 0.5 || sh <= 0.5) return;
  // Source coordinates index the backing store; destination is in CSS pixels.
  ctx.drawImage(bezelSrc, sx * DPR, sy * DPR, sw * DPR, sh * DPR, dx, dy, dw, dh);
}

function drawBezel() {
  const T = Math.min(RX, RY) * BEZEL_T;
  const x0 = CX - RX, x1 = CX + RX, y0 = CY - RY, y1 = CY + RY;
  const wide = x1 - x0;
  for (let k = 0; k < BEZEL_BANDS; k++) {
    const a = T * (k / BEZEL_BANDS), b = T * ((k + 1) / BEZEL_BANDS);
    const h = b - a;
    const Da = bezelDepth(a, T), Db = bezelDepth(b, T);
    const sh = Da - Db;                       // deeper than the band is thick
    const u = 1 - (k + 0.5) / BEZEL_BANDS;    // 1 at the silhouette
    ctx.globalAlpha = 0.08 + 0.42 * u * u;

    bezelBlit(x0, y0 + a, wide, h, x0, y0 + Db, wide, sh);
    bezelBlit(x0, y1 - b, wide, h, x0, y1 - Da, wide, sh);
    const my = y0 + T, mh = (y1 - T) - my;
    bezelBlit(x0 + a, my, h, mh, x0 + Db, my, sh, mh);
    bezelBlit(x1 - b, my, h, mh, x1 - Da, my, sh, mh);
  }
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------- glyph
 *
 * An app's mark, suspended in the liquid as a solid object.
 *
 * This is the thing an icon pack cannot do. A pack ships one drawn tile per
 * app and covers only the apps somebody drew; a container renders whatever
 * mark it is handed, so it works for anything installed. The mark is not
 * pasted on top of the glass — it is placed at the mid-plane of the vessel,
 * so glitter passes behind it washed by the full thickness of liquid and in
 * front of it sharp, which is what puts it *inside* rather than *on*.
 *
 * Depth comes from extrusion rather than from a drawn bevel: the silhouette
 * is stamped repeatedly along the axis pointing away from the light, dark to
 * light, and the front face laid over the stack. A rim is left showing on
 * the lit side by stamping once more toward the light before the face goes
 * down. Every offset is derived from LIGHT_ANGLE, so the mark is lit by the
 * same light as the flakes and the bezel.
 */
/* Real glyph geometry, not hand-drawn approximations of it.
 *
 * These are Material Design Icons (Apache License 2.0), filled weight, taken
 * verbatim as SVG path data on a 24x24 grid. Hand-rolling icon shapes gets
 * you something that reads as *nearly* a gear from across the room and never
 * survives being looked at: the optical corrections that make a real icon set
 * work -- terminal weights, how much a counter opens, where a curve flattens
 * -- are hundreds of small decisions per mark. Path2D parses SVG path data
 * directly, so there is nothing to convert and nothing to get wrong.
 */
const GLYPH_PATHS = {
  heart:  "m12 21.35-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z",  // favorite
  bolt:   "M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z",  // bolt
  chat:   "M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z",  // chat_bubble
  music:  "M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z",  // music_note
  camera: "M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z",  // photo_camera
  gear:   "M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z",  // settings
};

/* Optical size, not bounding-box size. A gear fills its box and a music note
 * does not, so drawn to the same nominal size the gear reads half again as
 * large. Every icon set corrects this by eye; these are those corrections. */
const GLYPH_OPTICAL = {
  heart: 1.00, bolt: 1.06, chat: 1.00, music: 1.06, camera: 0.96, gear: 0.92,
};

const GLYPH_CACHE = new Map();

/** The mark as a Path2D already in canvas coordinates. */
function glyphPath(name, cx, cy, size) {
  const d = GLYPH_PATHS[name];
  if (!d) return null;
  const k = (size / 24) * (GLYPH_OPTICAL[name] || 1);
  const key = name + "|" + cx + "|" + cy + "|" + k;
  let hit = GLYPH_CACHE.get(key);
  if (hit) return hit;
  let raw = GLYPH_CACHE.get(name);
  if (!raw) { raw = new Path2D(d); GLYPH_CACHE.set(name, raw); }
  const p = new Path2D();
  // 24x24 grid, centred on the vessel and scaled to the requested size.
  p.addPath(raw, new DOMMatrix().translate(cx, cy).scale(k).translate(-12, -12));
  if (GLYPH_CACHE.size > 64) GLYPH_CACHE.clear();
  GLYPH_CACHE.set(key, p);
  return p;
}

/* Porcelain.
 *
 * Glazed ceramic is not white plastic, and the difference is mostly in three
 * places. Its body carries a trace of warmth rather than being neutral -- a trace,
 * because past that it stops reading as glaze and starts reading as old
 * ivory, and against a warm liquid it loses its separation altogether. Its
 * glaze gives one broad soft reflection and one tight bright one, not a
 * single blob. And it is faintly translucent, so an edge lit from behind
 * carries a little warmth through it rather than going straight to shadow.
 *
 * Depth is a real extrusion with a chamfered edge. The chamfer is drawn as a
 * stroke clipped to the inside of the silhouette rather than as an inset copy
 * of the path: scaling a path inward shrinks a thin feature -- a note's stem,
 * a gear's tooth -- far more than a fat one, so an inset copy bevels compact
 * shapes correctly and eats slender ones alive. A clipped stroke gives a band
 * of constant width along every edge whatever the shape.
 */
function drawGlyph(name, cx, cy, size) {
  const p = glyphPath(name, cx, cy, size);
  if (!p) return;

  /* Every length below is in units of the icon's own 24-grid, not in
   * fractions of the mark's overall size.
   *
   * Scaled to the bounding radius instead, the bevel came out wider than a
   * music note's head: the chamfer and the glaze between them consumed the
   * whole disc, it lost its face entirely, and it stopped reading as joined
   * to the stem it is actually joined to. A bevel is a property of an edge,
   * so it has to be sized against the stroke weight of the artwork -- about
   * two grid units for this set -- and not against how big the glyph
   * happens to be drawn. */
  const u = size / 24;
  const lx = SHADOW_X, ly = SHADOW_Y;          // toward the light
  const r = size * 0.5;
  const depth = u * 1.5, steps = 20;
  const axis = (a, b) => {
    const g = ctx.createLinearGradient(cx + lx * r, cy + ly * r,
                                       cx - lx * r, cy - ly * r);
    g.addColorStop(0, a); g.addColorStop(1, b);
    return g;
  };

  ctx.save();

  // Cast into the liquid: soft and weak, because it is an absence of light in
  // a fluid rather than a silhouette on a surface.
  ctx.save();
  ctx.filter = "blur(" + (u * 1.5).toFixed(2) + "px)";
  ctx.globalAlpha = 0.34;
  ctx.fillStyle = "#06203a";
  ctx.translate(-lx * u * 1.5, -ly * u * 1.5);
  ctx.fill(p);
  ctx.restore();

  // Side wall, back to front. Warm in shadow: porcelain never goes blue-grey.
  for (let i = steps; i >= 1; i--) {
    const t = i / steps;
    const v = 0.63 + 0.31 * (1 - t);
    ctx.save();
    ctx.translate(-lx * depth * t, -ly * depth * t);
    ctx.fillStyle = "rgb(" + ((224 * v) | 0) + "," + ((220 * v) | 0) + "," +
                    ((213 * v) | 0) + ")";
    ctx.fill(p);
    ctx.restore();
  }

  // Face.
  ctx.fillStyle = axis("#ffffff", "#eceae5");
  ctx.fill(p);

  ctx.save();
  ctx.clip(p);

  // Chamfer: a constant-width band inside every edge.
  ctx.lineWidth = u * 1.15;
  ctx.strokeStyle = axis("rgba(255,255,255,0.98)", "rgba(191,185,175,0.50)");
  ctx.filter = "blur(" + (u * 0.22).toFixed(2) + "px)";
  ctx.stroke(p);

  // Glaze: the tight reflection sitting on the chamfer's lit side.
  ctx.lineWidth = u * 0.42;
  ctx.strokeStyle = axis("rgba(255,255,255,0.98)", "rgba(255,255,255,0)");
  ctx.filter = "blur(" + (u * 0.10).toFixed(2) + "px)";
  ctx.stroke(p);

  /* Subsurface. Porcelain is thin enough at an edge to pass a little light,
   * so the shadow side never reaches neutral grey -- it warms first. */
  ctx.globalCompositeOperation = "source-atop";
  ctx.lineWidth = u * 0.7;
  ctx.strokeStyle = axis("rgba(255,240,222,0)", "rgba(255,228,198,0.30)");
  ctx.filter = "blur(" + (u * 0.34).toFixed(2) + "px)";
  ctx.stroke(p);

  // Broad glaze sheen across the lit half.
  ctx.filter = "none";
  const sheen = ctx.createLinearGradient(cx + lx * r * 1.1, cy + ly * r * 1.1,
                                         cx - lx * r * 0.2, cy - ly * r * 0.2);
  sheen.addColorStop(0, "rgba(255,255,255,0.42)");
  sheen.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = sheen;
  ctx.fill(p);

  ctx.restore();
  ctx.restore();
}

/* -------------------------------------------------------------------- dome
 *
 * A flat pane and a domed one differ in three places, and every one of them
 * is about where the surface normal points rather than about the liquid:
 *
 *  - the rim turns away from you and reflects the room instead of
 *    transmitting, so a dome shades just inside its own edge,
 *  - the reflection of the light source is a band hugging the edge the light
 *    comes from, not a pool in the middle,
 *  - light entering near the far rim leaves brightened, so the edge opposite
 *    the light carries a thin crescent.
 *
 * Every one of those follows the silhouette. The first version of this drew
 * radial gradients centred on the vessel, and a radial gradient laid over a
 * squircle reads as exactly what it is: a disc sitting in the middle of the
 * tile. Curvature has to be drawn where the normal actually turns, which is
 * at the outline -- so everything below is stroked along it.
 *
 * Drawn before the glass layer so its corner knockout still trims this, and
 * scaled by `strength` so the whole effect is one dial.
 */
/** The stretch of outline whose outward normal faces the light, inset toward
 *  the centre. Returned as one open run, so a stroke over it never cuts a
 *  chord across the vessel where the lit arc wraps the array. */
function rimRun(minDot, inset) {
  const n = outline.length, lit = new Array(n);
  for (let i = 0; i < n; i++) {
    const dx = outline[i].x - CX, dy = outline[i].y - CY;
    const m = Math.hypot(dx, dy) || 1;
    lit[i] = (dx / m) * SHADOW_X + (dy / m) * SHADOW_Y > minDot;
  }
  let start = -1;
  for (let i = 0; i < n; i++) if (lit[i] && !lit[(i - 1 + n) % n]) { start = i; break; }
  if (start < 0) return null;
  const pts = [];
  for (let j = 0; j < n; j++) {
    const i = (start + j) % n;
    if (!lit[i]) break;
    pts.push({ x: CX + (outline[i].x - CX) * inset,
               y: CY + (outline[i].y - CY) * inset });
  }
  return pts.length > 1 ? pts : null;
}

function strokeRun(pts, width, blur, style) {
  if (!pts) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = width;
  ctx.strokeStyle = style;
  if (blur > 0) ctx.filter = "blur(" + blur.toFixed(2) + "px)";
  ctx.stroke();
  ctx.restore();
}

function drawDome(k) {
  const near = Math.min(RX, RY);

  /* Shade just inside the whole rim, following the outline. */
  ctx.save();
  ctx.beginPath();
  traceOutline(ctx);
  ctx.filter = "blur(" + (near * 0.075).toFixed(2) + "px)";
  ctx.lineWidth = near * 0.20;
  ctx.strokeStyle = "rgba(8,24,44," + (0.26 * k).toFixed(3) + ")";
  ctx.stroke();
  ctx.restore();

  /* The light's reflection, as a streak running along the lit rim. A dome
   * reflects a source in a band that hugs the edge it is lit from; the blob
   * in the middle this used to draw was the shape of the gradient, not the
   * shape of the surface. */
  strokeRun(rimRun(0.28, 0.80), near * 0.10, near * 0.065,
            "rgba(255,255,255," + (0.55 * k).toFixed(3) + ")");
  strokeRun(rimRun(0.52, 0.86), near * 0.045, near * 0.030,
            "rgba(255,255,255," + (0.50 * k).toFixed(3) + ")");

  /* Light leaving the far rim: the counter-crescent that tells you the thing
   * is solid and curved rather than a hollow ring. */
  ctx.save();
  ctx.beginPath();
  traceOutline(ctx);
  const cres = ctx.createLinearGradient(
    CX + SHADOW_X * RX, CY + SHADOW_Y * RY,
    CX - SHADOW_X * RX, CY - SHADOW_Y * RY);
  cres.addColorStop(0, "rgba(255,255,255,0)");
  cres.addColorStop(0.55, "rgba(255,255,255,0)");
  cres.addColorStop(1, "rgba(255,255,255," + (0.5 * k).toFixed(3) + ")");
  ctx.strokeStyle = cres;
  ctx.lineWidth = near * 0.034;
  ctx.filter = "blur(" + (near * 0.012).toFixed(2) + "px)";
  ctx.stroke();
  ctx.restore();
}

/* Paint the same headspace twice: once as the background and once after the
 * particles. The second pass is a cheap, exact surface mask. It prevents a
 * cached microglitter layer—or a large flake whose centre is submerged but
 * whose corners are not—from flickering through the air pocket during tilt. */
function paintHeadspace(poly) {
  const air = ctx.createLinearGradient(
    CX + displayUp.x * displayUpExtent, CY + displayUp.y * displayUpExtent,
    CX + displayUp.x * displayLevel, CY + displayUp.y * displayLevel);
  air.addColorStop(0, CONFIG.air[0]);
  air.addColorStop(0.45, CONFIG.air[1] || CONFIG.air[0]);
  air.addColorStop(1, CONFIG.air[2] || CONFIG.air[0]);
  ctx.fillStyle = air;
  ctx.beginPath();
  const far = (displaySpan + displayUpExtent) * 2;
  ctx.moveTo(poly[0].x + displayUp.x * far, poly[0].y + displayUp.y * far);
  for (let i = 0; i <= DISPLAY_SURFACE_STEPS; i++) {
    ctx.lineTo(poly[i].x, poly[i].y);
  }
  ctx.lineTo(poly[DISPLAY_SURFACE_STEPS].x + displayUp.x * far,
    poly[DISPLAY_SURFACE_STEPS].y + displayUp.y * far);
  ctx.closePath();
  ctx.fill();
}

/* A moving specular inside the trapped headspace makes its displaced bulge
