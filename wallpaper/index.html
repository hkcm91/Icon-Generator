 * read as one surface bubble rather than an empty strip. It is anchored to
 * the deepest point of the lens, so it follows the inertial offset above. */
function paintSurfaceBubbleGlint(poly) {
  let peak = poly[0], minLift = Infinity;
  for (let i = 0; i <= DISPLAY_SURFACE_STEPS; i++) {
    const lift = (poly[i].x - CX) * displayUp.x +
      (poly[i].y - CY) * displayUp.y;
    if (lift < minLift) { minLift = lift; peak = poly[i]; }
  }
  const depth = displayLevel - minLift;
  if (depth < 4) return;
  const rx = Math.min(displaySpan * 0.38, Math.max(48, depth * 4.2));
  const ry = Math.max(12, Math.min(rx * 0.34, depth * 1.25 + 8));
  const x = peak.x + displayUp.x * depth * 0.46;
  const y = peak.y + displayUp.y * depth * 0.46;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(displayTan.y, displayTan.x));
  /* No outline. A trapped pocket of air seen through glass has no drawn edge:
   * what makes it read as air is a soft interior brightness, one elongated
   * specular off the curved film, and a dark refracted band along its
   * underside where light leaving the liquid is bent away from the eye. The
   * previous full ellipse stroke, crisp arcs and hard white dot read as a
   * diagram of a bubble laid over the picture. Everything here is a gradient
   * with no hard edge. */
  // Interior: brighter and slightly desaturated toward the upper-left.
  const glow = ctx.createRadialGradient(-rx * 0.30, -ry * 0.40, 0, 0, 0, rx);
  glow.addColorStop(0, "rgba(255,255,255,.34)");
  glow.addColorStop(0.35, "rgba(240,250,255,.14)");
  glow.addColorStop(0.80, "rgba(190,230,250,.05)");
  glow.addColorStop(1, "rgba(120,180,230,0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();

  // Underside: a dark refracted band, soft on both edges, hugging the lower
  // rim of the pocket. This is what separates air from a pale smear.
  ctx.save();
  ctx.scale(1, ry / rx);
  const under = ctx.createRadialGradient(0, rx * 0.12, rx * 0.66, 0, rx * 0.12, rx * 1.02);
  under.addColorStop(0, "rgba(20,70,140,0)");
  under.addColorStop(0.55, "rgba(20,70,140,.20)");
  under.addColorStop(0.85, "rgba(30,90,160,.12)");
  under.addColorStop(1, "rgba(30,90,160,0)");
  ctx.fillStyle = under;
  ctx.beginPath(); ctx.arc(0, rx * 0.12, rx * 1.02, 0.06 * Math.PI, 0.94 * Math.PI); ctx.fill();
  ctx.restore();

  // Specular: one soft elongated highlight along the upper film, not a dot.
  ctx.save();
  ctx.translate(-rx * 0.26, -ry * 0.42);
  ctx.rotate(-0.18);
  ctx.scale(1, 0.34);
  const spec = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * 0.42);
  spec.addColorStop(0, "rgba(255,255,255,.72)");
  spec.addColorStop(0.45, "rgba(255,255,255,.28)");
  spec.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = spec;
  ctx.beginPath(); ctx.arc(0, 0, rx * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // A faint, wide, soft brightening along the upper rim in place of the old
  // crisp arc: the film catches light, it is not drawn on.
  ctx.lineCap = "round";
  ctx.lineWidth = Math.max(3, bubbleUnit * 3.2);
  ctx.strokeStyle = "rgba(255,255,255,.10)";
  ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.90, ry * 0.78, 0,
    Math.PI * 1.10, Math.PI * 1.80); ctx.stroke();
  ctx.restore();
}

function drawSurfaceFoam(poly) {
  if (!surfaceFoam.length) return;
  ctx.save();
  ctx.lineCap = "round";
  for (const p of surfaceFoam) {
    const f = Math.max(0, Math.min(DISPLAY_SURFACE_STEPS,
      (p.s + 1) * 0.5 * DISPLAY_SURFACE_STEPS));
    const i = Math.min(DISPLAY_SURFACE_STEPS - 1, Math.floor(f));
    const q = f - i;
    const sx = poly[i].x * (1 - q) + poly[i + 1].x * q;
    const sy = poly[i].y * (1 - q) + poly[i + 1].y * q;
    const t = p.life / p.span;
    const alpha = Math.min(1, t * 8) * Math.pow(1 - t, 0.72);
    const breathe = 1 + Math.sin(p.phase + p.life * 4.2) * 0.035;
    const r = p.r * breathe;
    const x = sx + displayUp.x * r * 0.08;
    const y = sy + displayUp.y * r * 0.08;
    ctx.fillStyle = `rgba(237,250,255,${alpha * 0.18})`;
    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.62})`;
    ctx.lineWidth = Math.max(0.8, bubbleUnit * 0.8);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = `rgba(105,181,230,${alpha * 0.23})`;
    ctx.beginPath(); ctx.arc(x, y, r * 0.72, 0.08 * Math.PI, 0.92 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

/* The render loop deliberately uses no clip() at all.
 *
 * Canvas rasterises a clip against a 100-plus-point path on every use, and
 * the three per-frame clips here (container, liquid body, meniscus glow)
 * cost more than everything else combined — the scene ran at 47fps with
 * zero particles on screen. The container clip is baked into glassLayer's
 * corner knockout, the liquid clip is replaced by culling particles above
 * the waterline, and the meniscus glow simply bleeds a little into the air,
 * which is what a real meniscus does anyway. */
function render(time) {
  const poly = displayLiquidPolygon();
  cacheDisplaySurface(poly);
  /* Microglitter physics runs at 20 Hz. Rebuilding 17,850 path rectangles at
   * the display's 60/120 Hz would waste most of the doubled population's
   * frame budget on identical geometry. */
  if (microPathsDirty) buildMicroPaths();

  /* Liquid body, graded along the gravity axis so the deep blue always sits
   * at the top of the pour no matter how the phone is held. Filled across
   * the whole screen rather than into the liquid polygon: the shaker is
   * ~98% full, so painting the small headspace afterwards is far less
   * overdraw than covering the screen twice. */
  const grad = ctx.createLinearGradient(
    CX + displayUp.x * displayLevel, CY + displayUp.y * displayLevel,
    CX - displayUp.x * displayUpExtent, CY - displayUp.y * displayUpExtent);
  const ramp = CONFIG.ramp;
  for (let i = 0; i < ramp.length; i++) {
    grad.addColorStop(i / (ramp.length - 1), ramp[i]);
  }
  ctx.fillStyle = grad;
  /* Opaque, the fill covers the previous frame on its own. Clear, it does
   * not — so the canvas has to be emptied first or every frame accumulates
   * on the last and the tint walks to opaque within a second. */
  if (CONFIG.glass) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = 1 - CONFIG.glass * 0.86;
  }
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  /* Headspace. Painted as pale tinted air rather than left as page
   * background: white reads as a hole in the wallpaper, which is exactly
   * what made the liquid look like it had drained away.
   *
   * Graded across the air itself, from the inside of the top wall down to
   * the waterline. Spanning the whole container instead left the thin band
   * sampling one end of the ramp, so it rendered as a flat grey slab that
   * read like a UI bar sitting on top of the wallpaper. */
  const air = ctx.createLinearGradient(
    CX + up.x * upExtent, CY + up.y * upExtent,
    CX + up.x * level, CY + up.y * level);
  air.addColorStop(0, CONFIG.air[0]);            // inner top wall, shadowed
  air.addColorStop(0.45, CONFIG.air[1] || CONFIG.air[0]);
  air.addColorStop(1, CONFIG.air[2] || CONFIG.air[0]);  // liquid through the meniscus
  ctx.fillStyle = air;
  ctx.beginPath();
  const far = (span + upExtent) * 2;
  ctx.moveTo(poly[0].x + up.x * far, poly[0].y + up.y * far);
  for (let i = 0; i <= 64; i++) ctx.lineTo(poly[i].x, poly[i].y);
  ctx.lineTo(poly[64].x + up.x * far, poly[64].y + up.y * far);
  ctx.closePath();
  // Air in a clear vessel is the emptiest thing in it: almost all of this
  // has to go, or the headspace reads as a solid pale cap.
  if (CONFIG.glass) ctx.globalAlpha = 1 - CONFIG.glass * 0.9;
  ctx.fill();
  ctx.globalAlpha = 1;

  paintHeadspace(poly);

  /* Capture the liquid itself for the glass rim before any particles are
   * painted. Sampling the completed glitter frame copied every bright flake
   * into four compressed bezel bands, creating the vertical white flashes
   * seen on the phone whenever a dense cloud reached an edge. */
  bezelCapture(Math.min(RX, RY) * BEZEL_T);

  const menisc = meniscus(poly, 64);   // array of interface segments

  /* Depth pass one: everything behind the mid-plane of the pouch, drawn
   * before the liquid tint so the tint falls over it. Light from a flake at
   * the back wall crosses the full thickness of liquid before it reaches
   * the eye, and gets absorbed and colour-shifted on the way; putting those
   * flakes under the tint layer is that absorption, for free. */
  // Behind the mid-plane: seen through the full thickness of the liquid, so
  // out of focus and washed toward the liquid's own colour.
  farField = true;
  drawMicro(false);
  drawParticles(0, starSplit, 0, bubbleSplit, time);
  farField = false;

  /* The dense phase, blitted from the grid and left to the browser's
   * bilinear upscale to smooth. At this grid size that reads as soft
   * marbling — which is what an unmixed second liquid looks like. */
  const dd = dyeImage.data;
  for (let i = 0, n = GW * GH; i < n; i++) {
    let v = dye[i];
    if (v < 0) v = 0; else if (v > 1) v = 1;
    dd[i * 4] = DENSE.r; dd[i * 4 + 1] = DENSE.g; dd[i * 4 + 2] = DENSE.b;
    // Thinned with the rest of the fluid. Left at full strength this is the
    // densest layer in a clear vessel by some margin, and it alone holds the
    // tile at about half opacity however far the dial is turned.
    dd[i * 4 + 3] = (v * DYE_ALPHA) | 0;
  }
  dyeCtx.putImageData(dyeImage, 0, 0);
  ctx.drawImage(dyeCanvas, 0, 0, W, H);

  ctx.drawImage(depthLayer, 0, 0, W, H);

  /* The mark sits here, at the mid-plane: after the far-field flakes and the
   * liquid tint that washes them, before the caustics that fall across it and
   * the near-field flakes that drift in front. That ordering is the whole
   * illusion — glitter passing on both sides of it is what makes it read as
   * suspended in the liquid rather than printed on the glass. */
  if (CONFIG.glyph) {
    drawGlyph(CONFIG.glyph, CX, CY, Math.min(RX, RY) * CONFIG.glyphScale);
  }

  /* Caustics. The free surface is a lens: where it curves concave it
   * converges the light passing through into a bright shaft in the body
   * below, and where convex it spreads it thin. It is the strongest depth
   * cue a real liquid container has — light arriving through the top and
   * structuring the volume underneath — and without it the body is evenly
   * lit everywhere, which is what made it read flat.
   *
   * Drawn in the gravity frame, so the shafts hang straight down however
   * the phone is held, and added rather than blended because this is light
   * arriving, not a surface. Curvature is taken over a wide stencil: a lens
   * is metres of surface, not one sample.
   */
  /* Drawn small and blitted once.
   *
   * Nineteen full-height additive blits straight onto the canvas cost 8ms a
   * frame in paint — about a whole extra full-screen pass — for shafts that
   * are soft-edged and carry no fine detail. At a fraction of the
   * resolution the upscale supplies the softness for free.
   */
  const cg = causticCtx;
  cg.clearRect(0, 0, CAUSTIC_W, CAUSTIC_H);
  /* The band the shafts actually occupy: from a little above the crest down
   * to where the light has faded out. Blitting the full container instead
   * meant a whole-screen additive composite every frame, and in software
   * rasterisation that alone is most of the frame budget. */
  const lightLevel = displayLevel + (level - displayLevel) * motionActivity;
  const bandTop = -(lightLevel + upExtent * 0.18);
  const bandH = upExtent * 1.33;
  const reach = upExtent * 1.15;
  const pitch = 2 * span / (N - 1);
  const toX = (v) => (v + span) / (2 * span) * CAUSTIC_W;
  const toY = (v) => (v - bandTop) / bandH * CAUSTIC_H;
  for (let i = 2; i < N - 2; i += 5) {
    const curv = h[i - 2] + h[i + 2] - 2 * h[i];
    /* Irregular by construction. Evenly spaced shafts of equal width read
     * as a machined pattern; two incommensurate frequencies plus a
     * per-shaft width give the uneven spacing real caustics have. */
    const seed = Math.sin(i * 12.9898) * 43758.5453;
    const jitter = seed - Math.floor(seed);
    const shimmer = 0.032 * Math.sin(time * 0.41 + i * 0.29)
                  + 0.022 * Math.sin(time * 0.23 - i * 0.73);
    const amb = 0.052 + shimmer * motionActivity;
    const a = Math.max(0, Math.min(0.16,
      amb * 0.72 + curv * 0.007 * motionActivity));
    if (a < 0.012) continue;
    const w = pitch * (5 + jitter * 7);
    const sx = -span + 2 * span * (i / (N - 1)) + (jitter - 0.5) * pitch * 4;
    const surfaceLift = displayLevel +
      (level + h[i] - displayLevel) * motionActivity;
    const sy = -surfaceLift;
    cg.globalAlpha = a;
    cg.drawImage(shaftSprite, toX(sx - w / 2), toY(sy),
                 w / (2 * span) * CAUSTIC_W, reach / bandH * CAUSTIC_H);
  }
  cg.globalAlpha = 1;

  ctx.save();
  ctx.transform(tan.x, tan.y, -up.x, -up.y, CX, CY);
  ctx.globalCompositeOperation = "lighter";
  ctx.drawImage(causticCanvas, -span, bandTop, 2 * span, bandH);
  ctx.restore();

  // Light pooling just under the surface, the way it does in a real pouch.
  const under = ctx.createLinearGradient(
    CX + displayUp.x * displayLevel, CY + displayUp.y * displayLevel,
    CX + displayUp.x * (displayLevel - displayUpExtent * 0.55),
    CY + displayUp.y * (displayLevel - displayUpExtent * 0.55));
  under.addColorStop(0, "rgba(255,255,255,.20)");
  under.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = under;
  ctx.fillRect(0, 0, W, H);

  /* Depth. A flat gradient reads as a printed colour; a real body of liquid
   * gets deeper and darker with distance from the light, which enters at
   * the top, and toward the glass at the sides. Two multiplied gradients:
   * one down the gravity axis into the bottom third, one radial toward the
   * edges. Multiply deepens the blue rather than greying it. */
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  const deep = ctx.createLinearGradient(
    CX + displayUp.x * (displayLevel - displayUpExtent * 0.75),
    CY + displayUp.y * (displayLevel - displayUpExtent * 0.75),
    CX - displayUp.x * displayUpExtent, CY - displayUp.y * displayUpExtent);
  deep.addColorStop(0, "rgba(255,255,255,1)");
  deep.addColorStop(1, "rgba(150,178,222,1)");
  ctx.fillStyle = deep;
  ctx.fillRect(0, 0, W, H);
  const edge = ctx.createRadialGradient(CX, CY, Math.min(RX, RY) * 0.55,
    CX, CY, Math.hypot(RX, RY) * 1.02);
  edge.addColorStop(0, "rgba(255,255,255,1)");
  edge.addColorStop(1, "rgba(172,196,232,1)");
  ctx.fillStyle = edge;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // Depth pass two: everything in front of the mid-plane, over the tint.
  drawMicro(true);
  drawParticles(starSplit, stars.length, bubbleSplit, bubbles.length, time);

  /* Reassert the exact visible air lens after every depth pass. Particle
   * physics can lag or lead this deliberately damped display surface, but no
   * glitter pixel is allowed to flash through the headspace. */
  paintHeadspace(poly);
  paintSurfaceBubbleGlint(poly);
  drawSurfaceFoam(poly);

  /* Meniscus. Three passes: a soft glow bleeding down into the liquid, the
   * bright surface line itself, and a thin darker line above it. One flat
   * stroke reads as a drawn border; this reads as a liquid surface.
   *
   * It is stroked over `menisc`, not the raw surface, because the raw
   * surface runs the full tangent span whether or not the vessel is that
   * wide there. Near the top the container has already curved inward, so
   * the line carried on past the glass and was chopped off by the corner
   * knockout — reading as a hard clip straight across the top of the frame.
   */
  /* The interface is a band, not a line.
   *
   * The pouch has depth, so the air-liquid surface is a real surface seen
   * almost edge-on: it presents a band whose height is roughly the pouch's
   * thickness foreshortened, brightened along its lower edge by light
   * piping through the wedge of liquid under the meniscus. Drawn as a
   * hairline it read as a stroke somebody had drawn on top of the picture.
   */
  const band = Math.max(5, Math.min(RX, RY) * 0.022);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for (const seg of menisc) {
    const path = (off, dx = 0, dy = 0) => {
      ctx.beginPath();
      appendSmooth(seg, off, false, true, dx, dy);
    };

    /* Back edge of the liquid's top plane. It separates from the front rim
     * only as the phone tilts, turning a drawn waterline into a shallow
     * translucent surface with visible thickness. */
    const rearX = (parallaxX(-1) - parallaxX(1)) * 0.28;
    const rearY = (parallaxY(-1) - parallaxY(1)) * 0.28;
    if (Math.hypot(rearX, rearY) > 0.5) {
      ctx.beginPath();
      appendSmooth(seg, 0, false, true, rearX, rearY);
      appendSmooth(seg, 0, true, false);
      ctx.closePath();
      ctx.fillStyle = "rgba(220,246,255,.14)";
      ctx.fill();
      ctx.strokeStyle = "rgba(120,183,215,.26)";
      ctx.lineWidth = Math.max(1, RX * 0.003);
      path(0, rearX, rearY); ctx.stroke();
    }

    // Body of the band: the lit wedge of liquid held under the surface.
    ctx.beginPath();
    appendSmooth(seg, 0, false, true);
    appendSmooth(seg, -band, true, false);
    ctx.closePath();
    const mid = seg[(seg.length / 2) | 0];
    const g = ctx.createLinearGradient(
      mid.x, mid.y, mid.x - displayUp.x * band, mid.y - displayUp.y * band);
    g.addColorStop(0, "rgba(255,255,255,.54)");
    g.addColorStop(0.45, "rgba(214,244,255,.26)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fill();

    // Soft bloom above, into the air.
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.lineWidth = band * 0.9;
    path(band * 0.45); ctx.stroke();

    // The bright rim itself, and a thin shaded edge just above it.
    ctx.strokeStyle = "rgba(255,255,255,.76)";
    ctx.lineWidth = Math.max(1.4, RX * 0.006);
    path(0); ctx.stroke();

    ctx.strokeStyle = "rgba(126,180,208,.5)";
    ctx.lineWidth = Math.max(1, RX * 0.0035);
    path(band * 0.42); ctx.stroke();

    /* And a dark refracted line just under the bright rim, inside the
     * liquid. Seen from the front, the underside of an air-liquid interface
     * bends light away from the eye, so a real waterline carries a thin
     * shadow beneath its highlight. Without it the rim floats. */
    ctx.strokeStyle = "rgba(18,64,130,.30)";
    ctx.lineWidth = Math.max(1.2, RX * 0.0045);
    path(-band * 0.18); ctx.stroke();
  }
  ctx.lineCap = "butt";
  ctx.lineJoin = "miter";

  // Glass shell, casing edge and corner knockout, all baked at resize.
  drawBezel();
  if (CONFIG.dome) drawDome(CONFIG.dome);
  ctx.drawImage(glassLayer, 0, 0, W, H);
}

/* -------------------------------------------------------------------- step */

/* Fixed timestep.
 *
 * Scaling every force by dt is not enough to make this frame-rate
 * independent, and measurement said so: driving the same 2s of shaking at
 * 30fps and at 60fps left the flow energy 21.6% apart. Semi-Lagrangian
 * advection smears a fixed amount per *step*, and the pressure solve does a
 * fixed number of iterations per *step*, so both get twice the treatment at
 * twice the frame rate no matter how carefully dt is applied.
 *
 * Running the simulation on a fixed tick and accumulating real elapsed time
 * is the only thing that actually fixes it. The cap keeps a stalled tab from
 * trying to catch up across a huge gap.
 */
/* The carrier is intentionally viscous, so its response bandwidth is well
 * below 30Hz. At 45Hz on the S24, one missed presentation frame accumulated
 * a second physics tick; that catch-up work then missed the next frame and
 * locked the otherwise 60Hz compositor into a 30Hz cycle. A fixed 30Hz
 * solver with 60Hz presentation alternates a 13ms physics+render frame with
 * a 6ms render-only frame and remains deterministic. */
const FIXED_DT = 1 / 30;
let accumulator = 0;
let simTime = 0;
let microTick = 0;

function step(dt) {
  accumulator += dt;
  let ticks = 0;
  while (accumulator >= FIXED_DT && ticks < 4) {
    simTime += FIXED_DT;
    fixedStep(FIXED_DT, simTime);
    accumulator -= FIXED_DT;
    ticks++;
  }
  if (ticks === 4) accumulator = 0;   // fell too far behind; drop the debt
  return simTime;
}

function fixedStep(dt, time) {
  updateBasis();
  /* A real face-over-face flip announces itself first through the screen
   * axis, before the filtered in-plane gravity has completed its reversal.
   * Arm the cross-flow guard from that motion immediately; waiting for the
   * basis to jump by pi lets the gravity filter's transient masquerade as a
   * sideways shake for several hundred milliseconds. */
  /* Z translation is not automatically a flip. The old cue armed this guard
   * for every fore-aft shake and the guard's broad wall return squeezed the
   * glitter into a central column. A real face-over-face inversion has both
   * Z acceleration and gravity pointing through the screen, so require the
   * two signals together; the later pi-angle check remains the hard fallback. */
  const faceOn = Math.max(0, Math.min(1, (Math.abs(gravZ) - 0.32) / 0.55));
  inversionGuard = Math.max(inversionGuard,
    faceOn * Math.min(1, Math.abs(accel.z) * 1.8));
  /* Detect the completed orientation change as well as the acceleration that
   * caused it. A slow flip can pass face-on with almost no residual Z shake;
   * remember the incoming gravity and arm the cascade only if the phone exits
   * face-on pointing substantially the other way. Returning from a flat table
   * in the same orientation does nothing. */
  if (faceOn > 0.58 && !flipArmed) {
    flipArmed = true;
    flipStartX = gDir.x; flipStartY = gDir.y;
  } else if (flipArmed && faceOn < 0.22 && gMag > 0.62) {
    if (gDir.x * flipStartX + gDir.y * flipStartY < -0.45) {
      inversionGuard = 1;
      pileFill *= 0.08;
      cascadeSpreadHold = 1;
      cascadeLanePolarity *= -1;
    }
    flipArmed = false;
  }
  cascadeSpreadHold = Math.max(cascadeSpreadHold, inversionGuard);
  const inputActivity = Math.min(1,
    Math.hypot(accel.x, accel.y, accel.z) * 0.72 +
    Math.abs(swirlInput) * 0.45 + basisKick);
  const activityEase = inputActivity > motionActivity ? 0.20 : 0.012;
  motionActivity += (inputActivity - motionActivity) * activityEase;
  if (motionActivity < 0.004) motionActivity = 0;
  const cascadeEase = inputActivity > cascadeActivity ? 0.16 : 0.0032;
  cascadeActivity += (inputActivity - cascadeActivity) * cascadeEase;
  if (cascadeActivity < 0.004) cascadeActivity = 0;
  basisKick *= 0.74;
  inversionGuard *= Math.exp(-dt / 2.4);
  // Preserve each flake's broad release lane for most of its fall. Five
  // seconds expired while the cloud was still near the old floor, allowing
  // residual cross-flow to sweep the rest into the two corners.
  cascadeSpreadHold *= Math.exp(-dt / 15);
  fluidStep(dt);
  stepWaves(dt);

  // Volume conservation: nudge the level until the drawn liquid area matches
  // the target. A feedback loop is far cheaper than solving the tilted
  // squircle's area analytically, and settles within a few frames.
  /* Project the free surface back to the exact sealed volume every tick.
   * A feedback nudge spread over several seconds is visibly wrong here: a
   * vigorous shake can make a sealed 97.5%-full toy appear one-third empty
   * before the controller catches up. Ceiling-contact columns remain pinned
   * to the glass; only the exposed air-liquid lens moves. Its tangent width
   * is the derivative d(area)/d(level), so this is a small Newton solve. */
  for (let solve = 0; solve < 3; solve++) {
    const clipped = clipToContainer(liquidPolygon());
    if (clipped.length < 3) break;
    const error = polygonArea(clipped) - targetArea;
    if (Math.abs(error) < Math.max(3, targetArea * 0.00005)) break;
    let free = 0;
    for (let i = 0; i < N; i++) {
      const cap = surfaceRoof[i] - Math.max(1.5, Math.min(RX, RY) * 0.004);
      if (level + h[i] < cap - 0.9) free++;
    }
    const freeWidth = Math.max(2 * span / (N - 1) * 2,
      free / (N - 1) * 2 * span);
    const oldLevel = level;
    let delta = -error / freeWidth;
    const maxDelta = upExtent * 0.16;
    delta = Math.max(-maxDelta, Math.min(maxDelta, delta));
    level += delta;
    for (let i = 0; i < N; i++) {
      const cap = surfaceRoof[i] - Math.max(1.5, Math.min(RX, RY) * 0.004);
      const wasContact = oldLevel + h[i] >= cap - 0.9;
      if (wasContact || level + h[i] > cap) h[i] = cap - level;
    }
    const limit = upExtent * 1.35;
    level = Math.max(-limit, Math.min(limit, level));
  }

  const pad = Math.min(RX, RY) * 0.03;
  // Glitter lives in the liquid, not inside the thick refractive rim. Keep
  // its centres just beyond that optical boundary so a settled bed remains a
  // soft layer instead of becoming a one-pixel white seam on the glass.
  const glitterPad = Math.min(RX, RY) * 0.082;

  /* A grain touching the glass is in contact, not in free suspension, so it
   * sheds under gravity at its own rate rather than at the body's. Without
   * this floor the wall slide inherits `settleRate`, which drops to 0.12 once
   * the toy is left alone — slow enough that a grain pinned to the glass by a
   * shake never comes down. Measured over 150s at rest, the outer band went on
   * accumulating (14% -> 34% of all glitter) and drew two bright stripes down
   * the sides; the microglitter did it alone, the hero flakes never did.
   * Raising the body's own settleRate fixes it too, but at the cost of the
   * hanging drift this whole layer exists for.
   *
   * This slows the trap rather than defeating it. Paired over six seeds
   * (same shake, +30s to +150s at rest): the outer band grew by +13pp on
   * average without the floor and shrank by 3pp with it, lower in every
   * seed — but three of the six still climbed. The delivery mechanism is
   * the post-shake recirculation, which this does not touch. */
  const WALL_SHED_RATE = 0.5;

  /* Wall response. Reflecting the inward correction and keeping the
   * tangential component lets flakes slide along the glass; the old blanket
   * 65% velocity cut plus a nudge toward the centre killed all energy at the
   * wall and welded settled flakes into a hard line along the rim. */
  const hitWall = (p, attemptedX, attemptedY) => {
    /* `clampInside` has already moved the attempted point back into the
     * chamber, so this correction is the actual local inward wall normal.
     * Using the previous frame's point here mistook downward travel along a
     * side wall for the normal, cancelled it, and made glitter cling. */
    const dx = p.x - attemptedX, dy = p.y - attemptedY;
    const len = Math.hypot(dx, dy);
    if (len < 1e-6) return;
    const nx = dx / len, ny = dy / len;           // points back inside
    const vn = p.vx * nx + p.vy * ny;
    if (vn < 0) { p.vx -= vn * nx * 1.15; p.vy -= vn * ny * 1.15; }

    /* Low-Re oblate particles near a wall exhibit glancing and sliding
     * trajectories rather than becoming glued to it. Preserve the component
     * of gravity tangent to a lateral wall and add a small lubrication-like
     * separation. At the downhill floor `side` is zero, so a real bed can
     * still form instead of bouncing forever. */
    const gn = gDir.x * nx + gDir.y * ny;
    const side = Math.max(0, 1 - Math.abs(gn) / 0.72);
    if (side > 0 && p.density > 0) {
      const slide = p.terminal * p.settleScale * p.density * gMag *
        Math.max(settleRate, WALL_SHED_RATE);
      const gx = gDir.x - nx * gn, gy = gDir.y - ny * gn;
      p.vx += (gx * 0.42 + nx * 0.14) * slide * side;
      p.vy += (gy * 0.42 + ny * 0.14) * slide * side;
      const release = Math.min(1.5, Math.max(0.35, p.r * 0.12)) * side;
      p.x += nx * release; p.y += ny * release;
    }
  };

  /* Which way is up, for the bubbles' refracted interiors. Gravity, not the
   * shake: what a bubble is looking through is the liquid's own colour
   * gradient, and that is anchored to gravity. */
  riseAngle = Math.atan2(gDir.y, gDir.x) + Math.PI * 1.5;
  const gAng = Math.atan2(gDir.y, gDir.x);
  // Internal convection must not keep a resting toy in perpetual motion. A
  // shake opens the coupling immediately, then it closes over a few seconds
  // as the viscous carrier settles.
  const particleFlow = 0.015 + 0.985 * motionActivity;
  // Even a quiet toy keeps sedimenting smoothly. The old 7% floor looked
  // frozen once the post-shake tail ended; 12% remains viscous without
  // turning sensor noise back into visible jitter.
  const settleRate = 0.12 + 0.88 * cascadeActivity;

  let settledHeroes = 0;
  for (const p of stars) {
    sampleFlow(p.x, p.y, flow);
    /* A face-over-face inversion leaves the old convection field expressed
     * in screen coordinates while gravity has reversed. Let its component
     * parallel to the new fall continue carrying flakes, but fade the stale
     * cross-flow briefly; otherwise opening particle coupling on the flip
     * sweeps the whole suspension sideways before it can fall. */
    const crossKeep = (1 - inversionGuard) * (1 - inversionGuard) *
      (1 - 0.86 * cascadeSpreadHold);
    let fallX = gDir.x, fallY = gDir.y;
    // Once an inversion has landed nearly upright, discard the last few
    // degrees of cross-axis filter residue instead of letting it pull the
    // settling bed sideways for several seconds.
    if (Math.abs(fallX) < 0.12 && Math.abs(fallY) > 0.88) {
      fallX = 0; fallY = Math.sign(fallY);
    }
    const flowAlong = flow.x * fallX + flow.y * fallY;
    const carriedX = fallX * flowAlong + (flow.x - fallX * flowAlong) * crossKeep;
    const carriedY = fallY * flowAlong + (flow.y - fallY * flowAlong) * crossKeep;

    /* A real glycerol shaker is a deliberately slow sedimentation display:
     * most PET foil is denser than its carrier and cascades down after a flip.
     * A small near-neutral/buoyant minority keeps the body alive instead of
     * collapsing into one mechanically perfect layer. Terminal velocity is
     * relative to the fluid; small flakes reach it almost immediately.
     *
     * Driven by gravity alone, not gravity plus the shake. Feeding the
     * container's acceleration in here as well double-counts it: relaxing
     * toward `flow` already makes a flake lag a fluid that is being thrown
     * about, and that lag *is* a particle's response to acceleration.
     */
    /* Flutter as a consequence of orientation rather than a free sine. A
     * plate moving through liquid tips, the lift from tipping pushes it
     * sideways, which tips it back — so the sideways force follows the
     * flake's own angle to gravity, and stops when the flake stops turning. */
    /* A falling foil plate alternately stalls broadside and slips edge-on.
     * Advance its flutter clock from actual travel, not wall time: a falling
     * flake rocks, while a flake that has reached the glass becomes still. */
    const speed = Math.hypot(p.vx, p.vy);
    const flutterDrive = Math.min(1, speed / (p.terminal * 0.55 + 5));
    p.flutterClock += p.flutterRate * flutterDrive * dt;
    const flut = Math.sin(p.flutterClock + p.flutterPhase +
                          2 * (p.spin - gAng)) * p.flutterAmp * gMag * flutterDrive;
    sampleDisperse(p.x, p.y, disperse);
    /* A flake is a plate, not a sphere. Broadside to its travel it presents
     * its whole area to the liquid and creeps; edge-on it presents almost
     * none and slips. Its speed therefore depends on which way it happens to
     * be pointing, and since the spin comes from the local vorticity, the
     * liquid is what decides. That is the stop-start quality of real glitter
     * drifting — it stalls as it turns broadside and slips as it comes
     * round — where a constant terminal speed gives an even glide.
     * Normalised so the population's average rate is unchanged: this adds
     * spread, it does not empty the body faster. */
    const broad = Math.abs(Math.cos(p.spin - gAng));
    /* Hindered rise. A flake climbing through a crowd of other flakes has to
     * drag the liquid they displace down past itself, so a dense suspension
     * moves far slower than a dilute one — Richardson and Zaki's (1 - phi)
     * to roughly 4.5 for non-Brownian low-Re particles. It is why a
     * separating suspension forms a sharp front,
     * with clearing liquid behind it and a packing drift ahead, rather than
     * thinning out evenly everywhere. It is also self-limiting, which is
     * what stops the drift under the waterline collapsing into a single
     * hard line: the more crowded it gets there, the slower the next arrival
     * pushes in. */
    /* A flake must not hinder itself. The concentration field is built by
     * dropping each flake's whole area into the cell it sits in, and a big
     * flake covers several cells' worth on its own — 35px of radius against
     * a 14px cell is a solid fraction of nineteen, which pins it to a dead
     * stop in liquid that is otherwise empty. Measured, the big flakes were
     * the slowest thing in the shaker, moving 0.518 to 0.460 over a minute
     * while the fine glitter that is supposed to trail them went 0.473 to
     * 0.336. Hindrance is what the *other* particles do to you. */
    const own = Math.PI * p.r * p.r / (cell * cell) * CONC_DEPTH_SCALE;
    const freeFraction = Math.max(0,
      1 - Math.max(0, sampleConc(p.x, p.y) - own) / PHI_MAX);
    /* Crowding slows sedimentation, but a loose glitter bed is not cement.
     * The former zero let a transient projected overlap become permanent and
     * then catch every later flake. Preserve hindered settling while retaining
     * a slow squeeze-through velocity in the most crowded cells. */
    const hind = HIND_FLOOR + (1 - HIND_FLOOR) * Math.pow(freeFraction, 2.4);
    const drift = p.terminal * p.settleScale * p.density * gMag * settleRate *
                  (1.573 / (1 + 0.9 * broad)) * hind;
    /* Dispersion is a perturbation on the drift, not a transport in its own
     * right, and left unbounded it does not stay one. A stronger climb
     * sharpens the gradient, a sharper gradient strengthens the dispersion
     * pushing back, and past a point the two start trading pushes: raising
     * the pair by a factor of 1.6 took the median flake from 8px/s to
     * 149px/s, which is not settling faster, it is vibrating. Capping it at
     * twice the flake's own rise keeps it in the role it is there for. */
    let dx = disperse.x * DISPERSE, dy = disperse.y * DISPERSE;
    const dm = Math.hypot(dx, dy), cap = DISPERSE_CAP;
    if (dm > cap) { const q = cap / dm; dx *= q; dy *= q; }
    const disperseFlow = 0.05 + 0.95 * motionActivity;
    dx *= disperseFlow; dy *= disperseFlow;
    sampleGasAvoid(p.x, p.y, gasAvoid);
    const voidSlip = 10 + motionActivity * 24;
    dx += gasAvoid.x * voidSlip;
    dy += gasAvoid.y * voidSlip;
    let tx = carriedX * particleFlow + fallX * drift - fallY * flut + dx;
    let ty = carriedY * particleFlow + fallY * drift + fallX * flut + dy;

    /* Release the lateral glass boundary layer. Gravity is allowed to build a
     * bed on the downhill wall, but the tangent edges get a soft carrier
     * return toward the body so glitter cannot remain pasted to both sides. */
    const along = (p.x - CX) * tan.x + (p.y - CY) * tan.y;
    /* A rested bed should release as a broad curtain after a true
     * face-over-face flip. Briefly damp only the cross-gravity velocity so
     * every part of the settled bed falls from the column it already occupied.
     * Pulling position toward the centre made repeat flips collapse into one
     * narrow stream even though a fresh seed correctly covered the glass. */
    const cascadeStraighten = cascadeSpreadHold *
      (p.density > 0 ? 0.96 : 0.78);
    const cascadeCross = tx * tan.x + ty * tan.y;
    tx -= tan.x * cascadeCross * cascadeStraighten;
    ty -= tan.y * cascadeCross * cascadeStraighten;
    const laneError = along - p.releaseLane * cascadeLanePolarity * span;
    const laneReturn = laneError * cascadeSpreadHold *
      (p.density > 0 ? 0.32 : 0.15);
    tx -= tan.x * laneReturn;
    ty -= tan.y * laneReturn;
    /* At rest only discourage flakes from entering the last sliver against
     * the glass. During a face-over-face flip the guard deliberately widens
     * this return zone, preventing the stale cross-flow from sweeping the
     * whole population onto the side walls. Keeping the old wide zone active
     * at rest squeezed every fresh spawn into a central column. */
    const sideStart = span * (0.86 - 0.04 * inversionGuard);
    const sideDepth = Math.max(0, Math.abs(along) - sideStart);
    if (sideDepth > 0) {
      const wallReturn = Math.sign(along) * sideDepth *
        (0.90 + 1.25 * motionActivity + 1.6 * inversionGuard);
      tx -= tan.x * wallReturn;
      ty -= tan.y * wallReturn;
    }

    /* The surface is a ceiling. Buoyancy would otherwise carry the glitter
     * straight through the waterline and into the headspace, where there is
     * no liquid to hold it up. */
    const depth = depthOf(p.x, p.y);
    if (depth > -p.r) {
      const into = tx * up.x + ty * up.y;
      if (into > 0) { tx -= up.x * into; ty -= up.y * into; }
    }

    const k = 1 - Math.exp(-dt / p.tau);
    p.vx += (tx - p.vx) * k;
    p.vy += (ty - p.vy) * k;

    // Third law: whatever drag the liquid applied to the flake, the flake
    // applies back. Settling glitter displaces carrier upward and gives the
    // suspension its slow recirculating plumes.
    scatterForce(p.x, p.y, (flow.x - p.vx) * p.mass * COUPLE,
                           (flow.y - p.vy) * p.mass * COUPLE);
    depositConc(p.x, p.y, p.r * p.r * Math.PI);

    p.x += p.vx * dt; p.y += p.vy * dt;
    const attemptedX = p.x, attemptedY = p.y;
    // Half the local vorticity is the rotation rate of a fluid element,
    // and a small suspended particle simply goes with it.
    p.spin += (0.5 * sampleCurl(p.x, p.y) * particleFlow +
               p.spinRate * 6 * flutterDrive) * dt;
    if (clampInside(p, glitterPad)) hitWall(p, attemptedX, attemptedY);
    if (clampUnderSurface(p, Math.max(0.5, p.r * 0.35))) clampInside(p, glitterPad);
    if (clampAbovePile(p, glitterPad + p.r * 0.22, dt)) settledHeroes++;
    stepDepth(p, dt, 0.82);
  }

  // Grow only from grains that really reached support. The slow attack makes
  // incoming flakes accumulate layer by layer; the quicker release prevents a
  // stale invisible mound from holding them up after the bed is disturbed.
  const settledFraction = settledHeroes / Math.max(1, stars.length);
  const pileTarget = Math.max(0, Math.min(1,
    (settledFraction - 0.008) / 0.13));
  const pileTau = pileTarget > pileFill ? 1.35 : 0.48;
  pileFill += (pileTarget - pileFill) * (1 - Math.exp(-dt / pileTau));

  /* The micro layer runs at 15 Hz. Its grains are sub-pixel flecks with short
   * response times, so display interpolation hides the reduced physics rate. */
  microTick++;
  if (microTick % 2 === 0) {
    const mdt = dt * 2;
    for (const p of microGlitter) {
      sampleFlow(p.x, p.y, flow);
      const crossKeep = (1 - inversionGuard) * (1 - inversionGuard) *
        (1 - 0.90 * cascadeSpreadHold);
      let fallX = gDir.x, fallY = gDir.y;
      if (Math.abs(fallX) < 0.12 && Math.abs(fallY) > 0.88) {
        fallX = 0; fallY = Math.sign(fallY);
      }
      const flowAlong = flow.x * fallX + flow.y * fallY;
      const carriedX = fallX * flowAlong + (flow.x - fallX * flowAlong) * crossKeep;
      const carriedY = fallY * flowAlong + (flow.y - fallY * flowAlong) * crossKeep;
      const drift = p.terminal * p.settleScale * p.density * gMag * settleRate;
      let tx = carriedX * particleFlow + fallX * drift;
      let ty = carriedY * particleFlow + fallY * drift;
      sampleGasAvoid(p.x, p.y, gasAvoid);
      const voidSlip = 7 + motionActivity * 18;
      tx += gasAvoid.x * voidSlip;
      ty += gasAvoid.y * voidSlip;
      const along = (p.x - CX) * tan.x + (p.y - CY) * tan.y;
      const cascadeStraighten = cascadeSpreadHold *
        (p.density > 0 ? 0.985 : 0.84);
      const cascadeCross = tx * tan.x + ty * tan.y;
      tx -= tan.x * cascadeCross * cascadeStraighten;
      ty -= tan.y * cascadeCross * cascadeStraighten;
      const laneError = along - p.releaseLane * cascadeLanePolarity * span;
      const laneReturn = laneError * cascadeSpreadHold *
        (p.density > 0 ? 0.45 : 0.20);
      tx -= tan.x * laneReturn;
      ty -= tan.y * laneReturn;
      const sideStart = span * (0.86 - 0.04 * inversionGuard);
      const sideDepth = Math.max(0, Math.abs(along) - sideStart);
      if (sideDepth > 0) {
        const wallReturn = Math.sign(along) * sideDepth *
          (0.90 + 1.25 * motionActivity + 1.6 * inversionGuard);
        tx -= tan.x * wallReturn;
        ty -= tan.y * wallReturn;
        /* Stuck-grain recycling, see MICRO_WALL_DWELL. Only counts while the
         * toy is at rest and the grain is above the bed: a shake legitimately
         * throws glitter onto the glass, and the corners of a settled bed are
         * real. */
        const vert = ((p.x - CX) * up.x + (p.y - CY) * up.y) / upExtent;
        if (motionActivity < 0.15 && vert > -0.78) {
          p.wallDwell = (p.wallDwell || 0) + mdt;
          if (p.wallDwell > MICRO_WALL_DWELL &&
              Math.random() < mdt * MICRO_WALL_RECYCLE) {
            // Back into the body, away from either wall, to fall again.
            settleSpawn(p, Math.max(1, p.r), 1.0);
            const a2 = (p.x - CX) * tan.x + (p.y - CY) * tan.y;
            if (Math.abs(a2) > span * 0.7) {
              const s2 = Math.sign(a2) * span * (0.2 + Math.random() * 0.5);
              p.x += tan.x * (s2 - a2); p.y += tan.y * (s2 - a2);
              clampInside(p, glitterPad);
            }
            p.vx = 0; p.vy = 0; p.wallDwell = 0;
            continue;
          }
        } else {
          p.wallDwell = 0;
        }
      } else {
        p.wallDwell = 0;
      }
      const depth = depthOf(p.x, p.y);
      if (depth > -p.r) {
        const into = tx * up.x + ty * up.y;
        if (into > 0) { tx -= up.x * into; ty -= up.y * into; }
      }
      const k = 1 - Math.exp(-mdt / 0.055);
      p.vx += (tx - p.vx) * k;
      p.vy += (ty - p.vy) * k;
      p.x += p.vx * mdt; p.y += p.vy * mdt;
      const attemptedX = p.x, attemptedY = p.y;
      if (clampInside(p, glitterPad)) hitWall(p, attemptedX, attemptedY);
      if (clampUnderSurface(p, Math.max(0.35, p.r * 0.30))) clampInside(p, glitterPad);
      clampAbovePile(p, glitterPad + p.r * 0.18, mdt);
      stepDepth(p, mdt, 0.55);
    }
    microPathsDirty = true;
  }

  const invDt = 1 / Math.max(dt, 1e-4);
  for (const b of bubbles) {
    sampleFlow(b.x, b.y, flow);

    /* The grid flow changes in cell-sized steps as a bubble crosses it. A
     * real bubble samples the liquid over its whole diameter, not at one
     * mathematical point, so low-pass the local carrier before using it for
     * both advection and acceleration. This removes resting pixel jitter
     * while retaining the quicker response during an intentional shake. */
    const flowTau = 0.18 - motionActivity * 0.10;
    const flowK = 1 - Math.exp(-dt / flowTau);
    b.sfx += (flow.x - b.sfx) * flowK;
    b.sfy += (flow.y - b.sfy) * flowK;

    /* Vortex shedding. The zigzag frequency follows speed over diameter, so
     * a bubble that stalls in the flow stops weaving and a fast one weaves
     * quickly — and `weave` is zero below the critical size, so fine fizz
     * rises straight. Before, every bubble wove at a fixed rate whatever it
     * was doing. */
    const rvx = b.vx - b.sfx, rvy = b.vy - b.sfy;
    const rel = Math.hypot(rvx, rvy);
    b.phase += WEAVE_ST * rel / (2 * b.r) * dt;
    const wob = Math.sin(b.phase) * b.weave * rel * 0.18;

    /* Added mass, and the one thing about a bubble that relaxing toward the
     * flow can never reproduce.
     *
     * A body of negligible density accelerates at three times the fluid
     * around it: it has no inertia of its own, so all it carries is the
     * liquid it must shove aside, and the pressure gradient driving that
     * liquid drives the bubble harder still. A bubble therefore *leads* the
     * flow into a turn while everything heavier lags it — which is why the
     * fizz arrives at the far wall before the glitter does. Relaxation only
     * ever lags, so this has to be added explicitly, and it is driven by the
     * fluid's own local acceleration (a material derivative, since the
     * sample follows the bubble) rather than by the container's: what the
     * liquid actually did is what the bubble responds to.
     */
    const rawAx = (b.sfx - b.pfx) * invDt;
    const rawAy = (b.sfy - b.pfy) * invDt;
    b.pfx = b.sfx; b.pfy = b.sfy;
    const leadTau = 0.22 - motionActivity * 0.13;
    const leadK = 1 - Math.exp(-dt / leadTau);
    b.leadAx += (rawAx - b.leadAx) * leadK;
    b.leadAy += (rawAy - b.leadAy) * leadK;
    const lead = 2 * b.tau;               // 3x the fluid, less the 1x it rides
    /* Added-mass lead matters during a turn, but feeding a bubble's own quiet
     * airlift circulation back at full gain forms a self-sustaining wall jet.
     * Close that loop as the shaker settles while preserving the fast lead
     * during real handset motion. */
    const leadGain = motionActivity;
    const lx = Math.max(-220, Math.min(220, b.leadAx * lead)) * leadGain;
    const ly = Math.max(-220, Math.min(220, b.leadAy * lead)) * leadGain;

    const climb = b.rise * gMag;
    const bubbleFlow = 0.035 + motionActivity * 0.965;
    let tx = b.sfx * bubbleFlow - gDir.x * climb - gDir.y * wob + lx;
    let ty = b.sfy * bubbleFlow - gDir.y * climb + gDir.x * wob + ly;

    /* Capillary centring at the free surface. A large bubble pressed into the
     * rounded shoulder has less room and a stronger pressure gradient on its
     * wall side, so it migrates back toward the broad middle of the lens.
     * Without this, tangential flow could park every large bubble at the two
     * ends indefinitely. Smaller bubbles may still roam nearly the full span. */
    const approach = depthOf(b.x, b.y);
    const size = Math.min(1, b.r / Math.max(1, maxBubble));
    const along = (b.x - CX) * tan.x + (b.y - CY) * tan.y;
    const freeSpan = span * (0.68 - size * 0.24);
    const shoulder = Math.max(0, Math.abs(along) - freeSpan);
    if (shoulder > 0) {
      /* Wall-induced lift acts during the whole ascent; pressure on the narrow
       * wall-side gap pushes a rising bubble back into the body. It strengthens
       * further when that bubble reaches the curved surface shoulder. */
      const nearSurface = approach > -b.r * 3.2;
      const returnGain = (1.05 + size * 2.15) * (nearSurface ? 1.55 : 1);
      const returnSpeed = Math.sign(along) * shoulder * returnGain;
      tx -= tan.x * returnSpeed;
      ty -= tan.y * returnSpeed;
    }
    if (approach > -b.r * 3.2) {
      const tangentSpeed = b.vx * tan.x + b.vy * tan.y;
      tx -= tan.x * tangentSpeed * (0.16 + size * 0.28);
      ty -= tan.y * tangentSpeed * (0.16 + size * 0.28);
    }
    const k = 1 - Math.exp(-dt / b.tau);
    b.vx += (tx - b.vx) * k;
    b.vy += (ty - b.vy) * k;

    if (b.alpha > 0) {
      scatterForce(b.x, b.y, (flow.x - b.vx) * b.mass * COUPLE,
                             (flow.y - b.vy) * b.mass * COUPLE);
      // What fraction of a cell this bubble displaces. The lift it gives the
      // liquid follows from that, next step.
      depositVoid(b.x, b.y, b.alpha * Math.PI * b.r * b.r / (cell * cell));
    }

    b.x += b.vx * dt; b.y += b.vy * dt;
    const attemptedX = b.x, attemptedY = b.y;
    const bubblePad = Math.max(pad, b.r * 1.08);
    if (clampInside(b, bubblePad)) hitWall(b, attemptedX, attemptedY);

    // Oblate when climbing: a rising bubble is flattened perpendicular to
    // its motion, and the faster it goes the more so.
    /* Barely any. Oblateness is real, but at these speeds it is a few
     * percent, and rendering it at 0.22 turned every bubble into an egg. */
    const target = Math.min(0.07, Math.hypot(b.vx, b.vy) / (b.rise + 60) * 0.2);
    b.squash += (target - b.squash) * Math.min(1, dt * 5);
    stepDepth(b, dt, 1.15);

    /* The free surface is a lid.
     *
     * Nothing stopped a bubble there before — it kept climbing into the
     * headspace for the two seconds its drain timer took, so bubbles were
     * visibly floating in the air above the waterline. A bubble that reaches
     * the surface breaks through it and stays: held in the film, riding
     * proud of the line by a fraction of its radius, because it is buoyant
     * and there is nothing left above it to climb through. */
    const d = depthOf(b.x, b.y);
    const perch = b.r * 0.36;
    if (d > -b.r * 0.9) {
      /* Once the film touches the free surface, buoyancy no longer keeps
       * accelerating the bubble through it. Cancel that normal component at
       * contact, not only after the centre has already overshot the line. */
      const vn = b.vx * up.x + b.vy * up.y;
      if (vn > 0) { b.vx -= up.x * vn; b.vy -= up.y * vn; }
      if (d > perch) {
        const over = d - perch;
        b.x -= up.x * over; b.y -= up.y * over;
      }
      clampInside(b, bubblePad);
      if (!b.fading) {
        b.rest += dt;
        /* Surface-film drainage. Larger bubbles remain longer, but a varied
         * 5–10 second window lets them join the headspace before a flip can
         * accumulate a stationary foam bank. Variation prevents a row of
         * bubbles from popping in synchrony. */
        if (b.rest > (3 + b.r * 0.28) * b.drain) {
          b.fading = true; burstRipple(b);
        }
      }
    } else if (!b.fading) {
      b.rest = 0;
    }

    if (b.fading) {
      b.rest = 0;
      /* Bursting, not fading. A film that has thinned past the point of
       * holding does not dim in place — it springs outward as the surface
       * tension that was holding it in a sphere lets go. Cheap, and it is
       * the difference between a pop and a bubble being switched off. */
      b.pop += dt * 5.5;
      b.alpha -= dt * 5;
      if (b.alpha <= 0) {
        b.alpha = 0; b.fading = false; b.pop = 1;
        // Reborn small; it will grow again by merging on the way up.
        setBubbleSize(b, bubbleBirthRadius());
        respawnBubble(b);
      }
    } else if (b.alpha < 1) {
      b.alpha = Math.min(1, b.alpha + dt * 1.6);
    }
  }

  // Every other step: merging is a slow process and the pair loop is the
  // most expensive thing the bubbles do.
  stepSurfaceFoam(dt);

  // Z motion changes draw order. Resort a few times a second rather than
  // every frame; the depth movement is deliberately slow and continuous.
  depthSortTime += dt;
  if (depthSortTime >= 0.25) {
    depthSortTime = 0;
    stars.sort((a, b) => a.z - b.z);
    bubbles.sort((a, b) => a.z - b.z);
    starSplit = depthSplit(stars);
    bubbleSplit = depthSplit(bubbles);
  }

  coalesceTick = !coalesceTick;
  if (coalesceTick) coalesce(dt * 2);

  // Publish this step's concentration for the next one to disperse against.
  const swap = conc; conc = concNext; concNext = swap; concNext.fill(0);
  const gswap = gas; gas = gasNext; gasNext = gswap; gasNext.fill(0);
  let cs = 0, cn = 0;
  for (let k = 0; k < conc.length; k++) {
    if (fsolid[k] || fair[k]) continue;
    cs += conc[k]; cn++;
  }
  concFloor = cn ? Math.max(1e-4, cs / cn) * 0.75 : 1;
}

/* Bubbles that touch merge, conserving gas volume.
 *
 * This is what produces the range of sizes the reference shows: a shaker
 * does not start with big bubbles, it makes them by merging small ones, and
 * the merged bubble then rises faster because buoyancy scales with volume
 * while drag does not. Cheap at this count — the pair loop is a few thousand
 * comparisons — and it gives the population a life cycle rather than a fixed
 * set of sizes cycling forever.
 */
let mergeCount = 0;
let coalesceTick = false;

function separateBubblePair(a, b, dx, dy, dz, d, planarD, touch, dt, zScale) {
  const overlap = touch - d;
  if (planarD > 1e-3) {
    const nx = dx / planarD, ny = dy / planarD;
    const move = overlap * 0.52 * planarD / d;
    a.x -= nx * move; a.y -= ny * move;
    b.x += nx * move; b.y += ny * move;
    const separateSpeed = Math.min(70, overlap * 3.5) * dt;
    a.vx -= nx * separateSpeed; a.vy -= ny * separateSpeed;
    b.vx += nx * separateSpeed; b.vy += ny * separateSpeed;
  }
  if (Math.abs(dz) > 1e-3) {
    const moveZ = overlap * 0.52 * Math.abs(dz) / d / zScale;
    const signZ = Math.sign(b.z - a.z);
    a.z = Math.max(-1, Math.min(1, a.z - signZ * moveZ));
    b.z = Math.max(-1, Math.min(1, b.z + signZ * moveZ));
  }
  clampInside(a, Math.max(Math.min(RX, RY) * 0.03, a.r * 1.08));
  clampInside(b, Math.max(Math.min(RX, RY) * 0.03, b.r * 1.08));
}

function coalesce(dt) {
  const largeThreshold = 10 * bubbleUnit;
  let largeCount = 0;
  for (const b of bubbles) {
    if (!b.fading && b.alpha > 0.35 && b.r >= largeThreshold) largeCount++;
  }
  for (let i = 0; i < bubbles.length; i++) {
    const a = bubbles[i];
    if (a.fading || a.alpha < 0.9) continue;
    for (let j = i + 1; j < bubbles.length; j++) {
      const b = bubbles[j];
      if (b.fading || b.alpha < 0.9) continue;
      /* Bubble contact is three-dimensional. Collapsing all depth layers onto
       * the screen made unrelated front/back bubbles attract and pack into one
       * apparent raft. Convert the normalised Z separation to chamber pixels
       * before testing wakes or contact. */
      let dx = b.x - a.x, dy = b.y - a.y;
      let planarD = Math.hypot(dx, dy);
      /* Even bubbles separated through the pouch depth should not repeatedly
       * draw as one stack of large rings. Give large silhouettes a soft 2-D
       * exclusion before the true 3-D collision test. Smaller bubbles may
       * still occlude naturally. */
      const visualTouch = (a.r + b.r) * 0.98;
      if ((a.r > 8 * bubbleUnit || b.r > 8 * bubbleUnit) &&
          planarD < visualTouch) {
        let nx, ny;
        if (planarD > 1e-3) {
          nx = dx / planarD; ny = dy / planarD;
        } else {
          const angle = (i * 2.39996 + j * 0.75488) % (Math.PI * 2);
          nx = Math.cos(angle); ny = Math.sin(angle); planarD = 0;
        }
        const move = (visualTouch - planarD) * 0.42;
        a.x -= nx * move; a.y -= ny * move;
        b.x += nx * move; b.y += ny * move;
        clampInside(a, Math.max(Math.min(RX, RY) * 0.03, a.r * 1.08));
        clampInside(b, Math.max(Math.min(RX, RY) * 0.03, b.r * 1.08));
        dx = b.x - a.x; dy = b.y - a.y; planarD = Math.hypot(dx, dy);
      }
      if (Math.abs(a.z - b.z) > 0.75) continue;
      const planarD2 = dx * dx + dy * dy;
      const zScale = Math.min(RX, RY) * 0.12;
      const dz = (b.z - a.z) * zScale;
      const d2 = planarD2 + dz * dz;
      const touch = (a.r + b.r) * 1.02;

      /* Wake attraction. A bubble rising in the wake of another meets less
       * resistance, catches up and merges — it is why bubbles in a real
       * liquid form chains and why the big ones exist at all. Without it
       * two bubbles have to collide by chance, which measurement said
       * essentially never happens: zero merges in thirty seconds, so the
       * population only ever shrank as bubbles reached the surface.
       */
      const reach = (a.r + b.r) * 1.55;
      if (d2 < reach * reach && planarD > 1e-3) {
        const d = Math.sqrt(d2);
        // Strongest when one trails the other along the rise axis.
        const align = Math.abs((dx * gDir.x + dy * gDir.y) / planarD);
        const depthFade = 1 - Math.min(1, Math.abs(a.z - b.z) / 0.75);
        const pull = WAKE * align * depthFade * (1 - d / reach) * dt;
        const nx = dx / planarD, ny = dy / planarD;
        a.vx += nx * pull; a.vy += ny * pull;
        b.vx -= nx * pull; b.vy -= ny * pull;
      }

      if (d2 > touch * touch) continue;

      // Spheres: volumes add, so radii add in cube.
      const merged = Math.cbrt(a.r * a.r * a.r + b.r * b.r * b.r);
      const largeBefore = (a.r >= largeThreshold ? 1 : 0) +
                          (b.r >= largeThreshold ? 1 : 0);
      /* Contact is not instant coalescence. The carrier's surfactant film has
       * to drain between the bubbles; most brief collisions separate again,
       * especially in a moving shaker. This prevents rapid merge-respawn
       * cycles from manufacturing a raft of cap-sized bubbles. */
      const mergeChance = 1 - Math.exp(-dt * (0.05 + motionActivity * 0.35));
      if (merged > maxBubble ||
          (merged >= largeThreshold && largeBefore === 0 && largeCount >= 5) ||
          Math.random() > mergeChance) {
        /* A film that has not drained, or a pair already too large to merge,
         * separates instead. Otherwise cap-sized neighbours can remain
         * interpenetrated and render as stacked rings. */
        const d = Math.sqrt(d2) || 1;
        separateBubblePair(a, b, dx, dy, dz, d, planarD, touch, dt, zScale);
        continue;
      }
      const wa = a.r * a.r * a.r, wb = b.r * b.r * b.r, wt = wa + wb;
      a.x = (a.x * wa + b.x * wb) / wt;
      a.y = (a.y * wa + b.y * wb) / wt;
      a.vx = (a.vx * wa + b.vx * wb) / wt;
      a.vy = (a.vy * wa + b.vy * wb) / wt;
      a.z = (a.z * wa + b.z * wb) / wt;
      setBubbleSize(a, merged);
      largeCount += (merged >= largeThreshold ? 1 : 0) - largeBefore;
      clampInside(a, Math.max(Math.min(RX, RY) * 0.03, a.r * 1.08));
      mergeCount++;

      // The smaller one is consumed; respawn it as a fine bubble down below.
      b.fading = false; b.alpha = 0; b.rest = 0; b.pop = 1;
      setBubbleSize(b, bubbleBirthRadius());
      respawnBubble(b);
      break;
    }
  }
}

/** Sutherland–Hodgman clip of the liquid polygon against the squircle, so the
 *  area feedback measures what is actually drawn rather than the raw slab. */
function clipToContainer(poly) {
  let out = poly;
  for (let i = 0; i < outline.length; i += 6) {
    const a = outline[i];
    const b = outline[(i + 6) % outline.length];
    const ex = b.x - a.x, ey = b.y - a.y;
    const side = (p) => (p.x - a.x) * ey - (p.y - a.y) * ex;
    const next = [];
    for (let j = 0; j < out.length; j++) {
      const cur = out[j], prev = out[(j + out.length - 1) % out.length];
      const dc = side(cur), dp = side(prev);
      if (dc <= 0) {
        if (dp > 0) next.push(intersect(prev, cur, a, b));
        next.push(cur);
      } else if (dp <= 0) {
        next.push(intersect(prev, cur, a, b));
      }
    }
    out = next;
    if (out.length === 0) return [];
  }
  return out;
}

function intersect(p1, p2, a, b) {
  const r = { x: p2.x - p1.x, y: p2.y - p1.y };
  const s = { x: b.x - a.x, y: b.y - a.y };
  const denom = r.x * s.y - r.y * s.x;
  if (Math.abs(denom) < 1e-9) return { x: p2.x, y: p2.y };
  const t = ((a.x - p1.x) * s.y - (a.y - p1.y) * s.x) / denom;
  return { x: p1.x + r.x * t, y: p1.y + r.y * t };
}

/* -------------------------------------------------------------------- loop */

let last = 0, raf = 0;

/* One step of everything, however the clock arrived — the page's own
 * requestAnimationFrame, or a host calling tick(). */
function advance(now) {
  const dt = Math.min((now - last) / 1000 || 0.016, 0.05);
  last = now;
  const t0 = diagOn ? performance.now() : 0;
  // Render on simulation time, not wall time, so the specular flashes stay
  // in step with the physics they belong to.
  const sim = step(dt);
  const t1 = diagOn ? performance.now() : 0;
  render(sim);
  if (diagOn) {
    const t2 = performance.now();
    diagSample(now, t2 - t0, t1 - t0, t2 - t1);
  }
}

/* Frame timing, reported to the console.
 *
 * Off unless a host turns it on. Inside a wallpaper there is no devtools to
 * attach and no way to read anything out of the page, so the one number that
 * actually matters there — whether this holds a frame rate on real hardware,
 * which every measurement so far has been a software rasteriser in a
 * container — has to come out through the console and into logcat. */
let diagOn = false, diagFrames = 0, diagJs = 0, diagSim = 0,
    diagRender = 0, diagSince = 0;

function diagSample(now, js, sim, renderMs) {
  diagFrames++;
  diagJs += js;
  diagSim += sim;
  diagRender += renderMs;
  if (now - diagSince < 2000) return;
  const fps = diagFrames * 1000 / (now - diagSince);
  console.log("shaker fps=" + fps.toFixed(1) +
              " js=" + (diagJs / diagFrames).toFixed(1) + "ms" +
              " sim=" + (diagSim / diagFrames).toFixed(1) + "ms" +
              " render=" + (diagRender / diagFrames).toFixed(1) + "ms" +
              " canvas=" + canvas.width + "x" + canvas.height +
              " stars=" + stars.length + " micro=" + microGlitter.length +
              " bubbles=" + bubbles.length);
  diagFrames = 0; diagJs = 0; diagSim = 0; diagRender = 0; diagSince = now;
}

function frame(now) {
  raf = requestAnimationFrame(frame);
  advance(now);
}

function start() {
  if (!resize()) {
    requestAnimationFrame(start);
    return;
  }
  updateBasis();
  // `level` is the surface's signed height along `up`, so a fill above half
  // is a positive offset from centre. Inverting this drains the container.
  level = (CONFIG.fill - 0.5) * 2 * upExtent;
  // Preserve the requested *volume*, not whatever area happens to survive
  // the first wave/clamp step. Seeding targetArea from the first rendered
  // polygon made the rounded ceiling quietly turn 97.5% into about 87%.
  targetArea = polygonArea(outline) * CONFIG.fill;
  h.fill(0); wv.fill(0);
  seed();
  /* One frame drawn synchronously, before anything is scheduled. The manifest
   * icon is a picture of this canvas, and it is asked for on the line after
   * start() returns — with the first frame left to the animation callback the
   * icon was a snapshot of a canvas nothing had drawn into yet. */
  render(simTime);
  last = performance.now();
  if (!raf) raf = requestAnimationFrame(frame);
}

window.addEventListener("resize", () => {
  if (resize()) {
    updateBasis();
    targetArea = polygonArea(outline) * CONFIG.fill;
  }
});
// A live wallpaper is hidden whenever the launcher is not showing; stopping
// the loop there is the difference between a wallpaper and a battery leak.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); }
});

/* ------------------------------------------------------- running on a phone
 *
 * Three things stand between a page in a browser tab and something that
 * behaves like a wallpaper, and none of them are about the drawing.
 */

/* The screen must not dim while you are watching it. A wallpaper never does;
 * a web page will, in about fifteen seconds. The lock is dropped whenever the
 * page is hidden, so it has to be taken again on the way back. */
let wakeLock = null;
async function keepAwake() {
  if (!navigator.wakeLock || document.visibilityState !== "visible") return;
  try { wakeLock = await navigator.wakeLock.request("screen"); }
  catch (e) { /* refused, or unsupported: there is no second way to ask */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});

/* Browser chrome has to go. Fullscreen needs a gesture to grant it, so it is
 * taken on the first touch — and only on a touch, so that dragging to tilt on
 * a desktop does not throw the window into fullscreen on the first click. */
function goImmersive(e) {
  if (e.pointerType && e.pointerType !== "touch") return;
  keepAwake();
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) {
    el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  }
  window.removeEventListener("pointerdown", goImmersive);
}
window.addEventListener("pointerdown", goImmersive);

/* And it should be installable, because "add to home screen" is the closest
 * a web page gets to being a wallpaper: launched from the home screen it
 * opens fullscreen with no address bar and no tab. The manifest is built here
 * rather than shipped as a second file so that this stays one self-contained
 * page, and the icon is drawn from the same palette and the same flake shapes
 * as the wallpaper, so the thing on the home screen looks like the thing it
 * opens. */
function installIcon(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";

  // The centre square of the live canvas, which in full-bleed mode is the
  // container and in pouch mode is the container plus its backdrop.
  const side = Math.min(canvas.width, canvas.height);
  const ox = (canvas.width - side) / 2, oy = (canvas.height - side) / 2;
  const k = size / side;

  /* Clipped to the vessel's own boundary rather than to a rounded square
   * drawn to resemble it, so the icon is bounded by whatever shape the
   * container actually has — including the corner radius the page was asked
   * for. `outline` is in CSS pixels; the canvas is scaled by DPR on top of
   * that, and the icon is the centre square of the result. */
  g.beginPath();
  for (let i = 0; i < outline.length; i++) {
    const x = (outline[i].x * DPR - ox) * k, y = (outline[i].y * DPR - oy) * k;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
  g.clip();

  /* Drawn from the simulation, not approximated from the palette. The five
   * hand-placed flakes this used to draw were the one thing on the home
   * screen that was not the real optics: no refraction, no caustics, no
   * settled distribution, and a specular that belonged to nothing. */
  g.drawImage(canvas, ox, oy, side, side, 0, 0, size, size);
  return c.toDataURL("image/png");
}

function installManifest() {
  const head = document.head;
  let vp = head.querySelector('meta[name="viewport"]');
  if (!vp) { vp = document.createElement("meta"); vp.name = "viewport"; head.appendChild(vp); }
  vp.content = "width=device-width,initial-scale=1,viewport-fit=cover";

  const theme = document.createElement("meta");
  theme.name = "theme-color";
  theme.content = CONFIG.ramp[0];
  head.appendChild(theme);

  const manifest = {
    name: "Liquid Shaker",
    short_name: "Shaker",
    display: "fullscreen",
    orientation: "portrait",
    background_color: CONFIG.ramp[0],
    theme_color: CONFIG.ramp[0],
    start_url: location.href.split("#")[0],
    icons: [192, 512].map((s) => ({
      src: installIcon(s), sizes: s + "x" + s, type: "image/png", purpose: "any",
    })),
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(
    new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  head.appendChild(link);
}

/* ------------------------------------------------ the native host, if any
 *
 * Inside an Android live wallpaper there is no browser to deliver
 * devicemotion: the page is drawn into a wallpaper surface by a service that
 * owns the sensors itself. So the service feeds them in through here, in the
 * units and the device frame the web event already uses — raw metres per
 * second squared, +y up the screen — which means the two paths land on the
 * same code and there is only one motion model to keep honest.
 */
let hostOffset = null;

window.__shaker = {
  /** Accelerometer, straight off android.hardware.Sensor.TYPE_ACCELEROMETER.
   *  `spin` is rotation about the viewing axis in degrees per second, which
   *  is the gyroscope's z component converted from radians. */
  motion(x, y, z, spin) {
    onMotion({
      accelerationIncludingGravity: { x, y, z },
      rotationRate: spin === undefined ? null : { alpha: spin },
    });
  },

  /* Home-screen page swipes. A wallpaper is wider than the screen and slides
   * under the icons, and sliding a vessel sideways tilts the liquid in it —
   * so this goes in through the surface, the same way turning the phone
   * does, and the sloshing that follows is the wave dynamics doing what they
   * already do rather than an animation laid over the top. */
  offset(t) {
    if (hostOffset === null) { hostOffset = t; return; }
    /* Clamped, because the launcher reports a jump between distant pages as
     * one step and a vessel does not get moved a metre instantaneously. */
    const d = Math.max(-0.3, Math.min(0.3, t - hostOffset));
    hostOffset = t;
    if (!d) return;
    const k = d * span * 0.32;
    for (let i = 0; i < N; i++) {
      h[i] -= k * (-1 + 2 * (i / (N - 1)));
    }
  },

  /* A tap on the glass.
   *
   * Not a push radially away from the point, which is the obvious thing to
   * write and does exactly nothing: a radial source is pure divergence, and
   * an incompressible liquid cannot expand away from a poke, so the pressure
   * projection deletes the whole of it. Measured, the flow was unchanged to
   * the pixel per second.
   *
   * What a poke really does is drive a jet inward and dent the surface over
   * it. The jet is not divergence-free either, but it is not divergence
   * *only* — the projection keeps the part of it that curls, which is the
   * pair of vortices a jet rolls up into, and that is the stir you see. */
  tap(nx, ny) {
    const x = nx * W, y = ny * H;
    const R = Math.min(RX, RY) * 0.26, k = 1400;
    for (let j = 1; j < GH - 1; j++) {
      for (let i = 1; i < GW - 1; i++) {
        const c = j * GW + i;
        if (fsolid[c] || fair[c]) continue;
        const dx = (i + 0.5) * cell - x, dy = (j + 0.5) * cell - y;
        const d = Math.hypot(dx, dy);
        if (d > R) continue;
        const w = 1 - d / R;
        fu[c] += gDir.x * k * w;
        fv[c] += gDir.y * k * w;
      }
    }
    // And the surface dips where it was struck.
    const along = (x - CX) * tan.x + (y - CY) * tan.y;
    const idx = Math.round((along + span) / (2 * span) * (N - 1));
    for (let d = -3; d <= 3; d++) {
      const j = idx + d;
      if (j < 0 || j >= N) continue;
      wv[j] -= 150 * (1 - Math.abs(d) / 4);
    }
  },

  /** The service stops the loop when the wallpaper is not on screen. */
  pause() { cancelAnimationFrame(raf); raf = 0; },
  resume() { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); },

  /* Hand the clock to the host.
   *
   * Drawn into a wallpaper surface by hand, the page is in a WebView that is
   * not attached to a window, and an unattached WebView has no vsync to hang
   * requestAnimationFrame off — so the loop either throttles hard or never
   * runs. The host that is already waking up once per frame to draw can step
   * the simulation itself instead. */
  drive() { cancelAnimationFrame(raf); raf = 0; last = performance.now(); },
  tick() { advance(performance.now()); },

  /** Frame timing to the console, for a host that has no other way to see it. */
  diag(on) {
    diagOn = !!on; diagSince = performance.now();
    diagFrames = 0; diagJs = 0; diagSim = 0; diagRender = 0;
  },

  /** Compact read-only state for repeatable browser and handset audits. */
  stats() {
    let glitterSides = 0, glitterCorners = 0, glitterCentre = 0;
    const countGlitter = (p) => {
      const along = ((p.x - CX) * tan.x + (p.y - CY) * tan.y) / span;
      const vertical = ((p.x - CX) * up.x + (p.y - CY) * up.y) / upExtent;
      if (Math.abs(along) > 0.86) glitterSides++;
      if (Math.abs(along) > 0.82 && Math.abs(vertical) > 0.82) glitterCorners++;
      if (Math.abs(along) < 0.33) glitterCentre++;
    };
    for (const p of stars) countGlitter(p);
    for (const p of microGlitter) countGlitter(p);
    const glitterTotal = stars.length + microGlitter.length;
    let largeBubbles = 0, edgeBubbles = 0;
    for (const b of bubbles) {
      if (b.fading || b.alpha < 0.35) continue;
      if (b.r >= 10 * bubbleUnit) largeBubbles++;
      const along = ((b.x - CX) * tan.x + (b.y - CY) * tan.y) / span;
      if (Math.abs(along) > 0.72) edgeBubbles++;
    }
    return {
      stars: stars.length, micro: microGlitter.length,
      bubbles: bubbles.length, largeBubbles, edgeBubbles,
      surfaceFoam: surfaceFoam.length, pileFill,
      glitterSideFraction: glitterSides / Math.max(1, glitterTotal),
      glitterCornerFraction: glitterCorners / Math.max(1, glitterTotal),
      glitterCentreFraction: glitterCentre / Math.max(1, glitterTotal),
      motionActivity, cascadeSpreadHold,
    };
  },

  /** A picture of the container as it stands right now, clipped to its own
   *  boundary and returned as a PNG data URL. This is what the icon renderer
   *  reads out once it has driven the simulation to the state it wants. */
  icon(size) { return installIcon(size); },
};

start();
installManifest();
</script>
</body>
</html>
