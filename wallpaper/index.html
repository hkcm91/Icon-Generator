      g.fillStyle = "#ffffff";
      flakePath(g, c, c, R, shape);
      g.fill();
    }));
  }
}

function buildSprites() {
  buildFlakeSprites();
  /* A bubble's shadow. It is a diverging lens, so it spreads the light
   * passing through it and the liquid directly behind it receives less —
   * which is the one thing in the scene that makes anything look like it is
   * *in* the medium rather than painted on top of it. Nothing occluded
   * anything before. */
  shadeSprite = sprite(64, (g, s) => {
    const r = s / 2;
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, "rgba(6,42,96,.85)");
    grad.addColorStop(0.45, "rgba(6,42,96,.42)");
    grad.addColorStop(1, "rgba(6,42,96,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
  });

  /* One fizz bubble, at the two or three pixels it is actually drawn. Bright
   * rim, hollow middle — the same optics as its big sisters, with everything
   * that cannot survive at this size left out. */
  fizzSprite = sprite(16, (g, s) => {
    const r = s / 2;
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, "rgba(214,244,255,.10)");
    grad.addColorStop(0.55, "rgba(226,248,255,.30)");
    grad.addColorStop(0.82, "rgba(255,255,255,.92)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
  });

  glowSprite = sprite(64, (g, s) => {
    const r = s / 2;
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, "rgba(255,255,255,.85)");
    grad.addColorStop(0.35, "rgba(255,255,255,.22)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
  });

  /* A bubble in water is a *diverging* lens, and that one fact sets its
   * whole appearance.
   *
   * Light crossing from water into air bends away from the normal, so past
   * an incidence of about 49 degrees none of it gets through at all — it is
   * totally internally reflected. On a sphere that angle falls at an impact
   * parameter of n_air/n_water = 0.75 of the radius, which splits the disc
   * into two quite different objects:
   *
   *   inside 0.75R   you see the liquid behind, minified and turned upside
   *                  down by the lens. The bubble therefore shows the far
   *                  reaches of the pour, not its own surroundings, and its
   *                  interior gradient runs *opposite* to the liquid around
   *                  it. That inversion is the single strongest cue that
   *                  there is a hole in the water rather than a decal on it.
   *   outside 0.75R  nothing is transmitted; the annulus is a mirror,
   *                  showing whatever is on the viewer's side. Bright where
   *                  it faces the light, dark where it faces the depths.
   *
   * How much ink each part gets is set by reflectance, and reflectance on a
   * sphere only climbs steeply in the last few percent of the radius. Over
   * most of the annulus a bubble is reflecting liquid, back at liquid of
   * nearly the same brightness, so it is barely visible there. Painting that
   * whole quarter-radius band as opaque pale ring turned every bubble into a
   * rubber grommet — a fat raised collar around a flat dark disc. Almost all
   * of the contrast belongs in two thin rings and a hard specular; the rest
   * of a bubble is a hole you can see through.
   *
   * Before that the sprite had a uniform white ring all the way around,
   * which is a soap bubble floating in air, and a milky interior, which is
   * opaque exactly where a bubble is clearest.
   */
  const NREL = 0.752;        // n_air / n_water, so also the critical radius

  /* Baked with "up" against gravity, because that is what the interior
   * inversion is fixed to. Three variants: film thickness varies bubble to
   * bubble and so does how much of the band it interferes away. */
  const paintBubbleBody = (v) => (g, s) => {
    const R = s / 2, c = s / 2;
    const disc = (k) => { g.beginPath(); g.arc(c, c, R * (k || 1), 0, Math.PI * 2); };
    const band = 0.13 + v * 0.035;     // how dark the refracted band goes
    const warm = [236, 246, 240][v];   // faint film colour, per variant

    disc(); g.save(); g.clip();

    /* 1. The inverted image. What sits below the bubble appears at the top
     *    of it and what sits above appears at the bottom, so against a pour
     *    that is deep blue at the top and pale teal at the bottom this runs
     *    pale-over-dark — the reverse of its surroundings. Faint: it is a
     *    displacement of the background, not a coat of paint over it. */
    const inv = g.createLinearGradient(0, c - R * NREL, 0, c + R * NREL);
    inv.addColorStop(0, `rgba(216,${warm + 8},255,.13)`);
    inv.addColorStop(0.5, "rgba(255,255,255,.015)");
    inv.addColorStop(1, "rgba(14,60,124,.12)");
    g.fillStyle = inv;
    g.fillRect(0, 0, s, s);

    /* 2. The refracted band. Rays arriving near the critical angle are bent
     *    hardest, so they reach the eye from far off-axis — from the deep
     *    liquid and the dark of the container edge rather than from behind
     *    the bubble. That is why an air bubble in water carries a dark ring
     *    and a droplet of water in air does not. Thin, and sitting just
     *    inside the critical radius. */
    const dark = g.createRadialGradient(c, c, 0, c, c, R);
    dark.addColorStop(0.00, "rgba(4,34,86,0)");
    dark.addColorStop(0.40, "rgba(4,34,86,.015)");
    dark.addColorStop(0.60, `rgba(4,34,86,${band * 0.42})`);
    dark.addColorStop(0.735, `rgba(3,26,70,${band})`);
    dark.addColorStop(0.82, `rgba(3,26,70,${band * 0.5})`);
    dark.addColorStop(0.93, "rgba(3,26,70,0)");
    g.fillStyle = dark;
    g.fillRect(0, 0, s, s);

    /* 3. The critical-angle caustic. The last rays that make it through all
     *    emerge at the same grazing angle, so they pile up in a thin bright
     *    ring right at the boundary between the two regimes. A line, not a
     *    fade — and thin enough to read as light rather than as a bezel. */
    const crit = g.createRadialGradient(c, c, 0, c, c, R);
    crit.addColorStop(0.775, "rgba(232,251,255,0)");
    crit.addColorStop(0.818, `rgba(246,254,255,${0.15 + v * 0.045})`);
    crit.addColorStop(0.862, "rgba(232,251,255,0)");
    g.fillStyle = crit;
    g.fillRect(0, 0, s, s);

    /* 4. The mirror annulus, its ambient half — nearly nothing, because it
     *    is reflecting the same liquid it sits in. Only right at the edge,
     *    where reflectance runs to one, does it brighten at all. The bright
     *    part of the reflection belongs to the light and is baked separately
     *    so that it can stay put while the bubble turns. */
    const mir = g.createRadialGradient(c, c, 0, c, c, R);
    mir.addColorStop(0.86, "rgba(206,238,252,0)");
    mir.addColorStop(0.955, "rgba(224,246,255,.10)");
    mir.addColorStop(0.99, "rgba(238,252,255,.24)");
    mir.addColorStop(1, "rgba(238,252,255,0)");
    g.fillStyle = mir;
    g.fillRect(0, 0, s, s);
    g.restore();

    /* 5. The silhouette. A hairline where the film turns exactly edge-on:
     *    without it a bubble has no outline at all against pale liquid. */
    g.lineWidth = Math.max(1, R * 0.016);
    g.strokeStyle = "rgba(12,52,110,.22)";
    disc(0.985); g.stroke();
  };

  /* Baked with the light at the top of the sprite, and never rotated with
   * the bubble — a reflection stays with its source. */
  const paintBubbleGlint = (g, s) => {
    const R = s / 2, c = s / 2;

    /* The lit part of the mirror. Confined to the outer tenth, where the
     * reflectance actually runs to one, and filled with a gradient running
     * away from the source so the arc is brilliant facing the light and
     * fades to nothing on the far side. A ring that is uniformly bright all
     * the way round is a drawn circle; this falloff is what makes it a
     * reflection. */
    g.save();
    g.beginPath();
    g.arc(c, c, R, 0, Math.PI * 2);
    g.arc(c, c, R * 0.90, 0, Math.PI * 2, true);
    g.clip("evenodd");
    const lit = g.createLinearGradient(0, c - R, 0, c + R * 0.5);
    lit.addColorStop(0, "rgba(255,255,255,.62)");
    lit.addColorStop(0.28, "rgba(243,253,255,.34)");
    lit.addColorStop(0.62, "rgba(226,246,255,.10)");
    lit.addColorStop(1, "rgba(226,246,255,0)");
    g.fillStyle = lit;
    g.fillRect(0, 0, s, s);
    g.restore();

    g.save();
    g.beginPath(); g.arc(c, c, R, 0, Math.PI * 2); g.clip();

    // The image of the source itself: small, hard, and smeared along the
    // rim because the annulus is curving away underneath it.
    g.save();
    g.translate(c, c - R * 0.87);
    g.scale(2.2, 1);
    const spec = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.105);
    spec.addColorStop(0, "rgba(255,255,255,1)");
    spec.addColorStop(0.5, "rgba(255,255,255,.95)");
    spec.addColorStop(0.78, "rgba(255,255,255,.34)");
    spec.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = spec;
    g.fillRect(-R, -R, R * 2, R * 2);
    g.restore();

    /* The second image, from the far wall of the bubble. Every curved
     * transparent surface gives two, and drawing only the near one is why
     * the old bubble looked lit from one side like a solid ball. */
    g.save();
    g.translate(c, c + R * 0.86);
    g.scale(1.5, 1);
    const back = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.13);
    back.addColorStop(0, "rgba(255,255,255,.44)");
    back.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = back;
    g.fillRect(-R, -R, R * 2, R * 2);
    g.restore();

    // Light that came through the lens, landing on the side away from the
    // source and spread wide because the lens diverges it.
    const thru = g.createRadialGradient(
      c, c + R * 0.30, 0, c, c + R * 0.30, R * 0.46);
    thru.addColorStop(0, "rgba(230,251,255,.20)");
    thru.addColorStop(1, "rgba(230,251,255,0)");
    g.fillStyle = thru;
    g.fillRect(0, 0, s, s);
    g.restore();
  };

  for (let v = 0; v < BUB_VARIANTS; v++) {
    bubbleBody[v] = sprite(192, paintBubbleBody(v));
  }
  bubbleGlint = sprite(192, paintBubbleGlint);
  bubbleBodyFar = bubbleBody.map((c) => defocus(c, 9));
  bubbleGlintFar = defocus(bubbleGlint, 9);
  /* Fine fizz: at four or five pixels across none of the structure survives,
   * so bake one flattened copy at the size it is actually drawn. The reason
   * is the same as for the flakes — canvas does not mipmap, and downscaling
   * a 192px sprite to five costs far more than the sprite is worth. */
  bubbleSmall = sprite(28, (g, s) => {
    paintBubbleBody(1)(g, s);
    paintBubbleGlint(g, s);
  });
  bubbleSmallFar = defocus(bubbleSmall, 1.4);

  /* One soft light shaft, blitted per caustic.
   *
   * Filling rects instead gave every shaft two hard vertical edges at a
   * fixed pitch, and the result read as corduroy rather than light. A baked
   * streak is soft on all four sides and costs one blit. */
  shaftSprite = spriteWH(64, 256, (g, w, h) => {
    const v = g.createLinearGradient(0, 0, 0, h);
    v.addColorStop(0, "rgba(216,246,255,1)");
    v.addColorStop(0.16, "rgba(200,240,255,.6)");
    v.addColorStop(0.45, "rgba(186,234,255,.22)");
    v.addColorStop(1, "rgba(178,230,255,0)");
    g.fillStyle = v;
    g.fillRect(0, 0, w, h);
    // Feather the sides so the shaft has no vertical edge at all.
    const side = g.createLinearGradient(0, 0, w, 0);
    side.addColorStop(0, "rgba(0,0,0,0)");
    side.addColorStop(0.5, "rgba(0,0,0,1)");
    side.addColorStop(1, "rgba(0,0,0,0)");
    g.globalCompositeOperation = "destination-in";
    g.fillStyle = side;
    g.fillRect(0, 0, w, h);
  });

  /* Four-ray glint for the flakes that catch the light. The reference is
   * full of these star flares, and they are a different thing from the
   * confetti — a specular event, not an object. */
  flareSprite = sprite(128, (g, s) => {
    const r = s / 2;
    g.translate(r, r);
    const ray = (len, wide, alpha) => {
      const grad = g.createLinearGradient(0, 0, len, 0);
      grad.addColorStop(0, `rgba(255,255,255,${alpha})`);
      grad.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(0, -wide); g.lineTo(len, 0); g.lineTo(0, wide);
      g.closePath(); g.fill();
    };
    for (let i = 0; i < 4; i++) {
      g.save(); g.rotate(i * Math.PI / 2);
      ray(r * 0.96, r * 0.055, 0.95);
      g.restore();
    }
    for (let i = 0; i < 4; i++) {
      g.save(); g.rotate(Math.PI / 4 + i * Math.PI / 2);
      ray(r * 0.4, r * 0.03, 0.5);
      g.restore();
    }
    const core = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.2);
    core.addColorStop(0, "rgba(255,255,255,1)");
    core.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = core;
    g.fillRect(-r, -r, s, s);
  });
}

/* ------------------------------------------------------------------ render */

/* Basis: `up` opposes gravity, `tan` runs along the surface. Everything to do
 * with the liquid is computed in this frame, then drawn in screen space. */
let up = { x: 0, y: -1 }, tan = { x: 1, y: 0 };

/* Half-extents of the container along the two basis directions. These are
 * support-function values, not max(RX, RY): on a full-screen portrait
 * container the tangent extent is the *width*, and sizing the height field
 * to the height instead would leave most of its columns off-screen — the
 * wave would run at a fraction of its intended resolution. */
let span = 1;        // along `tan`
let upExtent = 1;    // along `up`

let basisAngle = 0, basisReady = false;

/* Turning the container tilts the water in it.
 *
 * The height field is a graph over `tan`, and `tan` is derived from gravity —
 * so when the phone turns, the axes the surface is measured against turn with
 * it. Left alone, that means the surface arrives already perpendicular to the
 * new gravity: rotate the phone through 180 degrees and the water swaps ends
 * without ever sloshing, because the only forcing in the wave field is
 * `accel`, and a pure rotation has no translational acceleration at all.
 *
 * The surface does not turn with the container. Expressed in the new basis it
 * is tilted by exactly the angle the basis moved, which is what this puts
 * back — and the wave dynamics then do what they already do, running that
 * tilt back and forth across the vessel until it damps out. All of the
 * sloshing on a tilt or a flip comes from these two lines.
 */
function updateBasis() {
  const prev = basisAngle;
  up = { x: -gDir.x, y: -gDir.y };
  tan = { x: -up.y, y: up.x };
  span = Math.abs(tan.x) * RX + Math.abs(tan.y) * RY;
  upExtent = Math.abs(up.x) * RX + Math.abs(up.y) * RY;
  basisAngle = Math.atan2(up.y, up.x);

  let d = basisAngle - prev;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  if (basisReady && d !== 0) {
    for (let i = 0; i < N; i++) {
      h[i] -= d * (-span + 2 * span * (i / (N - 1)));
    }
  }
  basisReady = true;
}

function surfaceAt(s) {
  // s is the coordinate along `tan`, in pixels from the container centre.
  const f = (s + span) / (2 * span) * (N - 1);
  const i = Math.max(0, Math.min(N - 2, Math.floor(f)));
  const frac = f - i;
  return h[i] * (1 - frac) + h[i + 1] * frac;
}

/** How steeply the surface leans, in rise per unit run along `tan`. */
function surfaceSlope(s) {
  const f = (s + span) / (2 * span) * (N - 1);
  const i = Math.max(1, Math.min(N - 2, Math.round(f)));
  return (h[i + 1] - h[i - 1]) / (2 * (2 * span / (N - 1)));
}

/** Perpendicular distance above the wavy surface; negative = submerged. */
function depthOf(x, y) {
  const dx = x - CX, dy = y - CY;
  const along = dx * tan.x + dy * tan.y;
  const height = dx * up.x + dy * up.y;
  return height - (level + surfaceAt(along));
}

function liquidPolygon() {
  // Walk the surface line across the container, then close the polygon along
  // the squircle boundary on the downhill side.
  const pts = [];
  const steps = 64;
  for (let i = 0; i <= steps; i++) {
    const s = -span + (2 * span) * (i / steps);
    const lift = level + surfaceAt(s);
    pts.push({
      x: CX + tan.x * s + up.x * lift,
      y: CY + tan.y * s + up.y * lift,
    });
  }
  // Close well outside the container; the squircle clip trims it back.
  const far = (span + upExtent) * 2;
  pts.push({ x: CX + tan.x * span - up.x * far, y: CY + tan.y * span - up.y * far });
  pts.push({ x: CX - tan.x * span - up.x * far, y: CY - tan.y * span - up.y * far });
  return pts;
}

/* The stretch of surface that genuinely touches air, ending exactly where
 * the liquid meets the glass, with a capillary climb at each contact.
 *
 * A free surface is bounded by its vessel: where the container has curved
 * away, there is no air-liquid interface to draw. Bisecting to the wall
 * gives the true contact point, and real liquid wets the glass and climbs
 * it, so the ends curl up instead of stopping dead.
 */
function meniscus(poly, steps) {
  const wall = (from, to) => {
    // `from` is inside, `to` is out; bisect for the contact point.
    let lo = from, hi = to;
    for (let i = 0; i < 12; i++) {
      const m = { x: (lo.x + hi.x) / 2, y: (lo.y + hi.y) / 2 };
      if (isInside(m.x, m.y)) lo = m; else hi = m;
    }
    return lo;
  };

  const climb = Math.min(RX, RY) * 0.03;
  const reach = Math.min(RX, RY) * 0.13;
  const segs = [];
  let i = 0;

  /* Every contiguous run of surface that is actually inside the vessel is a
   * separate stretch of air-liquid interface. In a nearly full container the
   * crest presses against the ceiling and the waterline genuinely breaks
   * into pieces around the trapped air; taking only the first run would drop
   * the rest of it. */
  while (i <= steps) {
    while (i <= steps && !isInside(poly[i].x, poly[i].y)) i++;
    if (i > steps) break;
    const a = i;
    while (i <= steps && isInside(poly[i].x, poly[i].y)) i++;
    const b = i - 1;

    const pts = [];
    if (a > 0) pts.push(wall(poly[a], poly[a - 1]));
    for (let k = a; k <= b; k++) pts.push({ x: poly[k].x, y: poly[k].y });
    if (b < steps) pts.push(wall(poly[b], poly[b + 1]));
    if (pts.length < 2) continue;

    // Capillary climb: the liquid wets the glass, so each end curls upward
    // over a short stretch of wall rather than meeting it flat.
    const first = pts[0], last = pts[pts.length - 1];
    for (const p of pts) {
      const d = Math.min(Math.hypot(p.x - first.x, p.y - first.y),
                         Math.hypot(p.x - last.x, p.y - last.y));
      if (d >= reach) continue;
      const t = 1 - d / reach;
      const lift = climb * t * t;
      p.x += up.x * lift; p.y += up.y * lift;
    }
    segs.push(pts);
  }
  return segs;
}

function polygonArea(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    a += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
  }
  return Math.abs(a) * 0.5;
}

/* A bubble is a deformable object, not a stamp.
 *
 * A gas bubble rising through liquid is flattened perpendicular to its
 * motion — pressure is highest on the face meeting the fluid — and the
 * faster it climbs the more oblate it gets. Drawing every bubble as the same
 * rigid circle was the single thing that made them read as decals. It is
 * also drawn at its depth, so bubbles at the back sit under the liquid tint
 * and only the ones near the glass keep a hard bright rim.
 */
function drawBubble(b) {
  const sc = 1 + b.z * 0.3;
  const r = b.r * b.pop * sc;
  const x = b.x + parallaxX(b.z), y = b.y + parallaxY(b.z);
  // Same aerial perspective as the flakes: a bubble at the back wall is seen
  // through the whole thickness of the liquid and loses most of its contrast.
  const alpha = b.alpha * (0.40 + 0.60 * (b.z + 1) * 0.5);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);

  if (r < 9) {
    // Fine fizz. Nothing directional survives at this size, so one flat
    // blit — no transforms, and it is most of the population.
    ctx.drawImage(farField ? bubbleSmallFar : bubbleSmall, -r, -r, r * 2, r * 2);
    ctx.restore();
    return;
  }

  /* Cast first, so the bubble sits on top of its own shadow. Offset away
   * from the source and softened with size, the way a shadow thrown through
   * a thick medium spreads with the distance it travels. */
  ctx.globalAlpha = alpha * 0.30;
  const sd = r * 1.35;
  ctx.drawImage(shadeSprite, -SHADOW_X * sd - r, -SHADOW_Y * sd - r, r * 2, r * 2);
  ctx.globalAlpha = alpha;

  const speed = Math.hypot(b.vx, b.vy);
  const vang = speed > 1 ? Math.atan2(b.vy, b.vx) : 0;
  if (b.squash > 0.01) {
    // Flatten along the direction of travel, and leave the frame squashed
    // so the reflection deforms with the surface carrying it.
    ctx.rotate(vang);
    ctx.scale(1 / (1 + b.squash), 1 + b.squash * 0.72);
    ctx.rotate(-vang);
  }

  // What it refracts is fixed to gravity; what it reflects is fixed to the
  // light. Two blits, two frames.
  ctx.rotate(riseAngle);
  ctx.drawImage((farField ? bubbleBodyFar : bubbleBody)[b.variant], -r, -r, r * 2, r * 2);
  ctx.rotate(BUBBLE_LIGHT_ROT - riseAngle);
  ctx.drawImage(farField ? bubbleGlintFar : bubbleGlint, -r, -r, r * 2, r * 2);
  ctx.restore();
}

function drawStar(p, time) {
  // Fine glitter: at two or three pixels the rotation is invisible, so skip
  // the transform — but still blit the sprite. Substituting a fillRect here
  // is faster again and looks it: hard little squares read as cheap dither,
  // where the downscaled sprite reads as soft glitter.
  const sc = 1 + p.z * 0.3;
  const rr = p.r * sc;
  const px = p.x + parallaxX(p.z), py = p.y + parallaxY(p.z);

  /* Threshold raised from 2.2px: enlarging the flakes to match the
   * reference pushed most of the population off this fast path and onto the
   * save/rotate/restore one, costing 23fps. At three pixels across the
   * rotation is not visible anyway. */
  /* Aerial perspective. Against a coloured background, dropping a particle's
   * alpha *is* the loss of contrast with distance — what shows through is
   * the liquid, which is exactly what absorption and scattering along a
   * longer path leave you with. The ramp used to run 0.68 to 1.0, which is
   * barely a fifth of the range, and the fine glitter did not get it at all:
   * every small flake was drawn at full strength however deep it sat. */
  const depthFade = 0.34 + 0.66 * (p.z + 1) * 0.5;

  if (rr < 3.0) {
    ctx.globalAlpha = depthFade;
    ctx.drawImage((farField ? flakeSmallFar : flakeSmall)[p.hueIdx * SHAPES + p.shape],
                  px - rr, py - rr, rr * 2, rr * 2);
    ctx.globalAlpha = 1;
    return;
  }

  // Big flakes carry a glow; the fine glitter does not, which keeps the
  // blit count down and reads as depth of field.
  if (rr > 6) {
    const g = rr * 4.2;
    ctx.globalAlpha = 0.30 * depthFade;
    ctx.drawImage(glowSprite, px - g, py - g, g * 2, g * 2);
    ctx.globalAlpha = 1;
  }

  const s = rr * 2;
  ctx.save();
  ctx.globalAlpha = depthFade;
  ctx.translate(px, py);
  ctx.rotate(p.spin);
  ctx.drawImage((farField ? flakeFar : flakeSprites)[p.hueIdx * SHAPES + p.shape],
                -rr, -rr, s, s);

  /* Highlight, placed so it stays with the light while the flake turns
   * under it. The sprite is drawn in the flake's rotated frame, so the
   * atlas entry is chosen to cancel that rotation out. */
  let rel = (LIGHT_ANGLE - p.spin) % (Math.PI * 2);
  if (rel < 0) rel += Math.PI * 2;
  const k = Math.round(rel / (Math.PI * 2) * SPEC_K) % SPEC_K;
  /* Brightness follows how squarely the facet faces the light: a mirror
   * returns the source only near the reflection angle, and away from it
   * returns almost nothing. `flashPhase` gives each flake its own tilt out
   * of the plane, which is the part a 2-D spin cannot represent. */
  const face = Math.cos(p.spin * 2 - LIGHT_ANGLE * 2 + p.flashPhase);
  const glint = Math.pow(Math.max(0, face), 3);
  if (glint > 0.02) {
    ctx.globalAlpha = (0.12 + 0.88 * glint) * depthFade;
    ctx.drawImage(specSprites[p.shape * SPEC_K + k], -rr, -rr, s, s);
  }

  // Full-face flash when it turns square to the source.
  const flash = Math.sin(time * p.flashRate + p.flashPhase);
  if (flash > 0.86) {
    ctx.globalAlpha = (flash - 0.86) / 0.14;
    ctx.drawImage(flashSprites[p.shape], -rr, -rr, s, s);
  }
  ctx.restore();

  /* At the peak of the flash the flake throws a glint. The reference is full
   * of these; they are a different thing from the confetti — a specular
   * event, not an object — so they are added rather than blended. Light
   * arrives on top of what is already there; it does not cover it. */
  if (flash > 0.975 && rr > 5.5) {
    const k = (flash - 0.975) / 0.025;
    const f = rr * (1.8 + k * 2.2);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = k * 0.6;
    ctx.drawImage(flareSprite, px - f, py - f, f * 2, f * 2);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
}

/* Parallax offset for a particle at depth z.
 *
 * Tilting the phone changes the angle you view the pouch from, and the back
 * wall shifts against the front by an amount proportional to the thickness
 * between them. Using the gravity direction as the proxy for that angle
 * costs nothing and is right to first order: upright it is zero, and the
 * further the phone leans the more the layers separate. */
function parallaxX(z) { return z * PARALLAX * gDir.x; }
function parallaxY(z) { return z * PARALLAX * (gDir.y - 1); }
const PARALLAX = 9;

let starSplit = 0, bubbleSplit = 0;

/** Index of the first particle at or in front of the mid-plane. */
function depthSplit(list) {
  let i = 0;
  while (i < list.length && list[i].z < 0) i++;
  return i;
}

function drawParticles(s0, s1, b0, b1, time) {
  for (let i = b0; i < b1; i++) {
    const b = bubbles[i];
    if (b.alpha <= 0 || depthOf(b.x, b.y) > 0) continue;
    drawBubble(b);
  }
  ctx.globalAlpha = 1;
  for (let i = s0; i < s1; i++) {
    const p = stars[i];
    if (depthOf(p.x, p.y) > 0) continue;
    drawStar(p, time);
  }
  ctx.globalAlpha = 1;
}

/* The wall has thickness, and near the silhouette you are looking through a
 * lot of it at a glancing angle.
 *
 * A ray reaching the eye from the edge of the container has been bent inward
 * on its way out, so what you see there is not the liquid immediately behind
 * the glass — it is liquid from further in, brought out to the rim. A wide
 * radial swath of the interior gets squeezed into a narrow band, and the
 * squeeze grows toward the edge because the angle does. That compression is
 * what makes a thick glass object read as an object rather than as a picture
 * with a border drawn on it, and the shaker had only a hairline where the
 * wall should be.
 *
 * Done by drawing the frame back onto itself, magnified about the centre —
 * which is exactly a sample taken from further in — in a handful of bands
 * with the magnification rising outward. Rectangular strips rather than a
 * clipped annulus, because a per-frame clip against this outline is the most
 * expensive thing in the renderer; the corners spill past the squircle and
 * the glass layer's knockout trims them a moment later. Outermost band
 * first, so no band ever samples a region another band has already rewritten.
 */
const BEZEL_BANDS = 6;
const BEZEL_T = 0.075;     // wall thickness, as a fraction of the short half-axis
const BEZEL_REACH = 2.6;   // how many wall-thicknesses deep the rim reaches for its sample

/* Destination offset from the silhouette -> the offset it samples from.
 *
 * Continuous with the interior at the inner face, so the bezel joins the
 * scene without a seam, and reaching `BEZEL_REACH` thicknesses deep at the
 * silhouette itself. Two things follow from that and both are the point: the
 * band pulls in far more depth than it occupies, so what it shows is
 * compressed by that ratio; and the order reverses, the outermost sliver
 * showing the deepest liquid, which is the inversion you see in the rim of
 * any thick glass.
 */
function bezelDepth(d, T) { return T + (T - d) * BEZEL_REACH; }

/* Read from a copy, not from the canvas being drawn to.
 *
 * Two dozen drawImage calls that take the destination canvas as their own
 * source cost 20ms a frame: each one makes the browser snapshot the whole
 * backing store, because it cannot know the regions do not overlap. Copying
 * what the bezel needs into a scratch canvas first turns those into ordinary
 * blits. Only the border is copied — every sample the rim takes lies within
 * four wall-thicknesses of an edge — so it is a quarter of the screen once,
 * rather than the whole of it two dozen times.
 */
let bezelSrc = null, bezelSrcCtx = null;

function bezelCapture(T) {
  const d = Math.ceil(T * (BEZEL_REACH + 1.6) * DPR);
  const w = canvas.width, h = canvas.height;
  bezelSrcCtx.drawImage(canvas, 0, 0, w, d, 0, 0, w, d);
  bezelSrcCtx.drawImage(canvas, 0, h - d, w, d, 0, h - d, w, d);
  const my = d, mh = h - d * 2;
  if (mh > 0) {
    bezelSrcCtx.drawImage(canvas, 0, my, d, mh, 0, my, d, mh);
    bezelSrcCtx.drawImage(canvas, w - d, my, d, mh, w - d, my, d, mh);
  }
}

function bezelBlit(dx, dy, dw, dh, sx, sy, sw, sh) {
  if (dw <= 0.5 || dh <= 0.5 || sw <= 0.5 || sh <= 0.5) return;
  // Source coordinates index the backing store; destination is in CSS pixels.
  ctx.drawImage(bezelSrc, sx * DPR, sy * DPR, sw * DPR, sh * DPR, dx, dy, dw, dh);
}

function drawBezel() {
  const T = Math.min(RX, RY) * BEZEL_T;
  bezelCapture(T);
  const x0 = CX - RX, x1 = CX + RX, y0 = CY - RY, y1 = CY + RY;
  const wide = x1 - x0;
  for (let k = 0; k < BEZEL_BANDS; k++) {
    const a = T * (k / BEZEL_BANDS), b = T * ((k + 1) / BEZEL_BANDS);
    const h = b - a;
    const Da = bezelDepth(a, T), Db = bezelDepth(b, T);
    const sh = Da - Db;                       // deeper than the band is thick
    const u = 1 - (k + 0.5) / BEZEL_BANDS;    // 1 at the silhouette
    ctx.globalAlpha = 0.14 + 0.8 * u * u;

    bezelBlit(x0, y0 + a, wide, h, x0, y0 + Db, wide, sh);
    bezelBlit(x0, y1 - b, wide, h, x0, y1 - Da, wide, sh);
    const my = y0 + T, mh = (y1 - T) - my;
    bezelBlit(x0 + a, my, h, mh, x0 + Db, my, sh, mh);
    bezelBlit(x1 - b, my, h, mh, x1 - Da, my, sh, mh);
  }
  ctx.globalAlpha = 1;
}

/* The render loop deliberately uses no clip() at all.
 *
 * Canvas rasterises a clip against a 100-plus-point path on every use, and
 * the three per-frame clips here (container, liquid body, meniscus glow)
 * cost more than everything else combined — the scene ran at 47fps with
 * zero particles on screen. The container clip is baked into glassLayer's
 * corner knockout, the liquid clip is replaced by culling particles above
 * the waterline, and the meniscus glow simply bleeds a little into the air,
 * which is what a real meniscus does anyway. */
function render(time) {
  const poly = liquidPolygon();

  /* Liquid body, graded along the gravity axis so the deep blue always sits
   * at the top of the pour no matter how the phone is held. Filled across
   * the whole screen rather than into the liquid polygon: the shaker is
   * ~95% full, so painting the small headspace afterwards is far less
   * overdraw than covering the screen twice. */
  const grad = ctx.createLinearGradient(
    CX + up.x * level, CY + up.y * level,
    CX - up.x * upExtent, CY - up.y * upExtent);
  const ramp = CONFIG.ramp;
  for (let i = 0; i < ramp.length; i++) {
    grad.addColorStop(i / (ramp.length - 1), ramp[i]);
  }
  ctx.fillStyle = grad;
  /* Opaque, the fill covers the previous frame on its own. Clear, it does
   * not — so the canvas has to be emptied first or every frame accumulates
   * on the last and the tint walks to opaque within a second. */
  if (CONFIG.glass) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = 1 - CONFIG.glass * 0.86;
  }
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  /* Headspace. Painted as pale tinted air rather than left as page
   * background: white reads as a hole in the wallpaper, which is exactly
   * what made the liquid look like it had drained away.
   *
   * Graded across the air itself, from the inside of the top wall down to
   * the waterline. Spanning the whole container instead left the thin band
   * sampling one end of the ramp, so it rendered as a flat grey slab that
   * read like a UI bar sitting on top of the wallpaper. */
  const air = ctx.createLinearGradient(
    CX + up.x * upExtent, CY + up.y * upExtent,
    CX + up.x * level, CY + up.y * level);
  air.addColorStop(0, "#c9dfec");    // inner top wall, slightly shadowed
  air.addColorStop(0.45, "#eaf5fb");
  air.addColorStop(1, "#a9d4e6");    // liquid showing through the meniscus
  ctx.fillStyle = air;
  ctx.beginPath();
  const far = (span + upExtent) * 2;
  ctx.moveTo(poly[0].x + up.x * far, poly[0].y + up.y * far);
  for (let i = 0; i <= 64; i++) ctx.lineTo(poly[i].x, poly[i].y);
  ctx.lineTo(poly[64].x + up.x * far, poly[64].y + up.y * far);
  ctx.closePath();
  // Air in a clear vessel is the emptiest thing in it: almost all of this
  // has to go, or the headspace reads as a solid pale cap.
  if (CONFIG.glass) ctx.globalAlpha = 1 - CONFIG.glass * 0.9;
  ctx.fill();
  ctx.globalAlpha = 1;

  const menisc = meniscus(poly, 64);   // array of interface segments

  /* Depth pass one: everything behind the mid-plane of the pouch, drawn
   * before the liquid tint so the tint falls over it. Light from a flake at
   * the back wall crosses the full thickness of liquid before it reaches
   * the eye, and gets absorbed and colour-shifted on the way; putting those
   * flakes under the tint layer is that absorption, for free. */
  // Behind the mid-plane: seen through the full thickness of the liquid, so
  // out of focus and washed toward the liquid's own colour.
  farField = true;
  drawParticles(0, starSplit, 0, bubbleSplit, time);
  farField = false;

  /* The dense phase, blitted from the grid and left to the browser's
   * bilinear upscale to smooth. At this grid size that reads as soft
   * marbling — which is what an unmixed second liquid looks like. */
  const dd = dyeImage.data;
  for (let i = 0, n = GW * GH; i < n; i++) {
    let v = dye[i];
    if (v < 0) v = 0; else if (v > 1) v = 1;
    dd[i * 4] = DENSE.r; dd[i * 4 + 1] = DENSE.g; dd[i * 4 + 2] = DENSE.b;
    // Thinned with the rest of the fluid. Left at full strength this is the
    // densest layer in a clear vessel by some margin, and it alone holds the
    // tile at about half opacity however far the dial is turned.
    dd[i * 4 + 3] = (v * DYE_ALPHA) | 0;
  }
  dyeCtx.putImageData(dyeImage, 0, 0);
  ctx.drawImage(dyeCanvas, 0, 0, W, H);

  ctx.drawImage(depthLayer, 0, 0, W, H);

  /* Caustics. The free surface is a lens: where it curves concave it
   * converges the light passing through into a bright shaft in the body
   * below, and where convex it spreads it thin. It is the strongest depth
   * cue a real liquid container has — light arriving through the top and
   * structuring the volume underneath — and without it the body is evenly
   * lit everywhere, which is what made it read flat.
   *
   * Drawn in the gravity frame, so the shafts hang straight down however
   * the phone is held, and added rather than blended because this is light
   * arriving, not a surface. Curvature is taken over a wide stencil: a lens
   * is metres of surface, not one sample.
   */
  /* Drawn small and blitted once.
   *
   * Nineteen full-height additive blits straight onto the canvas cost 8ms a
   * frame in paint — about a whole extra full-screen pass — for shafts that
   * are soft-edged and carry no fine detail. At a fraction of the
   * resolution the upscale supplies the softness for free.
   */
  const cg = causticCtx;
  cg.clearRect(0, 0, CAUSTIC_W, CAUSTIC_H);
  /* The band the shafts actually occupy: from a little above the crest down
   * to where the light has faded out. Blitting the full container instead
   * meant a whole-screen additive composite every frame, and in software
   * rasterisation that alone is most of the frame budget. */
  const bandTop = -(level + upExtent * 0.18);
  const bandH = upExtent * 1.33;
  const reach = upExtent * 1.15;
  const pitch = 2 * span / (N - 1);
  const toX = (v) => (v + span) / (2 * span) * CAUSTIC_W;
  const toY = (v) => (v - bandTop) / bandH * CAUSTIC_H;
  for (let i = 2; i < N - 2; i += 5) {
    const curv = h[i - 2] + h[i + 2] - 2 * h[i];
    /* Irregular by construction. Evenly spaced shafts of equal width read
     * as a machined pattern; two incommensurate frequencies plus a
     * per-shaft width give the uneven spacing real caustics have. */
    const seed = Math.sin(i * 12.9898) * 43758.5453;
    const jitter = seed - Math.floor(seed);
    const amb = 0.05 + 0.032 * Math.sin(time * 0.41 + i * 0.29)
                     + 0.022 * Math.sin(time * 0.23 - i * 0.73);
    const a = Math.max(0, Math.min(0.24, amb + curv * 0.010));
    if (a < 0.012) continue;
    const w = pitch * (5 + jitter * 7);
    const sx = -span + 2 * span * (i / (N - 1)) + (jitter - 0.5) * pitch * 4;
    const sy = -(level + h[i]);
    cg.globalAlpha = a;
    cg.drawImage(shaftSprite, toX(sx - w / 2), toY(sy),
                 w / (2 * span) * CAUSTIC_W, reach / bandH * CAUSTIC_H);
  }
  cg.globalAlpha = 1;

  ctx.save();
  ctx.transform(tan.x, tan.y, -up.x, -up.y, CX, CY);
  ctx.globalCompositeOperation = "lighter";
  ctx.drawImage(causticCanvas, -span, bandTop, 2 * span, bandH);
  ctx.restore();

  // Light pooling just under the surface, the way it does in a real pouch.
  const under = ctx.createLinearGradient(
    CX + up.x * level, CY + up.y * level,
    CX + up.x * (level - upExtent * 0.55),
    CY + up.y * (level - upExtent * 0.55));
  under.addColorStop(0, "rgba(255,255,255,.30)");
  under.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = under;
  ctx.fillRect(0, 0, W, H);

  // Depth pass two: everything in front of the mid-plane, over the tint.
  drawParticles(starSplit, stars.length, bubbleSplit, bubbles.length, time);
  // Fizz last: it is the brightest, smallest thing in the liquid and it
  // belongs on top of the glitter it is swirling around.
  drawFizz();

  /* Meniscus. Three passes: a soft glow bleeding down into the liquid, the
   * bright surface line itself, and a thin darker line above it. One flat
   * stroke reads as a drawn border; this reads as a liquid surface.
   *
   * It is stroked over `menisc`, not the raw surface, because the raw
   * surface runs the full tangent span whether or not the vessel is that
   * wide there. Near the top the container has already curved inward, so
   * the line carried on past the glass and was chopped off by the corner
   * knockout — reading as a hard clip straight across the top of the frame.
   */
  /* The interface is a band, not a line.
   *
   * The pouch has depth, so the air-liquid surface is a real surface seen
   * almost edge-on: it presents a band whose height is roughly the pouch's
   * thickness foreshortened, brightened along its lower edge by light
   * piping through the wedge of liquid under the meniscus. Drawn as a
   * hairline it read as a stroke somebody had drawn on top of the picture.
   */
  const band = Math.max(5, Math.min(RX, RY) * 0.030);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for (const seg of menisc) {
    const path = (off) => {
      ctx.beginPath();
      ctx.moveTo(seg[0].x + up.x * off, seg[0].y + up.y * off);
      for (let i = 1; i < seg.length; i++) {
        ctx.lineTo(seg[i].x + up.x * off, seg[i].y + up.y * off);
      }
    };

    // Body of the band: the lit wedge of liquid held under the surface.
    ctx.beginPath();
    ctx.moveTo(seg[0].x, seg[0].y);
    for (let i = 1; i < seg.length; i++) ctx.lineTo(seg[i].x, seg[i].y);
    for (let i = seg.length - 1; i >= 0; i--) {
      ctx.lineTo(seg[i].x - up.x * band, seg[i].y - up.y * band);
    }
    ctx.closePath();
    const mid = seg[(seg.length / 2) | 0];
    const g = ctx.createLinearGradient(
      mid.x, mid.y, mid.x - up.x * band, mid.y - up.y * band);
    g.addColorStop(0, "rgba(255,255,255,.72)");
    g.addColorStop(0.45, "rgba(214,244,255,.34)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fill();

    // Soft bloom above, into the air.
    ctx.strokeStyle = "rgba(255,255,255,.30)";
    ctx.lineWidth = band * 0.9;
    path(band * 0.45); ctx.stroke();

    // The bright rim itself, and a thin shaded edge just above it.
    ctx.strokeStyle = "rgba(255,255,255,.95)";
    ctx.lineWidth = Math.max(1.4, RX * 0.006);
    path(0); ctx.stroke();

    ctx.strokeStyle = "rgba(126,180,208,.5)";
    ctx.lineWidth = Math.max(1, RX * 0.0035);
    path(band * 0.42); ctx.stroke();
  }
  ctx.lineCap = "butt";
  ctx.lineJoin = "miter";

  // Glass shell, casing edge and corner knockout, all baked at resize.
  drawBezel();
  ctx.drawImage(glassLayer, 0, 0, W, H);
}

/* -------------------------------------------------------------------- step */

/* Fixed timestep.
 *
 * Scaling every force by dt is not enough to make this frame-rate
 * independent, and measurement said so: driving the same 2s of shaking at
 * 30fps and at 60fps left the flow energy 21.6% apart. Semi-Lagrangian
 * advection smears a fixed amount per *step*, and the pressure solve does a
 * fixed number of iterations per *step*, so both get twice the treatment at
 * twice the frame rate no matter how carefully dt is applied.
 *
 * Running the simulation on a fixed tick and accumulating real elapsed time
 * is the only thing that actually fixes it. The cap keeps a stalled tab from
 * trying to catch up across a huge gap.
 */
const FIXED_DT = 1 / 60;
let accumulator = 0;
let simTime = 0;

function step(dt) {
  accumulator += dt;
  let ticks = 0;
  while (accumulator >= FIXED_DT && ticks < 4) {
    simTime += FIXED_DT;
    fixedStep(FIXED_DT, simTime);
    accumulator -= FIXED_DT;
    ticks++;
  }
  if (ticks === 4) accumulator = 0;   // fell too far behind; drop the debt
  return simTime;
}

function fixedStep(dt, time) {
  updateBasis();
  fluidStep(dt);
  stepWaves(dt);

  // Volume conservation: nudge the level until the drawn liquid area matches
  // the target. A feedback loop is far cheaper than solving the tilted
  // squircle's area analytically, and settles within a few frames.
  const clipped = clipToContainer(liquidPolygon());
  if (clipped.length >= 3) {
    const area = polygonArea(clipped);
    if (targetArea === 0) targetArea = area;
    // Raising `level` raises the surface, which *increases* the area — so an
    // over-full container has to pull the level down. Adding here instead
    // makes the loop positively fed back, and the pouch floods to the brim
    // on the first shake.
    level -= (area - targetArea) / (span * 4) * 0.5;
    const limit = upExtent * 1.2;
    level = Math.max(-limit, Math.min(limit, level));
  }

  const pad = Math.min(RX, RY) * 0.03;

  /* Wall response. Reflecting the inward correction and keeping the
   * tangential component lets flakes slide along the glass; the old blanket
   * 65% velocity cut plus a nudge toward the centre killed all energy at the
   * wall and welded settled flakes into a hard line along the rim. */
  const hitWall = (p, ox, oy) => {
    const dx = p.x - ox, dy = p.y - oy;
    const len = Math.hypot(dx, dy);
    if (len < 1e-6) return;
    const nx = dx / len, ny = dy / len;           // points back inside
    const vn = p.vx * nx + p.vy * ny;
    if (vn < 0) { p.vx -= vn * nx * 1.15; p.vy -= vn * ny * 1.15; }
  };

  /* Which way is up, for the bubbles' refracted interiors. Gravity, not the
   * shake: what a bubble is looking through is the liquid's own colour
   * gradient, and that is anchored to gravity. */
  riseAngle = Math.atan2(gDir.y, gDir.x) + Math.PI * 1.5;
  const gAng = Math.atan2(gDir.y, gDir.x);

  for (const p of stars) {
    sampleFlow(p.x, p.y, flow);

    /* The glitter is buoyant, and that is the whole toy.
     *
     * These flakes are lighter than the gel they are suspended in — which is
     * how a liquid-motion shaker is actually built, the liquid loaded until
     * it outweighs the film — so they do not sink, they climb, and they
     * gather in a drift under the waterline. Turning the shaker over puts
     * that drift at the bottom and you watch it float back up. Modelled the
     * other way round it was a sedimentation tank: everything ended on the
     * floor and a flip only gave you the same thing upside down.
     *
     * Terminal velocity relative to the fluid rather than an acceleration
     * that drag then fights: a flake this small reaches its terminal speed
     * almost immediately, so relaxing toward (flow + rise) is both cheaper
     * and better behaved than integrating buoyancy and damping separately.
     *
     * Driven by gravity alone, not gravity plus the shake. Feeding the
     * container's acceleration in here as well double-counts it: relaxing
     * toward `flow` already makes a flake lag a fluid that is being thrown
     * about, and that lag *is* a particle's response to acceleration.
     */
    /* Flutter as a consequence of orientation rather than a free sine. A
     * plate moving through liquid tips, the lift from tipping pushes it
     * sideways, which tips it back — so the sideways force follows the
     * flake's own angle to gravity, and stops when the flake stops turning. */
    const flut = Math.sin(2 * (p.spin - gAng)) * p.flutterAmp * gMag;
    sampleDisperse(p.x, p.y, disperse);
    /* A flake is a plate, not a sphere. Broadside to its travel it presents
     * its whole area to the liquid and creeps; edge-on it presents almost
     * none and slips. Its speed therefore depends on which way it happens to
     * be pointing, and since the spin comes from the local vorticity, the
     * liquid is what decides. That is the stop-start quality of real glitter
     * drifting — it stalls as it turns broadside and slips as it comes
     * round — where a constant terminal speed gives an even glide.
     * Normalised so the population's average rate is unchanged: this adds
     * spread, it does not empty the body faster. */
    const broad = Math.abs(Math.cos(p.spin - gAng));
    /* Hindered rise. A flake climbing through a crowd of other flakes has to
     * drag the liquid they displace down past itself, so a dense suspension
     * moves far slower than a dilute one — Richardson and Zaki's (1 - phi)
     * to the 4.65. It is why a separating suspension forms a sharp front,
     * with clearing liquid behind it and a packing drift ahead, rather than
     * thinning out evenly everywhere. It is also self-limiting, which is
     * what stops the drift under the waterline collapsing into a single
     * hard line: the more crowded it gets there, the slower the next arrival
     * pushes in. */
    /* A flake must not hinder itself. The concentration field is built by
     * dropping each flake's whole area into the cell it sits in, and a big
     * flake covers several cells' worth on its own — 35px of radius against
     * a 14px cell is a solid fraction of nineteen, which pins it to a dead
     * stop in liquid that is otherwise empty. Measured, the big flakes were
     * the slowest thing in the shaker, moving 0.518 to 0.460 over a minute
     * while the fine glitter that is supposed to trail them went 0.473 to
     * 0.336. Hindrance is what the *other* particles do to you. */
    const own = Math.PI * p.r * p.r / (cell * cell);
    const hind = Math.pow(
      Math.max(0, 1 - Math.max(0, sampleConc(p.x, p.y) - own) / PHI_MAX), 4.65);
    const climb = p.terminal * gMag * (1.573 / (1 + 0.9 * broad)) * hind;
    /* Dispersion is a perturbation on the drift, not a transport in its own
     * right, and left unbounded it does not stay one. A stronger climb
     * sharpens the gradient, a sharper gradient strengthens the dispersion
     * pushing back, and past a point the two start trading pushes: raising
     * the pair by a factor of 1.6 took the median flake from 8px/s to
     * 149px/s, which is not settling faster, it is vibrating. Capping it at
     * twice the flake's own rise keeps it in the role it is there for. */
    let dx = disperse.x * DISPERSE, dy = disperse.y * DISPERSE;
    const dm = Math.hypot(dx, dy), cap = DISPERSE_CAP;
    if (dm > cap) { const q = cap / dm; dx *= q; dy *= q; }
    let tx = flow.x - gDir.x * climb - gDir.y * flut + dx;
    let ty = flow.y - gDir.y * climb + gDir.x * flut + dy;

    /* The surface is a ceiling. Buoyancy would otherwise carry the glitter
     * straight through the waterline and into the headspace, where there is
     * no liquid to hold it up. */
    const depth = depthOf(p.x, p.y);
    if (depth > -p.r) {
      const into = tx * up.x + ty * up.y;
      if (into > 0) { tx -= up.x * into; ty -= up.y * into; }
    }

    const k = 1 - Math.exp(-dt / p.tau);
    p.vx += (tx - p.vx) * k;
    p.vy += (ty - p.vy) * k;

    // Third law: whatever drag the liquid applied to the flake, the flake
    // applies back. Rising glitter therefore drives upwelling plumes, and
    // the liquid it displaces has to come down somewhere else.
    scatterForce(p.x, p.y, (flow.x - p.vx) * p.mass * COUPLE,
                           (flow.y - p.vy) * p.mass * COUPLE);
    depositConc(p.x, p.y, p.r * p.r * Math.PI);

    const ox = p.x, oy = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    // Half the local vorticity is the rotation rate of a fluid element,
    // and a small suspended particle simply goes with it.
    p.spin += (0.5 * sampleCurl(p.x, p.y) + p.spinRate * 6) * dt;
    if (clampInside(p, pad)) hitWall(p, ox, oy);
  }

  const invDt = 1 / Math.max(dt, 1e-4);
  for (const b of bubbles) {
    sampleFlow(b.x, b.y, flow);

    /* Vortex shedding. The zigzag frequency follows speed over diameter, so
     * a bubble that stalls in the flow stops weaving and a fast one weaves
     * quickly — and `weave` is zero below the critical size, so fine fizz
     * rises straight. Before, every bubble wove at a fixed rate whatever it
     * was doing. */
    const rvx = b.vx - flow.x, rvy = b.vy - flow.y;
    const rel = Math.hypot(rvx, rvy);
    b.phase += WEAVE_ST * rel / (2 * b.r) * dt;
    const wob = Math.sin(b.phase) * b.weave * rel * 0.5;

    /* Added mass, and the one thing about a bubble that relaxing toward the
     * flow can never reproduce.
     *
     * A body of negligible density accelerates at three times the fluid
     * around it: it has no inertia of its own, so all it carries is the
     * liquid it must shove aside, and the pressure gradient driving that
     * liquid drives the bubble harder still. A bubble therefore *leads* the
     * flow into a turn while everything heavier lags it — which is why the
     * fizz arrives at the far wall before the glitter does. Relaxation only
     * ever lags, so this has to be added explicitly, and it is driven by the
     * fluid's own local acceleration (a material derivative, since the
     * sample follows the bubble) rather than by the container's: what the
     * liquid actually did is what the bubble responds to.
     */
    const ax = (flow.x - b.pfx) * invDt, ay = (flow.y - b.pfy) * invDt;
    b.pfx = flow.x; b.pfy = flow.y;
    const lead = 2 * b.tau;               // 3x the fluid, less the 1x it rides
    const lx = Math.max(-260, Math.min(260, ax * lead));
    const ly = Math.max(-260, Math.min(260, ay * lead));

    const climb = b.rise * gMag;
    const tx = flow.x - gDir.x * climb - gDir.y * wob + lx;
    const ty = flow.y - gDir.y * climb + gDir.x * wob + ly;
    const k = 1 - Math.exp(-dt / b.tau);
    b.vx += (tx - b.vx) * k;
    b.vy += (ty - b.vy) * k;

    if (b.alpha > 0) {
      scatterForce(b.x, b.y, (flow.x - b.vx) * b.mass * COUPLE,
                             (flow.y - b.vy) * b.mass * COUPLE);
      // What fraction of a cell this bubble displaces. The lift it gives the
      // liquid follows from that, next step.
      depositVoid(b.x, b.y, b.alpha * Math.PI * b.r * b.r / (cell * cell));
    }

    const ox = b.x, oy = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (clampInside(b, pad)) hitWall(b, ox, oy);

    // Oblate when climbing: a rising bubble is flattened perpendicular to
    // its motion, and the faster it goes the more so.
    /* Barely any. Oblateness is real, but at these speeds it is a few
     * percent, and rendering it at 0.22 turned every bubble into an egg. */
    const target = Math.min(0.07, Math.hypot(b.vx, b.vy) / (b.rise + 60) * 0.2);
    b.squash += (target - b.squash) * Math.min(1, dt * 5);
    b.z = Math.max(-1, Math.min(1, b.z + b.zDrift * dt));

    /* The free surface is a lid.
     *
     * Nothing stopped a bubble there before — it kept climbing into the
     * headspace for the two seconds its drain timer took, so bubbles were
     * visibly floating in the air above the waterline. A bubble that reaches
     * the surface breaks through it and stays: held in the film, riding
     * proud of the line by a fraction of its radius, because it is buoyant
     * and there is nothing left above it to climb through. */
    const d = depthOf(b.x, b.y);
    const perch = b.r * 0.36;
    if (d > -b.r * 0.9) {
      if (d > perch) {
        const over = d - perch;
        b.x -= up.x * over; b.y -= up.y * over;
        const vn = b.vx * up.x + b.vy * up.y;
        if (vn > 0) { b.vx -= up.x * vn; b.vy -= up.y * vn; }
      }
      if (!b.fading) {
        b.rest += dt;
        /* Film drainage, and it has to be slow.
         *
         * A big bubble's film holds more liquid and takes proportionally
         * longer to thin to the point where it goes — and in a gel this
         * viscous, laden with whatever keeps the glitter in suspension, that
         * is tens of seconds rather than one or two. Which matters for more
         * than the bubble it applies to: bubbles at the surface are packed
         * against each other, so it is where coalescence actually happens,
         * and a foam coarsens by exactly that. Bursting them after a second
         * and a half meant nothing ever got the chance to grow — measured
         * across a hundred seconds, every bubble above 12px died and none
         * replaced it, with the largest in the vessel collapsing from 31px
         * to 7. The bubbles the reference shows are made here. */
        if (b.rest > 10 + b.r * 1.4) { b.fading = true; burstRipple(b); }
      }
    } else if (!b.fading) {
      b.rest = 0;
    }

    if (b.fading) {
      b.rest = 0;
      /* Bursting, not fading. A film that has thinned past the point of
       * holding does not dim in place — it springs outward as the surface
       * tension that was holding it in a sphere lets go. Cheap, and it is
       * the difference between a pop and a bubble being switched off. */
      b.pop += dt * 5.5;
      b.alpha -= dt * 5;
      if (b.alpha <= 0) {
        b.alpha = 0; b.fading = false; b.pop = 1;
        // Reborn small; it will grow again by merging on the way up.
        setBubbleSize(b, bubbleBirthRadius());
        respawnBubble(b);
      }
    } else if (b.alpha < 1) {
      b.alpha = Math.min(1, b.alpha + dt * 1.6);
    }
  }

  // Every other step: merging is a slow process and the pair loop is the
  // most expensive thing the bubbles do.
  stepFizz(dt);

  coalesceTick = !coalesceTick;
  if (coalesceTick) coalesce(dt * 2);

  // Publish this step's concentration for the next one to disperse against.
  const swap = conc; conc = concNext; concNext = swap; concNext.fill(0);
  const gswap = gas; gas = gasNext; gasNext = gswap; gasNext.fill(0);
  let cs = 0, cn = 0;
  for (let k = 0; k < conc.length; k++) {
    if (fsolid[k] || fair[k]) continue;
    cs += conc[k]; cn++;
  }
  concFloor = cn ? Math.max(1e-4, cs / cn) * 0.75 : 1;
}

/* Bubbles that touch merge, conserving gas volume.
 *
 * This is what produces the range of sizes the reference shows: a shaker
 * does not start with big bubbles, it makes them by merging small ones, and
 * the merged bubble then rises faster because buoyancy scales with volume
 * while drag does not. Cheap at this count — the pair loop is a few thousand
 * comparisons — and it gives the population a life cycle rather than a fixed
 * set of sizes cycling forever.
 */
let mergeCount = 0;
let coalesceTick = false;
function coalesce(dt) {
  for (let i = 0; i < bubbles.length; i++) {
    const a = bubbles[i];
    if (a.fading || a.alpha < 0.9) continue;
    for (let j = i + 1; j < bubbles.length; j++) {
      const b = bubbles[j];
      if (b.fading || b.alpha < 0.9) continue;
      /* Only bubbles at a similar depth can touch — but the window was
       * tight enough that wake attraction pulled bubbles into a cluster it
       * then forbade them to merge out of, and they sat there overlapping
       * as a tangle of rings. A bubble is a sphere: if their centres are
       * within a radius in the plane, they are close enough in depth too. */
      if (Math.abs(a.z - b.z) > 0.85) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      const touch = (a.r + b.r) * 0.9;

      /* Wake attraction. A bubble rising in the wake of another meets less
       * resistance, catches up and merges — it is why bubbles in a real
       * liquid form chains and why the big ones exist at all. Without it
       * two bubbles have to collide by chance, which measurement said
       * essentially never happens: zero merges in thirty seconds, so the
       * population only ever shrank as bubbles reached the surface.
       */
      const reach = (a.r + b.r) * 3.5;
      if (d2 < reach * reach && d2 > 1e-3) {
        const d = Math.sqrt(d2);
        // Strongest when one trails the other along the rise axis.
        const align = Math.abs((dx * gDir.x + dy * gDir.y) / d);
        const pull = WAKE * align * (1 - d / reach) * dt;
        const nx = dx / d, ny = dy / d;
        a.vx += nx * pull; a.vy += ny * pull;
        b.vx -= nx * pull; b.vy -= ny * pull;
      }

      if (d2 > touch * touch) continue;

      // Spheres: volumes add, so radii add in cube.
      const merged = Math.cbrt(a.r * a.r * a.r + b.r * b.r * b.r);
      if (merged > maxBubble) {
        /* Too big to merge — a large bubble's film takes far longer to
         * drain than a small one's, so they touch and stay separate. But
         * they are still solid objects: without pushing apart they sat
         * inside one another indefinitely, and a bubble at the size cap
         * plus a neighbour it could never absorb rendered as two rings
         * drawn over each other. */
        const d = Math.sqrt(d2) || 1;
        const nx = dx / d, ny = dy / d;
        const push = (touch - d) * 6;
        a.vx -= nx * push * dt; a.vy -= ny * push * dt;
        b.vx += nx * push * dt; b.vy += ny * push * dt;
        continue;
      }
      const wa = a.r * a.r * a.r, wb = b.r * b.r * b.r, wt = wa + wb;
      a.x = (a.x * wa + b.x * wb) / wt;
      a.y = (a.y * wa + b.y * wb) / wt;
      a.vx = (a.vx * wa + b.vx * wb) / wt;
      a.vy = (a.vy * wa + b.vy * wb) / wt;
      a.z = (a.z * wa + b.z * wb) / wt;
      setBubbleSize(a, merged);
      mergeCount++;

      // The smaller one is consumed; respawn it as fresh fizz down below.
      b.fading = false; b.alpha = 0; b.rest = 0; b.pop = 1;
      setBubbleSize(b, bubbleBirthRadius());
      respawnBubble(b);
      break;
    }
  }
}

/** Sutherland–Hodgman clip of the liquid polygon against the squircle, so the
 *  area feedback measures what is actually drawn rather than the raw slab. */
function clipToContainer(poly) {
  let out = poly;
  for (let i = 0; i < outline.length; i += 6) {
    const a = outline[i];
    const b = outline[(i + 6) % outline.length];
    const ex = b.x - a.x, ey = b.y - a.y;
    const side = (p) => (p.x - a.x) * ey - (p.y - a.y) * ex;
    const next = [];
    for (let j = 0; j < out.length; j++) {
      const cur = out[j], prev = out[(j + out.length - 1) % out.length];
      const dc = side(cur), dp = side(prev);
      if (dc <= 0) {
        if (dp > 0) next.push(intersect(prev, cur, a, b));
        next.push(cur);
      } else if (dp <= 0) {
        next.push(intersect(prev, cur, a, b));
      }
    }
    out = next;
    if (out.length === 0) return [];
  }
  return out;
}

function intersect(p1, p2, a, b) {
  const r = { x: p2.x - p1.x, y: p2.y - p1.y };
  const s = { x: b.x - a.x, y: b.y - a.y };
  const denom = r.x * s.y - r.y * s.x;
  if (Math.abs(denom) < 1e-9) return { x: p2.x, y: p2.y };
  const t = ((a.x - p1.x) * s.y - (a.y - p1.y) * s.x) / denom;
  return { x: p1.x + r.x * t, y: p1.y + r.y * t };
}

/* -------------------------------------------------------------------- loop */

let last = 0, raf = 0;

/* One step of everything, however the clock arrived — the page's own
 * requestAnimationFrame, or a host calling tick(). */
function advance(now) {
  const dt = Math.min((now - last) / 1000 || 0.016, 0.05);
  last = now;
  const t0 = diagOn ? performance.now() : 0;
  // Render on simulation time, not wall time, so the specular flashes stay
  // in step with the physics they belong to.
  render(step(dt));
  if (diagOn) diagSample(now, performance.now() - t0);
}

/* Frame timing, reported to the console.
 *
 * Off unless a host turns it on. Inside a wallpaper there is no devtools to
 * attach and no way to read anything out of the page, so the one number that
 * actually matters there — whether this holds a frame rate on real hardware,
 * which every measurement so far has been a software rasteriser in a
 * container — has to come out through the console and into logcat. */
let diagOn = false, diagFrames = 0, diagJs = 0, diagSince = 0;

function diagSample(now, js) {
  diagFrames++;
  diagJs += js;
  if (now - diagSince < 2000) return;
  const fps = diagFrames * 1000 / (now - diagSince);
  console.log("shaker fps=" + fps.toFixed(1) +
              " js=" + (diagJs / diagFrames).toFixed(1) + "ms" +
              " canvas=" + canvas.width + "x" + canvas.height +
              " stars=" + stars.length + " bubbles=" + bubbles.length +
              " fizz=" + fizz.length);
  diagFrames = 0; diagJs = 0; diagSince = now;
}

function frame(now) {
  raf = requestAnimationFrame(frame);
  advance(now);
}

function start() {
  resize();
  updateBasis();
  // `level` is the surface's signed height along `up`, so a fill above half
  // is a positive offset from centre. Inverting this drains the container.
  level = (CONFIG.fill - 0.5) * 2 * upExtent;
  targetArea = 0;
  h.fill(0); wv.fill(0);
  seed();
  /* One frame drawn synchronously, before anything is scheduled. The manifest
   * icon is a picture of this canvas, and it is asked for on the line after
   * start() returns — with the first frame left to the animation callback the
   * icon was a snapshot of a canvas nothing had drawn into yet. */
  render(simTime);
  last = performance.now();
  if (!raf) raf = requestAnimationFrame(frame);
}

window.addEventListener("resize", () => { resize(); targetArea = 0; });
// A live wallpaper is hidden whenever the launcher is not showing; stopping
// the loop there is the difference between a wallpaper and a battery leak.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); }
});

/* ------------------------------------------------------- running on a phone
 *
 * Three things stand between a page in a browser tab and something that
 * behaves like a wallpaper, and none of them are about the drawing.
 */

/* The screen must not dim while you are watching it. A wallpaper never does;
 * a web page will, in about fifteen seconds. The lock is dropped whenever the
 * page is hidden, so it has to be taken again on the way back. */
let wakeLock = null;
async function keepAwake() {
  if (!navigator.wakeLock || document.visibilityState !== "visible") return;
  try { wakeLock = await navigator.wakeLock.request("screen"); }
  catch (e) { /* refused, or unsupported: there is no second way to ask */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});

/* Browser chrome has to go. Fullscreen needs a gesture to grant it, so it is
 * taken on the first touch — and only on a touch, so that dragging to tilt on
 * a desktop does not throw the window into fullscreen on the first click. */
function goImmersive(e) {
  if (e.pointerType && e.pointerType !== "touch") return;
  keepAwake();
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) {
    el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  }
  window.removeEventListener("pointerdown", goImmersive);
}
window.addEventListener("pointerdown", goImmersive);

/* And it should be installable, because "add to home screen" is the closest
 * a web page gets to being a wallpaper: launched from the home screen it
 * opens fullscreen with no address bar and no tab. The manifest is built here
 * rather than shipped as a second file so that this stays one self-contained
 * page, and the icon is drawn from the same palette and the same flake shapes
 * as the wallpaper, so the thing on the home screen looks like the thing it
 * opens. */
function installIcon(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";

  // The centre square of the live canvas, which in full-bleed mode is the
  // container and in pouch mode is the container plus its backdrop.
  const side = Math.min(canvas.width, canvas.height);
  const ox = (canvas.width - side) / 2, oy = (canvas.height - side) / 2;
  const k = size / side;

  /* Clipped to the vessel's own boundary rather than to a rounded square
   * drawn to resemble it, so the icon is bounded by whatever shape the
   * container actually has — including the corner radius the page was asked
   * for. `outline` is in CSS pixels; the canvas is scaled by DPR on top of
   * that, and the icon is the centre square of the result. */
  g.beginPath();
  for (let i = 0; i < outline.length; i++) {
    const x = (outline[i].x * DPR - ox) * k, y = (outline[i].y * DPR - oy) * k;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
  g.clip();

  /* Drawn from the simulation, not approximated from the palette. The five
   * hand-placed flakes this used to draw were the one thing on the home
   * screen that was not the real optics: no refraction, no caustics, no
   * settled distribution, and a specular that belonged to nothing. */
  g.drawImage(canvas, ox, oy, side, side, 0, 0, size, size);
  return c.toDataURL("image/png");
}

function installManifest() {
  const head = document.head;
  let vp = head.querySelector('meta[name="viewport"]');
  if (!vp) { vp = document.createElement("meta"); vp.name = "viewport"; head.appendChild(vp); }
  vp.content = "width=device-width,initial-scale=1,viewport-fit=cover";

  const theme = document.createElement("meta");
  theme.name = "theme-color";
  theme.content = CONFIG.ramp[0];
  head.appendChild(theme);

  const manifest = {
    name: "Liquid Shaker",
    short_name: "Shaker",
    display: "fullscreen",
    orientation: "portrait",
    background_color: CONFIG.ramp[0],
    theme_color: CONFIG.ramp[0],
    start_url: location.href.split("#")[0],
    icons: [192, 512].map((s) => ({
      src: installIcon(s), sizes: s + "x" + s, type: "image/png", purpose: "any",
    })),
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(
    new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  head.appendChild(link);
}

/* ------------------------------------------------ the native host, if any
 *
 * Inside an Android live wallpaper there is no browser to deliver
 * devicemotion: the page is drawn into a wallpaper surface by a service that
 * owns the sensors itself. So the service feeds them in through here, in the
 * units and the device frame the web event already uses — raw metres per
 * second squared, +y up the screen — which means the two paths land on the
 * same code and there is only one motion model to keep honest.
 */
let hostOffset = null;

window.__shaker = {
  /** Accelerometer, straight off android.hardware.Sensor.TYPE_ACCELEROMETER.
   *  `spin` is rotation about the viewing axis in degrees per second, which
   *  is the gyroscope's z component converted from radians. */
  motion(x, y, z, spin) {
    onMotion({
      accelerationIncludingGravity: { x, y, z },
      rotationRate: spin === undefined ? null : { alpha: spin },
    });
  },

  /* Home-screen page swipes. A wallpaper is wider than the screen and slides
   * under the icons, and sliding a vessel sideways tilts the liquid in it —
   * so this goes in through the surface, the same way turning the phone
   * does, and the sloshing that follows is the wave dynamics doing what they
   * already do rather than an animation laid over the top. */
  offset(t) {
    if (hostOffset === null) { hostOffset = t; return; }
    /* Clamped, because the launcher reports a jump between distant pages as
     * one step and a vessel does not get moved a metre instantaneously. */
    const d = Math.max(-0.3, Math.min(0.3, t - hostOffset));
    hostOffset = t;
    if (!d) return;
    const k = d * span * 0.32;
    for (let i = 0; i < N; i++) {
      h[i] -= k * (-1 + 2 * (i / (N - 1)));
    }
  },

  /* A tap on the glass.
   *
   * Not a push radially away from the point, which is the obvious thing to
   * write and does exactly nothing: a radial source is pure divergence, and
   * an incompressible liquid cannot expand away from a poke, so the pressure
   * projection deletes the whole of it. Measured, the flow was unchanged to
   * the pixel per second.
   *
   * What a poke really does is drive a jet inward and dent the surface over
   * it. The jet is not divergence-free either, but it is not divergence
   * *only* — the projection keeps the part of it that curls, which is the
   * pair of vortices a jet rolls up into, and that is the stir you see. */
  tap(nx, ny) {
    const x = nx * W, y = ny * H;
    const R = Math.min(RX, RY) * 0.26, k = 1400;
    for (let j = 1; j < GH - 1; j++) {
      for (let i = 1; i < GW - 1; i++) {
        const c = j * GW + i;
        if (fsolid[c] || fair[c]) continue;
        const dx = (i + 0.5) * cell - x, dy = (j + 0.5) * cell - y;
        const d = Math.hypot(dx, dy);
        if (d > R) continue;
        const w = 1 - d / R;
        fu[c] += gDir.x * k * w;
        fv[c] += gDir.y * k * w;
      }
    }
    // And the surface dips where it was struck.
    const along = (x - CX) * tan.x + (y - CY) * tan.y;
    const idx = Math.round((along + span) / (2 * span) * (N - 1));
    for (let d = -3; d <= 3; d++) {
      const j = idx + d;
      if (j < 0 || j >= N) continue;
      wv[j] -= 150 * (1 - Math.abs(d) / 4);
    }
  },

  /** The service stops the loop when the wallpaper is not on screen. */
  pause() { cancelAnimationFrame(raf); raf = 0; },
  resume() { last = performance.now(); if (!raf) raf = requestAnimationFrame(frame); },

  /* Hand the clock to the host.
   *
   * Drawn into a wallpaper surface by hand, the page is in a WebView that is
   * not attached to a window, and an unattached WebView has no vsync to hang
   * requestAnimationFrame off — so the loop either throttles hard or never
   * runs. The host that is already waking up once per frame to draw can step
   * the simulation itself instead. */
  drive() { cancelAnimationFrame(raf); raf = 0; last = performance.now(); },
  tick() { advance(performance.now()); },

  /** Frame timing to the console, for a host that has no other way to see it. */
  diag(on) { diagOn = !!on; diagSince = performance.now(); diagFrames = 0; diagJs = 0; },

  /** A picture of the container as it stands right now, clipped to its own
   *  boundary and returned as a PNG data URL. This is what the icon renderer
   *  reads out once it has driven the simulation to the state it wants. */
  icon(size) { return installIcon(size); },
};

start();
installManifest();
</script>
</body>
</html>
