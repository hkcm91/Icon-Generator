<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#287ba8">
<link rel="icon" href="data:,">
<title>Water Ring Toy</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #287ba8; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="toy" aria-label="Interactive water ring toy with two pump buttons"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('toy');
  const ctx = canvas.getContext('2d', { alpha: false });
  const TAU = Math.PI * 2;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const colors = ['#ffd64f', '#8c61e8', '#ff6481', '#ff824d', '#9b5de5', '#e75978', '#c06f3e', '#ef456f', '#ffb447'];
  const pegs = [
    {x:.32,y:.31,l:.105}, {x:.66,y:.25,l:.115}, {x:.65,y:.43,l:.105},
    {x:.32,y:.55,l:.11}, {x:.64,y:.68,l:.11}
  ];
  const buttons = [{x:.17,y:.70,p:0,target:0}, {x:.83,y:.70,p:0,target:0}];
  const rings = [];
  const bubbles = [];
  let w = 1, h = 1, dpr = 1, running = true, externalClock = false, previewMode = false;
  let last = performance.now(), accumulator = 0, scrollTilt = 0, diagOn = false, diagAt = 0, frames = 0;
  let gravityX = 0, gravityY = 1, motionEnergy = 0, surfacePhase = 0, lastShakeAt = -Infinity, activeButton = -1;

  function resetRings() {
    rings.length = 0;
    const starts = [
      [.32,.31], [.66,.25], [.56,.39], [.54,.44], [.53,.51],
      [.69,.66], [.57,.72], [.60,.84], [.72,.86]
    ];
    starts.forEach((p, i) => rings.push({
      x:p[0], y:p[1], vx:rand(-.035,.035), vy:rand(-.02,.02), r:.054,
      color:colors[i], angle:rand(0,TAU), spin:rand(-.6,.6), peg:i<2?i:-1
    }));
  }
  resetRings();

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = Math.max(2, innerWidth); h = Math.max(2, innerHeight);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', resize, {passive:true}); resize();

  function press(index, strength=1) {
    const b = buttons[index];
    b.target = Math.max(b.target, strength);
    b.p = Math.max(b.p, strength * .55);
    for (const r of rings) {
      if (r.peg >= 0 && Math.abs(r.x - b.x) < .52) r.peg = -1;
    }
    /* One press should release a small, readable puff—not fill the chamber
     * with long-lived white fizz. Keep the population low and make the few
     * surviving bubbles large enough to read individually. */
    const bubbleCount = Math.min(6, Math.max(0, 36 - bubbles.length));
    for (let i=0; i<bubbleCount; i++) bubbles.push({
      x:b.x + rand(-.035,.035), y:Math.min(.87,b.y-.055) + rand(-.03,.035),
      vx:rand(-.045,.045), vy:rand(-.34,-.18), r:rand(.006,.016), life:rand(1.5,2.6)
    });
  }

  function release(index) { buttons[index].target = 0; }

  function step(dt) {
    surfacePhase += dt;
    motionEnergy *= Math.pow(.16, dt);
    for (const b of buttons) {
      const rate = b.target > b.p ? 14 : 5.5;
      b.p += (b.target - b.p) * Math.min(1, rate * dt);
    }

    for (const r of rings) {
      if (r.peg >= 0) {
        const p = pegs[r.peg];
        r.x += (p.x-r.x) * Math.min(1,dt*10);
        r.y += (p.y-r.y) * Math.min(1,dt*10);
        r.vx *= .82; r.vy *= .82;
        if (motionEnergy > 1.5) r.peg = -1;
        continue;
      }
      let ax = gravityX * .34;
      let ay = .115 + (gravityY - 1) * .18;
      buttons.forEach((b, bi) => {
        if (b.p < .02) return;
        const dx = r.x - b.x;
        const column = Math.exp(-(dx*dx)/.025);
        ay -= b.p * 3.9 * column * (.84 + .16*(1-r.y));
        ax += b.p * column * (dx * 1.2 + (bi ? -.06 : .06));
      });
      ax += Math.sin(surfacePhase*1.7 + r.y*8) * .012;
      r.vx = (r.vx + ax*dt) * Math.pow(.32,dt);
      r.vy = (r.vy + ay*dt) * Math.pow(.29,dt);
      r.x += r.vx*dt; r.y += r.vy*dt;
      r.angle += r.spin*dt; r.spin *= Math.pow(.65,dt);

      const left=.075+r.r, right=.925-r.r, top=.045+r.r, bottom=.875-r.r;
      if(r.x<left){r.x=left;r.vx=Math.abs(r.vx)*.52;}
      if(r.x>right){r.x=right;r.vx=-Math.abs(r.vx)*.52;}
      if(r.y<top){r.y=top;r.vy=Math.abs(r.vy)*.42;}
      if(r.y>bottom){r.y=bottom;r.vy=-Math.abs(r.vy)*.30;r.vx*=.82;}

      for(let pi=0;pi<pegs.length;pi++){
        const p=pegs[pi], dx=r.x-p.x, dy=r.y-p.y, dist=Math.hypot(dx,dy);
        if(dist < r.r*.52 && Math.hypot(r.vx,r.vy)<.24 && r.vy>=-.04){
          r.peg=pi; r.x=p.x; r.y=p.y; r.vx=r.vy=0; break;
        }
        const px=p.x, py=clamp(r.y,p.y-p.l*.5,p.y+p.l*.5), pd=Math.hypot(r.x-px,r.y-py);
        if(pd<r.r*.40 && pd>.0001){
          const nx=(r.x-px)/pd, ny=(r.y-py)/pd, push=r.r*.40-pd;
          r.x+=nx*push;r.y+=ny*push;
          const vn=r.vx*nx+r.vy*ny;if(vn<0){r.vx-=1.5*vn*nx;r.vy-=1.5*vn*ny;}
        }
      }
    }

    for(let i=0;i<rings.length;i++) for(let j=i+1;j<rings.length;j++){
      const a=rings[i],b=rings[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r*.82+b.r*.82;
      if(d>0&&d<min){const nx=dx/d,ny=dy/d,p=(min-d)*.5;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const q=rv*.62;a.vx+=q*nx;a.vy+=q*ny;b.vx-=q*nx;b.vy-=q*ny;}}
    }

    for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.life-=dt;b.vy-=.022*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.5,dt);if(b.life<=0||b.y<.035)bubbles.splice(i,1);}
  }

  function roundedRect(x,y,ww,hh,r){ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);}
  function draw() {
    const sx=w, sy=h;
    const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#60d5ed');bg.addColorStop(.18,'#3da6cd');bg.addColorStop(1,'#205f91');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
    const pad=Math.max(2,w*.012), radius=Math.min(w*.085,h*.035);
    roundedRect(pad,pad,w-pad*2,h-pad*2,radius);ctx.fillStyle='#287da9';ctx.fill();
    ctx.save();roundedRect(pad,pad,w-pad*2,h-pad*2,radius);ctx.clip();
    const water=ctx.createLinearGradient(0,0,w,h);water.addColorStop(0,'#55c6e2');water.addColorStop(.16,'#3b9bc7');water.addColorStop(.65,'#347faa');water.addColorStop(1,'#245d8c');ctx.fillStyle=water;ctx.fillRect(0,0,w,h);
    ctx.globalAlpha=.16;for(let i=0;i<26;i++){ctx.fillStyle='#e5fbff';ctx.beginPath();ctx.arc(((i*83)%97)/100*w,((i*47)%89)/100*h,Math.max(1,w*.004),0,TAU);ctx.fill();}ctx.globalAlpha=1;
    const waveY=h*(.052 + gravityX*.008 + scrollTilt*.008);ctx.beginPath();ctx.moveTo(0,waveY);for(let x=0;x<=w;x+=8){const y=waveY+Math.sin(x/w*TAU*2+surfacePhase*2.1)*h*(.0015+buttons[0].p*.003+buttons[1].p*.003);ctx.lineTo(x,y);}ctx.lineTo(w,0);ctx.lineTo(0,0);ctx.closePath();ctx.fillStyle='rgba(196,245,252,.55)';ctx.fill();
    ctx.strokeStyle='rgba(218,248,251,.65)';ctx.lineWidth=Math.max(2,w*.012);ctx.lineCap='round';
    for(const p of pegs){ctx.beginPath();ctx.moveTo(p.x*sx,(p.y-p.l*.5)*sy);ctx.lineTo(p.x*sx,(p.y+p.l*.5)*sy);ctx.stroke();ctx.strokeStyle='rgba(155,214,230,.58)';ctx.lineWidth=Math.max(1,w*.007);ctx.stroke();ctx.strokeStyle='rgba(218,248,251,.65)';ctx.lineWidth=Math.max(2,w*.012);}
    for(const b of bubbles){ctx.globalAlpha=clamp(b.life,0,1)*.7;ctx.strokeStyle='#d8f8ff';ctx.lineWidth=Math.max(1,w*.003);ctx.beginPath();ctx.arc(b.x*sx,b.y*sy,b.r*sx,0,TAU);ctx.stroke();}ctx.globalAlpha=1;
    for(const r of rings){const rr=r.r*sx;ctx.save();ctx.translate(r.x*sx,r.y*sy);ctx.rotate(r.angle);ctx.shadowColor='rgba(8,38,73,.38)';ctx.shadowBlur=rr*.28;ctx.shadowOffsetY=rr*.14;ctx.strokeStyle=r.color;ctx.lineWidth=rr*.34;ctx.beginPath();ctx.ellipse(0,0,rr*.82,rr,0,0,TAU);ctx.stroke();ctx.shadowColor='transparent';ctx.strokeStyle='rgba(255,255,255,.24)';ctx.lineWidth=rr*.08;ctx.beginPath();ctx.ellipse(-rr*.1,-rr*.08,rr*.75,rr*.88,0,Math.PI*.95,Math.PI*1.7);ctx.stroke();ctx.restore();}
    const gloss=ctx.createLinearGradient(0,0,w*.18,0);gloss.addColorStop(0,'rgba(255,255,255,.78)');gloss.addColorStop(.35,'rgba(255,255,255,.20)');gloss.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gloss;roundedRect(w*.035,h*.035,w*.12,h*.76,w*.025);ctx.fill();
    const side=ctx.createLinearGradient(w*.84,0,w,0);side.addColorStop(0,'rgba(255,255,255,0)');side.addColorStop(.75,'rgba(225,250,255,.28)');side.addColorStop(1,'rgba(255,255,255,.7)');ctx.fillStyle=side;ctx.fillRect(w*.82,0,w*.18,h);
    ctx.restore();
    ctx.strokeStyle='rgba(232,252,255,.92)';ctx.lineWidth=Math.max(2,w*.012);roundedRect(pad,pad,w-pad*2,h-pad*2,radius);ctx.stroke();
    for(const b of buttons){const rr=w*(.074+b.p*.008),cy=b.y*sy+b.p*h*.004;const g=ctx.createRadialGradient(b.x*sx-rr*.3,cy-rr*.35,rr*.1,b.x*sx,cy,rr);g.addColorStop(0,b.p>.15?'#fff0ca':'#ffd690');g.addColorStop(.55,b.p>.15?'#ffca70':'#ffb64a');g.addColorStop(1,'#dc7f24');ctx.fillStyle=g;ctx.shadowColor='rgba(26,55,75,.4)';ctx.shadowBlur=rr*.35;ctx.beginPath();ctx.arc(b.x*sx,cy,rr,0,TAU);ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='rgba(255,239,197,.65)';ctx.lineWidth=Math.max(1,w*.006);ctx.stroke();}
  }

  function advance(now) {
    if(!running) return;
    const elapsed=clamp((now-last)/1000,0,.05);last=now;accumulator+=elapsed;
    while(accumulator>=1/120){step(1/120);accumulator-=1/120;}
    draw();frames++;
    if(diagOn&&now-diagAt>2000){console.log(`water-toy fps=${(frames*1000/(now-diagAt||1)).toFixed(1)} rings=${rings.length} caught=${rings.filter(r=>r.peg>=0).length} bubbles=${bubbles.length}`);frames=0;diagAt=now;}
    if(!externalClock) requestAnimationFrame(advance);
  }
  requestAnimationFrame(advance);

  function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=point(e);press(p.x<.5?0:1);});
  canvas.addEventListener('pointerup',e=>{const p=point(e);release(p.x<.5?0:1);});
  canvas.addEventListener('pointercancel',()=>{release(0);release(1);});

  function motion(ax,ay,az,spin){
    const gx=clamp(-ax/9.81,-1,1), gy=clamp(ay/9.81,-1,1);
    const residual=Math.hypot(gx-gravityX,gy-gravityY,az/9.81-1);
    gravityX+=(gx-gravityX)*.06;gravityY+=(gy-gravityY)*.06;motionEnergy=Math.max(motionEnergy,residual*3);
    const now=performance.now();
    if(residual>1.15 && now-lastShakeAt>360){const i=ax>0?0:1;lastShakeAt=now;press(i,clamp(residual*.65,.7,1));setTimeout(()=>release(i),140);}
    for(const r of rings)r.spin+=spin*.00008;
  }
  function tap(x,y){const i=x<.5?0:1;if(Math.abs(x-buttons[i].x)<.18&&Math.abs(y-buttons[i].y)<.11){press(i,1);setTimeout(()=>release(i),120);}}
  function button(index,down){if(down)press(index,1);else release(index);}
  function touch(x,y,down){if(down){const i=x<.5?0:1;if(Math.abs(x-buttons[i].x)<.18&&Math.abs(y-buttons[i].y)<.11){activeButton=i;press(i,1);}}else if(activeButton>=0){release(activeButton);activeButton=-1;}}
  function preview(value){previewMode=!!value;}
  function pause(){running=false;}
  function resume(){if(running)return;running=true;last=performance.now();if(!externalClock)requestAnimationFrame(advance);}
  function drive(){externalClock=true;running=true;last=performance.now();}
  function tick(){if(externalClock&&running)advance(performance.now());}
  function offset(v){scrollTilt=clamp((v-.5)*2,-1,1);}
  function diag(v){diagOn=!!v;diagAt=performance.now();frames=0;}
  window.__shaker={motion,tap,button,touch,preview,pause,resume,drive,tick,offset,diag,state:()=>({rings:rings.length,caught:rings.filter(r=>r.peg>=0).length,bubbles:bubbles.length,buttons:buttons.map(b=>b.p),preview:previewMode,running})};
})();
</script>
</body>
</html>
